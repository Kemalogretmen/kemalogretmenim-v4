[build]
  publish = "."

[[redirects]]
  from = "/sinav/:id"
  to = "/.netlify/functions/exam-share?examId=:id"
  status = 200
  force = true

[[redirects]]
  from = "/okuma/:id"
  to = "/.netlify/functions/reading-share?textId=:id"
  status = 200
  force = true

[[redirects]]
  from = "/akilli-tahtam"
  to = "/ogretmen/beyaztahta.html"
  status = 301

# Versioned, tiny fish assets reuse the browser cache between aquarium visits.
[[headers]]
  for = "/assets/akvaryum/canlilar/web-v1/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
