<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kemal Öğretmenim | Makale</title>
  <meta name="robots" content="noindex,follow">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body {
      background:
        radial-gradient(circle at 12% 8%, rgba(108,61,237,.12), transparent 34%),
        radial-gradient(circle at 88% 16%, rgba(255,96,82,.11), transparent 30%),
        linear-gradient(180deg, #FBF9FF 0%, #FFFFFF 48%, #FFF8EF 100%);
    }
    .article-shell {
      width: min(1040px, calc(100% - 32px));
      margin: 42px auto 72px;
      display: grid;
      gap: 24px;
    }
    .article-hero {
      border: 2px solid rgba(226,217,255,.9);
      border-radius: 28px;
      overflow: hidden;
      background: rgba(255,255,255,.72);
      box-shadow: 0 28px 80px rgba(26,16,64,.10);
      backdrop-filter: blur(18px) saturate(1.3);
      -webkit-backdrop-filter: blur(18px) saturate(1.3);
    }
    .article-media {
      min-height: 280px;
      max-height: 520px;
      display: grid;
      place-items: center;
      background: linear-gradient(145deg, #F3EEFF, #FFF9F2);
      overflow: hidden;
    }
    .article-media img {
      width: 100%;
      height: 100%;
      max-height: 520px;
      object-fit: contain;
      background: white;
    }
    .article-media-placeholder {
      width: 112px;
      height: 112px;
      border-radius: 30px;
      display: grid;
      place-items: center;
      background: white;
      color: var(--purple);
      font-size: 54px;
      box-shadow: 0 18px 34px rgba(15,23,42,.12);
    }
    .article-head {
      padding: clamp(24px, 4vw, 42px);
      display: grid;
      gap: 14px;
    }
    .article-kicker {
      width: fit-content;
      border-radius: 999px;
      padding: 7px 11px;
      background: #F4EFFF;
      border: 1px solid #D9CBFF;
      color: var(--purple);
      font-size: 12px;
      font-weight: 900;
    }
    .article-title {
      margin: 0;
      color: var(--navy);
      font-family: var(--font-display);
      font-size: clamp(34px, 6vw, 66px);
      line-height: 1.03;
      letter-spacing: 0;
    }
    .article-summary {
      color: var(--slate);
      font-size: clamp(16px, 2vw, 20px);
      line-height: 1.65;
      font-weight: 800;
      max-width: 860px;
    }
    .article-content {
      padding: clamp(24px, 4vw, 46px);
      border: 2px solid rgba(226,217,255,.9);
      border-radius: 24px;
      background: rgba(255,255,255,.88);
      color: var(--navy);
      font-size: clamp(17px, 1.8vw, 20px);
      line-height: 1.8;
      box-shadow: 0 18px 50px rgba(26,16,64,.08);
    }
    .article-content p,
    .article-content div {
      margin: 0 0 16px;
    }
    .article-content a {
      color: var(--purple);
      font-weight: 900;
      text-decoration: underline;
      text-underline-offset: 4px;
    }
    .article-state {
      padding: 42px;
      border: 2px solid rgba(226,217,255,.9);
      border-radius: 24px;
      background: white;
      color: var(--slate);
      font-weight: 800;
      text-align: center;
      line-height: 1.6;
    }
    .article-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .article-back {
      display: inline-flex;
      width: fit-content;
      align-items: center;
      gap: 8px;
      border-radius: 999px;
      padding: 12px 16px;
      background: var(--purple);
      color: white;
      font-weight: 900;
      text-decoration: none;
      box-shadow: 0 14px 32px rgba(108,61,237,.20);
    }
    @media (max-width: 720px) {
      .article-shell {
        width: min(100% - 22px, 1040px);
        margin-top: 24px;
      }
      .article-media {
        min-height: 210px;
      }
      .article-head,
      .article-content {
        padding: 22px;
      }
    }
  </style>
</head>
<body>
  <main class="article-shell">
    <section class="article-state" id="articleState">Makale yükleniyor...</section>
    <article class="article-hero" id="articleHero" hidden>
      <div class="article-media" id="articleMedia"></div>
      <div class="article-head">
        <span class="article-kicker">Vitrin Yazısı</span>
        <h1 class="article-title" id="articleTitle">Makale</h1>
        <div class="article-summary" id="articleSummary"></div>
        <div class="article-actions">
          <a class="article-back" href="/index.html">Ana Sayfaya Dön</a>
        </div>
      </div>
    </article>
    <section class="article-content" id="articleContent" hidden></section>
  </main>

  <script src="/js/site-data.js"></script>
  <script src="/js/site.js?v=20260901-smartboard"></script>
  <script>
    (function() {
      'use strict';

      function esc(value) {
        return String(value || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;');
      }

      function sanitizeArticleHtml(value) {
        const template = document.createElement('template');
        template.innerHTML = String(value || '');
        const allowedTags = { A:true, B:true, BR:true, DIV:true, EM:true, FONT:true, I:true, LI:true, OL:true, P:true, SPAN:true, STRONG:true, U:true, UL:true };
        function isSafeRichStyle(raw) {
          const parts = String(raw || '').split(';').map(part => part.trim()).filter(Boolean);
          return parts.length > 0 && parts.every(part =>
            /^color:\s*#[0-9a-f]{3,6}$/i.test(part) ||
            /^font-size:\s*(1[0-9]|2[0-9]|3[0-9]|4[0-8])px$/i.test(part)
          );
        }
        function clean(node) {
          Array.from(node.childNodes).forEach(child => {
            if (child.nodeType === Node.ELEMENT_NODE) {
              if (!allowedTags[child.tagName]) {
                child.replaceWith(document.createTextNode(child.textContent || ''));
                return;
              }
              Array.from(child.attributes).forEach(attr => {
                const name = attr.name.toLowerCase();
                if (child.tagName === 'A' && name === 'href') {
                  if (/^(https?:\/\/|\/|#)/i.test(attr.value)) {
                    child.setAttribute('target', '_blank');
                    child.setAttribute('rel', 'noopener noreferrer');
                  } else {
                    child.removeAttribute(attr.name);
                  }
                  return;
                }
                if (child.tagName === 'FONT' && (name === 'color' || name === 'size')) return;
                if (child.tagName === 'SPAN' && name === 'style' && isSafeRichStyle(attr.value)) return;
                child.removeAttribute(attr.name);
              });
              clean(child);
            } else if (child.nodeType !== Node.TEXT_NODE) {
              child.remove();
            }
          });
        }
        clean(template.content);
        return template.innerHTML.trim();
      }

      function stripHtml(value) {
        const div = document.createElement('div');
        div.innerHTML = String(value || '');
        return div.textContent || div.innerText || '';
      }

      function publicStorageUrl(path) {
        if (!path) return '';
        if (/^https?:\/\//i.test(path)) return path;
        const config = window.kemalSiteStore && window.kemalSiteStore.getDocumentsConfig
          ? window.kemalSiteStore.getDocumentsConfig()
          : null;
        if (!config || !config.supabaseUrl) return '';
        return config.supabaseUrl.replace(/\/$/, '') + '/storage/v1/object/public/dokumanlar/' + String(path).split('/').map(encodeURIComponent).join('/');
      }

      async function fetchArticle(id) {
        const config = window.kemalSiteStore && window.kemalSiteStore.getDocumentsConfig
          ? window.kemalSiteStore.getDocumentsConfig()
          : null;
        if (!config || !config.supabaseUrl || !config.supabaseAnonKey || !id) return null;
        const fields = 'id,baslik,aciklama_html,makale_html,icerik_turu,ikon,media_url,media_path,aktif';
        const url = config.supabaseUrl.replace(/\/$/, '') +
          '/rest/v1/homepage_slides?select=' + encodeURIComponent(fields) +
          '&id=eq.' + encodeURIComponent(id) +
          '&aktif=eq.true&limit=1';
        const response = await fetch(url, {
          headers: {
            apikey: config.supabaseAnonKey,
            Authorization: 'Bearer ' + config.supabaseAnonKey,
            'Content-Type': 'application/json'
          }
        });
        if (!response.ok) return null;
        const rows = await response.json();
        return Array.isArray(rows) && rows.length ? rows[0] : null;
      }

      async function init() {
        const state = document.getElementById('articleState');
        const hero = document.getElementById('articleHero');
        const media = document.getElementById('articleMedia');
        const title = document.getElementById('articleTitle');
        const summary = document.getElementById('articleSummary');
        const content = document.getElementById('articleContent');
        const id = new URLSearchParams(window.location.search).get('id') || '';
        const article = await fetchArticle(id);
        const articleHtml = article ? sanitizeArticleHtml(article.makale_html || '') : '';
        if (!article || article.icerik_turu !== 'text' || !articleHtml) {
          state.textContent = 'Bu makale yayında değil veya kaldırılmış olabilir.';
          return;
        }

        const imageUrl = article.media_url || publicStorageUrl(article.media_path);
        title.textContent = article.baslik || 'Makale';
        summary.innerHTML = sanitizeArticleHtml(article.aciklama_html || '') || esc(stripHtml(articleHtml).slice(0, 180));
        content.innerHTML = articleHtml;
        media.innerHTML = imageUrl
          ? '<img src="' + esc(imageUrl) + '" alt="' + esc(article.baslik || 'Makale görseli') + '">'
          : '<span class="article-media-placeholder">' + esc(article.ikon || '⭐') + '</span>';
        document.title = (article.baslik || 'Makale') + ' | Kemal Öğretmenim';
        state.hidden = true;
        hero.hidden = false;
        content.hidden = false;
      }

      document.addEventListener('DOMContentLoaded', init);
    })();
  </script>
</body>
</html>
