async function loadRelatedResultDocs(result){
  const rows=new Map();
  const candidatePairs=[];
  const explicitKey=String(result?.studentKey||'').trim();
  const derivedKey=buildStudentKey(result);
  const oldAccountUid=String(result?.accountUid||result?.userId||'').trim();
  if(oldAccountUid) candidatePairs.push({field:'accountUid',value:oldAccountUid});
  if(explicitKey&&!explicitKey.startsWith('uid:')) candidatePairs.push({field:'studentKey',value:explicitKey});
  if(derivedKey&&derivedKey!==explicitKey) candidatePairs.push({field:'studentKey',value:derivedKey});

  if(!candidatePairs.length){
    const singleSnap=await getDoc(doc(db,'results',result.id));
    if(singleSnap.exists()) rows.set(singleSnap.id,singleSnap);
    return Array.from(rows.values());
  }

  await Promise.all(candidatePairs.map(async pair=>{
    try{
      const snap=await getDocs(query(collection(db,'results'),where(pair.field,'==',pair.value)));
      snap.docs.forEach(docSnap=>rows.set(docSnap.id,docSnap));
    }catch(error){
      console.error(error);
    }
  }));

  if(!rows.has(result.id)){
    const singleSnap=await getDoc(doc(db,'results',result.id));
    if(singleSnap.exists()) rows.set(singleSnap.id,singleSnap);
  }
  if(rows.size<=1){
    try{
      const fallbackSnap=await getDocs(collection(db,'results'));
      const oldNameKey=[normalizeKeyPart(result?.firstName),normalizeKeyPart(result?.lastName)].filter(Boolean).join('|');
      fallbackSnap.docs.forEach(docSnap=>{
        if(rows.has(docSnap.id)) return;
        const data=docSnap.data()||{};
        const nameKey=[normalizeKeyPart(data?.firstName),normalizeKeyPart(data?.lastName)].filter(Boolean).join('|');
        if(oldNameKey&&nameKey===oldNameKey) rows.set(docSnap.id,docSnap);
      });
    }catch(error){
      console.error(error);
    }
  }
  return Array.from(rows.values());
}

async function fbLoadCategoryConfigs(){
  const defaults=createDefaultCategoryMap();
  try{
    const snap=await getDocs(query(collection(db,'examCategories'),orderBy('grade','asc')));
    snap.docs.forEach(row=>{
      const data=row.data()||{};
      const grade=parseInt(data.grade,10);
      if(!GRADES.includes(grade)) return;
      const categories=sanitizeCategoryList(data.categories);
      if(categories.length) defaults[grade]=categories;
    });
    return defaults;
  }catch{
    try{
      const snap=await getDocs(collection(db,'examCategories'));
      snap.docs.forEach(row=>{
        const data=row.data()||{};
        const grade=parseInt(data.grade,10);
        if(!GRADES.includes(grade)) return;
        const categories=sanitizeCategoryList(data.categories);
        if(categories.length) defaults[grade]=categories;
      });
    }catch(error){
      console.error(error);
    }
  }
  return defaults;
}

async function fbLoadSectionCategoryConfigs(categoryMap){
  const defaults=createDefaultSectionCategoryMap();
  const applyRows=snap=>{
    snap.docs.forEach(row=>{
      const data=row.data()||{};
      const grade=parseInt(data.grade,10);
      if(!GRADES.includes(grade)) return;
      const configured=getConfiguredCategoriesForGrade(grade,categoryMap);
      const configuredKeys=new Set(configured.map(item=>normalizeKeyPart(item)));
      const sectionCategories=mergeCategoryLists(
        sanitizeCategoryList(data.sectionCategories),
        configured.filter(isLegacySectionCategoryLabel)
      ).filter(item=>configuredKeys.has(normalizeKeyPart(item)));
      defaults[grade]=sectionCategories;
    });
  };
  try{
    applyRows(await getDocs(query(collection(db,'examCategories'),orderBy('grade','asc'))));
  }catch{
    try{
      applyRows(await getDocs(collection(db,'examCategories')));
    }catch(error){
      console.error(error);
    }
  }
  return defaults;
}

  async saveAs(targetStatus){
    if(A.editExamId){
      if(!requireExamPerm('exam_edit','Sınav düzenleme')) return;
    }else if(!requireExamPerm('exam_create','Sınav oluşturma')) return;
    const t=(document.getElementById('pubTitle')?.value||A.pubTitle||A.examName).trim();
    const rawDisplayOrder=(document.getElementById('pubDisplayOrder')?.value??A.pubDisplayOrder??'').toString().trim();
    const accessScope=(document.getElementById('pubAccessScope')?.value||A.pubAccessScope||'public')==='registered'?'registered':'public';
    const hidden=(document.getElementById('pubHidden')?.value||String(A.pubHidden||false))==='true';
    const selectedGrades=getSelectedExamGrades();
    if(!t){toast('Başlık girin','error');return;}
    if(!selectedGrades.length){toast('En az bir sınıf seçin','error');return;}
    if(!A.questions.length){toast('En az 1 soru ekleyin','error');return;}
    syncQuestionOrder();
    let sectionData;
    try{
      sectionData=prepareQuestionSections(A.questions.length);
    }catch(error){
      toast(error.message,'error');
      return;
    }
    let scoreConfig;
    try{
      scoreConfig=resolveQuestionPoints({
        grade:A.grade,
        subject:A.subject,
        scoringMode:A.scoringMode,
        scoreScaleInput:A.scoreScaleInput,
        questions:A.questions,
        questionSections:sectionData.sections
      });
    }catch(error){
      toast(error.message,'error');
      return;
    }
    const isEdit=!!A.editExamId;
    const actionLabel=targetStatus==='active'
      ? (isEdit?'Sınav güncelleniyor...':'Sınav yayınlanıyor...')
      : targetStatus==='paused'
        ? 'Sınav pasif olarak kaydediliyor...'
        : 'Sınav beklemede kaydediliyor...';

    showLoad(actionLabel);
    let examId=A.editExamId;
    let createdNewExam=false;
    let questionWritesCommitted=false;
    const writtenQuestions=[];
    const uploadedQuestionImages=[];
    try{
      const payload={
        title:t,grade:selectedGrades[0],grades:selectedGrades,subject:A.subject,
        duration:A.pubDur,questionCount:A.questions.length,
        optionCount:A.optionCount,negativeMarking:A.negativeMarking,
        questionSections:sectionData.sections,
        scoringMode:A.scoringMode,
        scoreScale:scoreConfig.scoreScale,
        accessScope:accessScope,
        authRequired:accessScope==='registered',
        hidden:hidden,
        published:targetStatus==='active',
        status:targetStatus,
        updatedAt:serverTimestamp()
      };
      if(A.coverImageUrl&&!A.coverImageRemoved){
        payload.coverImageUrl=A.coverImageUrl;
        if(A.coverImagePath) payload.coverImagePath=A.coverImagePath;
      }else if(isEdit&&A.coverImageRemoved){
        payload.coverImageUrl=deleteField();
        payload.coverImagePath=deleteField();
      }
      const explicitDisplayOrder=rawDisplayOrder===''?null:clampRequestedExamOrder(rawDisplayOrder,getExamPlacementList(A.grade,isEdit?A.editExamId:'').length+1);
      if(isEdit&&explicitDisplayOrder!==null){
        payload.displayOrder=explicitDisplayOrder;
      }

      let existingQuestions=[];
      if(examId){
        const existingQuestionsSnap=await getDocs(query(collection(db,'questions'),where('examId','==',examId)));
        existingQuestions=existingQuestionsSnap.docs;
      }else{
        const createPayload=Object.assign({},payload,{createdAt:serverTimestamp()});
        if(targetStatus==='active'){
          createPayload.published=false;
          createPayload.status='draft';
        }
        const er=await addDoc(collection(db,'exams'),createPayload);
        examId=er.id;
        createdNewExam=true;
      }

      if(A.coverImageData){
        showLoad('Sınav kapak görseli yükleniyor...');
        const uploadedCover=await uploadExamCover(examId,A.coverImageData);
        payload.coverImageUrl=uploadedCover.imageUrl;
        payload.coverImagePath=uploadedCover.imagePath;
        uploadedQuestionImages.push({imagePath:uploadedCover.imagePath});
      }

      if(!isEdit){
        await placeExamAtDisplayOrder(examId,A.grade,explicitDisplayOrder??1);
      }else if(explicitDisplayOrder!==null){
        await placeExamAtDisplayOrder(examId,A.grade,explicitDisplayOrder);
      }

      for(let i=0;i<A.questions.length;i++){
        showLoad(`${i+1}/${A.questions.length}. soru görseli yükleniyor...`);
        const uploadedImage=await uploadQuestionImage(examId,i,A.questions[i].img);
        if(uploadedImage.imagePath){
          uploadedQuestionImages.push({imagePath:uploadedImage.imagePath});
        }
        const preservedImagePath=uploadedImage.imagePath
          ? uploadedImage.imagePath
          : String(A.questions[i].imagePath||'');
        const questionPayload={
          examId:examId,
          imageUrl:uploadedImage.imageUrl,
          imagePath:preservedImagePath,
          correctAnswer:A.questions[i].ans,
          sectionTitle:sectionData.assignments[i+1]||'',
          learningOutcome:String(A.questions[i].learningOutcome||'').trim(),
          pointValue:scoreConfig.questionPoints[i]??0,
          order:A.questions[i].order??i
        };
        if(isEdit){
          const questionRef=doc(collection(db,'questions'));
          writtenQuestions.push({id:questionRef.id,...questionPayload,_ref:questionRef});
        }else{
          const questionRef=await addDoc(collection(db,'questions'),questionPayload);
          writtenQuestions.push({id:questionRef.id,...questionPayload});
        }
      }

      if(isEdit){
        const batch=writeBatch(db);
        batch.update(doc(db,'exams',examId),payload);
        existingQuestions.forEach(qd=>batch.delete(doc(db,'questions',qd.id)));
        writtenQuestions.forEach(question=>{
          const ref=question._ref;
          const cleanPayload={...question};
          delete cleanPayload.id;
          delete cleanPayload._ref;
          batch.set(ref,cleanPayload);
        });
        await batch.commit();
        questionWritesCommitted=true;
        const keepImagePaths=writtenQuestions.reduce((map,question)=>{
          if(question.imagePath) map[question.imagePath]=true;
          return map;
        },{});
        for(const qd of existingQuestions){
          const oldPath=getQuestionImagePath(qd);
          if(oldPath&&!keepImagePaths[oldPath]){
            await removeQuestionImageFromStorage({imagePath:oldPath});
          }
        }
      }

      if(createdNewExam&&(targetStatus==='active'||A.coverImageData)){
        await updateDoc(doc(db,'exams',examId),payload);
      }

      let recalcSummary=null;
      if(isEdit){
        recalcSummary=await recalculateExamResults(examId,{
          title:t,
          grade:A.grade,
          subject:A.subject,
          negativeMarking:A.negativeMarking,
          questionSections:sectionData.sections,
          scoreScale:scoreConfig.scoreScale
        },writtenQuestions);
        const oldCoverPath=String(A.coverImagePath||'');
        const nextCoverPath=String(payload.coverImagePath&&typeof payload.coverImagePath==='string'?payload.coverImagePath:'');
        if(oldCoverPath&&(A.coverImageRemoved||nextCoverPath&&nextCoverPath!==oldCoverPath)){
          await removeQuestionImageFromStorage({imagePath:oldCoverPath});
        }
      }

      const successText=targetStatus==='active'
        ? (isEdit?'🎉 Sınav güncellendi ve yayınlandı!':'🎉 Sınav başarıyla yayınlandı!')
        : targetStatus==='paused'
          ? '⏸ Sınav pasif olarak kaydedildi.'
          : '🕒 Sınav beklemede kaydedildi.';
      toast(successText,'success');
      resetBuilderState('exams');
      const [exams,appeals]=await Promise.all([fbLoadExams(''),fbLoadAppeals()]);
      A.exams=exams;
      A.appeals=appeals;
      hideLoad();render();
      if(recalcSummary?.updated){
        toast(`♻️ ${recalcSummary.updated} öğrenci sonucu yeni cevap anahtarına göre güncellendi.`,'success');
      }
      if(recalcSummary?.skipped){
        toast(`ℹ️ ${recalcSummary.skipped} eski sonuç kaydı soru sayısı uyuşmadığı için otomatik güncellenemedi.`,'info');
      }
    }catch(e){
      if(createdNewExam&&examId){
        try{
          for(const question of writtenQuestions){
            await deleteQuestionWithImage(question);
          }
          for(const question of uploadedQuestionImages){
            await removeQuestionImageFromStorage(question);
          }
          await deleteDoc(doc(db,'exams',examId));
        }catch(cleanupError){
          console.error(cleanupError);
        }
      }else if(!questionWritesCommitted){
        for(const question of uploadedQuestionImages){
          await removeQuestionImageFromStorage(question);
        }
      }
      hideLoad();
      toast('Hata: '+formatPublishError(e),'error');
    }
  },

    if(!requireAnyExamPerm(['exam_list','exam_edit','exam_delete'],'Sınavlar')) return;
    showLoad();
    const [exams,appeals]=await Promise.all([fbLoadExams(gf),fbLoadAppeals()]);

  async cleanupExamStorage(){
    if(!requireExamPerm('exam_delete','Sınav görsel depo temizliği')) return;
    showLoad('Kullanılmayan soru görselleri taranıyor...');
    try{
      await ensureSupabaseAdminSession();
      const [storagePaths,questionSnap]=await Promise.all([
        listQuestionImageStoragePaths(),
        getDocs(collection(db,'questions'))
      ]);
      const usedPaths={};
      questionSnap.docs.forEach(qd=>{
        const path=getQuestionImagePath(qd);
        if(path) usedPaths[path]=true;
      });
      const orphanPaths=storagePaths.filter(path=>!usedPaths[path]);
      hideLoad();
      if(!orphanPaths.length){
        toast('Kullanılmayan sınav görseli bulunmadı.','success');
        return;
      }
      const preview=orphanPaths.slice(0,8).join('\n');
      const extra=orphanPaths.length>8?`\n… +${orphanPaths.length-8} görsel daha`:'';
      const ok=confirm(`${orphanPaths.length} kullanılmayan sınav görseli silinecek.\n\n${preview}${extra}\n\nBu görseller hiçbir soru kaydında kullanılmıyor görünüyor. Devam edilsin mi?`);
      if(!ok) return;
      showLoad('Kullanılmayan sınav görselleri siliniyor...');
      const removedCount=await removeQuestionImageStoragePaths(orphanPaths);
      hideLoad();
      toast(`${removedCount} kullanılmayan sınav görseli silindi.`,'success');
    }catch(e){
      hideLoad();
      toast('Depo temizliği yapılamadı: '+formatPublishError(e),'error');
    }
  },

  async saveResultEdit(id){
    if(!requireExamPerm('exam_results_edit','Sonuç düzenleme')) return;
    const current=A.results.find(item=>item.id===id);
    if(!current){
      toast('Sonuç kaydı bulunamadı','error');
      return;
    }
    const firstName=(document.getElementById('resultEditFirstName')?.value||'').trim();
    const lastName=(document.getElementById('resultEditLastName')?.value||'').trim();
    const grade=parseInt(document.getElementById('resultEditGrade')?.value,10);
    const sube=(document.getElementById('resultEditSube')?.value||'').trim();
    const city=(document.getElementById('resultEditCity')?.value||'').trim();
    const school=(document.getElementById('resultEditSchool')?.value||'').trim();
    const accountUid=(document.getElementById('resultEditAccountUid')?.value||'').trim();
    if(!firstName||!lastName||!Number.isFinite(grade)||grade<1||grade>8){
      toast('Ad, soyad ve geçerli sınıf bilgisi zorunludur','error');
      return;
    }
    const studentKey=accountUid?`uid:${accountUid}`:buildStudentKey({firstName,lastName,grade,sube});
    const payload={firstName,lastName,grade,sube,city,school,studentKey,accountUid};
    showLoad('Sonuç kaydı güncelleniyor...');
    try{
      const relatedResultDocs=await loadRelatedResultDocs(current);
      const resultBatch=writeBatch(db);
      relatedResultDocs.forEach(docSnap=>{
        resultBatch.update(docSnap.ref,{...payload,updatedAt:serverTimestamp()});
      });
      await resultBatch.commit();

      const appealBatches=[];
      await Promise.all(relatedResultDocs.map(async docSnap=>{
        const appealSnap=await getDocs(query(collection(db,'resultAppeals'),where('resultId','==',docSnap.id)));
        if(appealSnap.empty) return;
        const batch=writeBatch(db);
        appealSnap.docs.forEach(appealDoc=>{
          batch.update(appealDoc.ref,{firstName,lastName,grade,sube,city,school,studentKey,accountUid});
        });
        appealBatches.push(batch.commit());
      }));
      if(appealBatches.length) await Promise.all(appealBatches);

      A.results=await fbLoadResults(A.rf);
      if(A.appeals?.length) A.appeals=await fbLoadAppeals();
      hideLoad();
      this.closeResultEdit();
      setContent(renderAdminResults());
      toast(`${relatedResultDocs.length} sonuç kaydı güncellendi`,'success');
    }catch(error){
      hideLoad();
      toast('Sonuç kaydı güncellenemedi: '+error.message,'error');
    }
  },

          ${review?.message?`<div style="margin-bottom:14px;padding:12px 14px;border-radius:16px;background:#F8FAFC;border:1px solid var(--border);font-size:13px;line-height:1.8;color:var(--slate)"><strong style="color:var(--navy)">Son karar notu:</strong> ${esc(review.message)}</div>`:''}
          <div style="border:1px solid var(--border);border-radius:18px;background:#F8FAFC;padding:14px;margin-bottom:16px">
            ${imageSrc
              ? `<img src="${imageSrc}" alt="${questionNo}. soru" style="width:100%;max-height:min(48vh,520px);object-fit:contain;border-radius:14px;background:#fff;border:1px solid var(--border)">`
              : `<div style="padding:24px;border:1px dashed var(--border);border-radius:14px;background:#fff;color:var(--muted);font-size:14px;line-height:1.8">Bu soru için görsel verisi bulunamadı.</div>`
            }
          </div>
          <div style="padding:16px;border-radius:18px;background:#F8FAFC;border:1px solid var(--border);position:sticky;bottom:0;z-index:2">
            <div style="font-family:var(--fd);font-size:18px;font-weight:900;margin-bottom:8px">Cevap Anahtarı İncelemesi</div>
            <p class="text-sm text-muted" style="margin-bottom:12px;line-height:1.8">Doğru cevabı aşağıdan seç. Eğer seçtiğin cevap öğrencinin verdiği cevapla aynıysa sistem bu soruyu otomatik olarak <strong>Haklı bulundu düzeltildi</strong> olarak işaretler. Cevap anahtarında değişiklik yapmayacaksan bu soru için <strong>Reddet</strong> seçeneğini kullan.</p>
            <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px">${answerButtons}</div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between">
              <div style="display:flex;gap:8px;flex-wrap:wrap">
                <button class="btn btn-green" type="button" onclick="W.applyAppealCorrection()">✅ Düzeltmeyi Uygula</button>
                <button class="btn btn-red" type="button" onclick="W.rejectAppealQuestion()">⛔ Reddet</button>
              </div>
              <div style="display:flex;gap:8px;flex-wrap:wrap">
                <button class="btn btn-outline" type="button" onclick="W.selectAppealInspectQuestion(${Math.max(0,ctx.currentIndex-1)})" ${ctx.currentIndex===0?'disabled':''}>‹ Önceki</button>
                <button class="btn btn-outline" type="button" onclick="W.selectAppealInspectQuestion(${Math.min(ctx.questionNos.length-1,ctx.currentIndex+1)})" ${ctx.currentIndex===ctx.questionNos.length-1?'disabled':''}>Sonraki ›</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>`;
  },
  async inspectAppeal(appealId){
    if(!requireExamPerm('exam_appeals','İtiraz inceleme')) return;
    const appeal=A.appeals.find(item=>item.id===appealId);
    if(!appeal){
      toast('İtiraz kaydı bulunamadı','error');
      return;
    }
    showLoad('İtiraz edilen sorular hazırlanıyor...');
    try{
      const [resultSnap,questions,examSnap]=await Promise.all([
        getDoc(doc(db,'results',appeal.resultId)),
        fbLoadExamQuestions(appeal.examId),
        getDoc(doc(db,'exams',appeal.examId))
      ]);
      if(!resultSnap.exists()) throw new Error('Sonuç kaydı bulunamadı.');
      if(!examSnap.exists()) throw new Error('Sınav kaydı bulunamadı.');
      const result={id:resultSnap.id,...resultSnap.data()};
      const exam={id:examSnap.id,...examSnap.data()};
      const detailMap=new Map((Array.isArray(result.answerDetails)?result.answerDetails:[]).map(item=>[parseInt(item?.questionNo,10),{...item}]));
      const questionNos=getAppealQuestionNumbers(appeal);
      A.appealInspect={
        appealId,
        appeal:{...appeal},
        exam,
        result,
        questions:[...questions],
        detailMap,
        questionNos,
        currentIndex:0,
        selectedAnswer:String(questions[questionNos[0]-1]?.correctAnswer||detailMap.get(questionNos[0])?.correctAnswer||'A').trim().toUpperCase()
      };
      this.renderAppealInspectModal();
    }catch(error){
      toast(error.message||'İtiraz detayları açılamadı','error');
    }finally{
      hideLoad();
    }
  },
  selectAppealInspectQuestion(index){
    if(!A.appealInspect) return;
    const nextIndex=Math.max(0,Math.min(A.appealInspect.questionNos.length-1,index));
    const questionNo=A.appealInspect.questionNos[nextIndex];
    const detail=A.appealInspect.detailMap.get(questionNo)||{};
    const question=A.appealInspect.questions[questionNo-1]||{};
    A.appealInspect.currentIndex=nextIndex;
    A.appealInspect.selectedAnswer=String(question.correctAnswer||detail.correctAnswer||'A').trim().toUpperCase();
    this.renderAppealInspectModal();
  },
  selectAppealCorrectAnswer(answer){
    if(!A.appealInspect) return;
    A.appealInspect.selectedAnswer=String(answer||'').trim().toUpperCase();
    this.renderAppealInspectModal();
  },
  async persistAppealQuestionReview(appeal,review){
    const questionReviews=upsertAppealQuestionReview(appeal,review);
    const nextAppeal={
      ...appeal,
      questionReviews,
      status:deriveAppealStatus({...appeal,questionReviews}),
      reviewedBy:currentUser?.uid||'',
      reviewedAt:{seconds:Math.floor(Date.now()/1000)}
    };
    await updateDoc(doc(db,'resultAppeals',appeal.id),{
      questionReviews,
      status:nextAppeal.status,
      reviewedAt:serverTimestamp(),
      reviewedBy:currentUser?.uid||''
    });
    A.appeals=A.appeals.map(item=>item.id===appeal.id?nextAppeal:item);
    if(A.appealInspect?.appeal?.id===appeal.id) A.appealInspect.appeal=nextAppeal;
    setContent(renderAdminExams());
    return nextAppeal;
  },
  async applyAppealCorrection(){
    if(!requireExamPerm('exam_appeals','İtiraz düzeltme')) return;
    const ctx=A.appealInspect;
    if(!ctx) return;
    const questionNo=ctx.questionNos[ctx.currentIndex];
    const question=ctx.questions[questionNo-1];
    if(!question){
      toast('Soru kaydı bulunamadı','error');
      return;
    }
    const nextAnswer=String(ctx.selectedAnswer||'').trim().toUpperCase();
    const currentAnswer=String(question.correctAnswer||'').trim().toUpperCase();
    if(!nextAnswer){
      toast('Lütfen doğru cevabı seçin.','error');
      return;
    }
    if(nextAnswer===currentAnswer){
      toast('Seçtiğiniz cevap mevcut anahtarla aynı. Hata yoksa bu soru için Reddet seçeneğini kullanın.','info');
      return;
    }
    showLoad('Cevap anahtarı güncelleniyor...');
    try{
      await updateDoc(doc(db,'questions',question.id),{correctAnswer:nextAnswer});
      ctx.questions[questionNo-1]={...question,correctAnswer:nextAnswer};
      const recalcSummary=await recalculateExamResults(ctx.exam.id,{
        title:ctx.exam.title,
        grade:ctx.exam.grade,
        subject:ctx.exam.subject,
        negativeMarking:ctx.exam.negativeMarking,
        questionSections:Array.isArray(ctx.exam.questionSections)?ctx.exam.questionSections:[]
      },ctx.questions);
      const updatedResult=calculateRevisedResultSnapshot(ctx.result,ctx.exam,ctx.questions);
      if(updatedResult){
        ctx.result={...ctx.result,...updatedResult};
        ctx.detailMap=new Map(updatedResult.answerDetails.map(item=>[parseInt(item.questionNo,10),{...item}]));
        A.results=A.results.map(item=>item.id===ctx.result.id?{...item,...updatedResult}:item);
      }
      const latestDetail=ctx.detailMap.get(questionNo)||{};
      const studentAnswer=String(latestDetail.selectedAnswer||'').trim().toUpperCase();
      const reviewStatus=studentAnswer&&studentAnswer===nextAnswer?'accepted_corrected':'corrected_no_score_change';
      const reviewMessage=reviewStatus==='accepted_corrected'
        ? 'Haklı bulundu, cevap anahtarı düzeltildi ve öğrenci sonucu güncellendi.'
        : 'Cevap anahtarı düzeltildi ancak bu öğrencinin verdiği cevap yeni anahtarla da uyuşmuyor.';
      await this.persistAppealQuestionReview(ctx.appeal,{
        questionNo,
        status:reviewStatus,
        previousCorrectAnswer:currentAnswer,
        updatedCorrectAnswer:nextAnswer,
        studentAnswer:studentAnswer||'',
        reviewedAt:Date.now(),
        reviewedBy:currentUser?.uid||'',
        message:reviewMessage,
        studentNoticeState:'queued'
      });
      ctx.selectedAnswer=nextAnswer;
      this.renderAppealInspectModal();
      toast(reviewStatus==='accepted_corrected'
        ? 'Soru haklı bulundu ve cevap anahtarı düzeltildi.'
        : 'Cevap anahtarı düzeltildi; bu öğrencinin sonucu değişmedi.',reviewStatus==='accepted_corrected'?'success':'info');
      if(recalcSummary?.updated){
        toast(`♻️ ${recalcSummary.updated} öğrenci sonucu yeniden hesaplandı.`,'success');
      }
    }catch(error){
      toast('Cevap anahtarı güncellenemedi: '+error.message,'error');
    }finally{
      hideLoad();
    }
  },
  async rejectAppealQuestion(){
    if(!requireExamPerm('exam_appeals','İtiraz reddetme')) return;
    const ctx=A.appealInspect;
    if(!ctx) return;
    const questionNo=ctx.questionNos[ctx.currentIndex];
    const detail=ctx.detailMap.get(questionNo)||{};
    try{
      await this.persistAppealQuestionReview(ctx.appeal,{
        questionNo,
        status:'rejected',
        previousCorrectAnswer:String(detail.correctAnswer||ctx.questions[questionNo-1]?.correctAnswer||'').trim().toUpperCase(),
        updatedCorrectAnswer:String(detail.correctAnswer||ctx.questions[questionNo-1]?.correctAnswer||'').trim().toUpperCase(),
        studentAnswer:String(detail.selectedAnswer||'').trim().toUpperCase(),
        reviewedAt:Date.now(),
        reviewedBy:currentUser?.uid||'',
        message:'İtiraz incelendi, cevap anahtarında değişiklik gerekmedi.',
        studentNoticeState:'queued'
      });
      this.renderAppealInspectModal();
      toast(`${questionNo}. soru için itiraz reddedildi.`,'success');
    }catch(error){
      toast('İtiraz reddedilemedi: '+error.message,'error');
    }
  },
  async setAppealStatus(appealId,status,examId){
    if(!requireExamPerm('exam_appeals','İtiraz durumu')) return;
    const labels={pending:'İncelemede',accepted:'haklı',rejected:'reddedildi'};
    try{
      await updateDoc(doc(db,'resultAppeals',appealId),{
        status,
        reviewedAt:serverTimestamp(),
        reviewedBy:currentUser?.uid||''
      });
      A.appeals=A.appeals.map(item=>item.id===appealId?{...item,status,reviewedBy:currentUser?.uid||'',reviewedAt:{seconds:Math.floor(Date.now()/1000)}}:item);
      toast(`İtiraz durumu ${labels[status]||status} olarak güncellendi.`,'success');
      this.showExamAppeals(examId);
      setContent(renderAdminExams());
    }catch(error){
      toast('İtiraz durumu güncellenemedi: '+error.message,'error');
    }
  },
  async deleteAppeal(appealId,examId){
    if(!requireExamPerm('exam_appeals','İtiraz silme')) return;
    if(!confirm('Bu itiraz kaydını silmek istiyor musunuz?')) return;
    try{
      await deleteDoc(doc(db,'resultAppeals',appealId));
      A.appeals=A.appeals.filter(item=>item.id!==appealId);
      toast('İtiraz kaydı silindi.','success');
      this.closeAppealInspect();
      this.showExamAppeals(examId);
      setContent(renderAdminExams());
    }catch(error){
      toast('İtiraz kaydı silinemedi: '+error.message,'error');
    }
  },
  exportXlsx(){
    if(!requireAnyExamPerm(['exam_results','exam_results_edit','exam_results_delete'],'Sonuçlar')) return;
    if(!A.results.length){toast('Dışa aktarılacak kayıt yok','error');return;}
    const summary=A.results.map(r=>({
      'Ad':r.firstName,'Soyad':r.lastName,
      'Sınıf':r.grade+'. Sınıf','Şube':r.sube||'—',
      'İl':r.city||'—','Okul':r.school||'—',
      'Durum':getResultProgressMeta(r.status).label,
      'Üye UID':r.accountUid||'—',
      'Öğrenci Anahtarı':getResultStudentKey(r),
      'Ders':r.subject||'—','Sınav':r.examTitle||'—',
      'Doğru':r.correct,'Yanlış':r.wrong,'Boş':r.blank,
      'Net':r.netCorrect??'—',
      'Sınav Puanı':r.examScore??r.score??'—',
      'Puan Ölçeği':r.scoreScale??100,
      'Başarı (%)':r.score,'Tarih':fmtDT(r.date)
    }));
    const detailRows=[];
    A.results.forEach(r=>{
      const details=Array.isArray(r.answerDetails)?r.answerDetails:[];
      if(!details.length){
        detailRows.push({
          'Ad':r.firstName,'Soyad':r.lastName,'Sınıf':r.grade+'. Sınıf','Şube':r.sube||'—',
          'İl':r.city||'—','Okul':r.school||'—',
          'Durum':getResultProgressMeta(r.status).label,
          'Üye UID':r.accountUid||'—',
          'Öğrenci Anahtarı':getResultStudentKey(r),
          'Ders':r.subject||'—','Sınav':r.examTitle||'—','Soru No':'—',
          'Sınav Puanı':r.examScore??r.score??'—','Puan Ölçeği':r.scoreScale??100,
          'Sonuç':'Detay yok','Verilen Cevap':'—','Doğru Cevap':'—'
        });
        return;
      }
      details.forEach(item=>{
        const outcome=item.outcome==='D'?'Doğru':item.outcome==='Y'?'Yanlış':'Boş';
        detailRows.push({
          'Ad':r.firstName,'Soyad':r.lastName,'Sınıf':r.grade+'. Sınıf','Şube':r.sube||'—',
          'İl':r.city||'—','Okul':r.school||'—',
          'Durum':getResultProgressMeta(r.status).label,
          'Üye UID':r.accountUid||'—',
          'Öğrenci Anahtarı':getResultStudentKey(r),
          'Ders':r.subject||'—','Bölüm / Üst Başlık':item.sectionTitle||r.subject||'—','Kazanım / Öğrenme Çıktısı':item.learningOutcome||'—','Sınav':r.examTitle||'—','Soru No':item.questionNo,
          'Soru Puanı':item.pointValue??'—','Sınav Puanı':r.examScore??r.score??'—','Puan Ölçeği':r.scoreScale??100,
          'Sonuç':outcome,'Verilen Cevap':item.selectedAnswer||'Boş','Doğru Cevap':item.correctAnswer||'—'
        });
      });
    });
    const ws=XLSX.utils.json_to_sheet(summary);
    const wsDetail=XLSX.utils.json_to_sheet(detailRows);
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,'Özet');
    XLSX.utils.book_append_sheet(wb,wsDetail,'Soru Detay');
    XLSX.writeFile(wb,'sinav_sonuclari_detayli.xlsx');
    toast('📥 Excel indiriliyor...','success');
  }
};
window.W=W;window.A=A;

async function checkIsAdmin(uid){
  let firebaseAllowed=false;
  try{
    const snap=await getDoc(doc(db,'admins',uid));
    firebaseAllowed=snap.exists();
  }catch(e){
    console.error(e);
  }
  currentAdminAccessProfile=null;
  try{
    if(window.kemalAdminAuth&&typeof window.kemalAdminAuth.getAdminAccessProfile==='function'){
      currentAdminAccessProfile=await window.kemalAdminAuth.getAdminAccessProfile(true);
    }
  }catch(error){
    currentAdminAccessProfile=null;
  }
  if(currentAdminAccessProfile&&!currentAdminAccessProfile.legacyMode&&!currentAdminAccessProfile.isOwner){
    return firebaseAllowed&&currentAdminAccessProfile.active!==false&&hasAnyExamPerm([
      'exam_create','exam_categories','exam_category_create','exam_category_edit','exam_category_delete',
      'exam_list','exam_edit','exam_delete','exam_results','exam_results_edit','exam_results_delete',
      'exam_single_report','exam_report_center','exam_appeals'
    ]);
  }
  return firebaseAllowed;
}

onAuthStateChanged(auth, async (user) => {
  authReady=true;
  currentUser=user||null;
  currentUserIsAdmin=false;
  if(user) currentUserIsAdmin=await checkIsAdmin(user.uid);
  if(currentUserIsAdmin){
    await syncCategoryConfigState();
    const requestedPage=getRequestedPageFromHash();
    const firstPage=firstAllowedExamPage();
    if(!canOpenExamPage(A.page)&&firstPage){
      A.page=firstPage;
    }
    if(requestedPage&&requestedPage!=='create'&&canOpenExamPage(requestedPage)){
      await W.nav(requestedPage);
      return;
    }
  }
  render();
});

function render(){
  if(!authReady){
    appEl().innerHTML=`<div class="spinner" style="margin-top:100px"></div>`;
    return;
  }
  if(!currentUser){renderLogin();return;}
  if(!currentUserIsAdmin){renderNotAuthorized();return;}
  if(!canOpenExamPage(A.page)){
    const nextPage=firstAllowedExamPage();
    if(nextPage){
      A.page=nextPage;
    }else{
      appEl().innerHTML='<div class="page-pad"><div class="card p-6">Bu hesap için açık sınav yönetimi yetkisi bulunmuyor.</div></div>';
      return;
    }
  }
  if(A.page==='create'){renderShell(renderCreate());afterCreateRender();}
  else if(A.page==='categories') renderShell(renderAdminCategories());
  else if(A.page==='exams') renderShell(renderAdminExams());
  else if(A.page==='results') renderShell(renderAdminResults());
}
window.addEventListener('hashchange',()=>{
  const requestedPage=getRequestedPageFromHash();
  if(requestedPage&&requestedPage!==A.page&&currentUserIsAdmin&&canOpenExamPage(requestedPage)){
    W.nav(requestedPage);
  }else if(requestedPage&&currentUserIsAdmin&&!canOpenExamPage(requestedPage)){
    toast('Bu sınav alanı için yetkiniz yok.','error');
  }
});
let resultsRefreshTick=0;
function queueResultsRefreshOnFocus(){
  if(!currentUserIsAdmin||A.page!=='results') return;
  const now=Date.now();
  if(now-resultsRefreshTick<2500) return;
  resultsRefreshTick=now;
  refreshResultsData(true);
}
window.addEventListener('focus',queueResultsRefreshOnFocus);
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible') queueResultsRefreshOnFocus();
});
render();
</script>
