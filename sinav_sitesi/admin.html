<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Paneli — Kemal Öğretmenim</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/admin-shell.css?v=20260526-2">
<style>
:root{
  --purple:#6C3DED;--purple-d:#5428C9;--purple-l:#8B5CF6;
  --navy:#0F172A;--slate:#475569;--muted:#94A3B8;
  --border:#E2E8F0;--cream:#F8F6FF;--white:#fff;
  --green:#10B981;--green-d:#059669;
  --red:#EF4444;--red-d:#DC2626;
  --yellow:#F59E0B;--teal:#0EA5E9;
  --bg:#F1F5F9;
  --r-sm:8px;--r:12px;--r-lg:16px;--r-xl:24px;
  --sh-sm:0 1px 3px rgba(0,0,0,.08);
  --sh:0 4px 12px rgba(0,0,0,.08);
  --sh-lg:0 10px 30px rgba(0,0,0,.12);
  --sh-xl:0 20px 40px rgba(0,0,0,.15);
  --fd:'Nunito',sans-serif;--fb:'Outfit',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--fb);background:var(--bg);color:var(--navy);min-height:100vh}
h1,h2,h3,h4{font-family:var(--fd)}

/* UTILITIES */
.flex{display:flex}.items-center{align-items:center}.justify-between{justify-content:space-between}
.justify-center{justify-content:center}.gap-8{gap:8px}.gap-12{gap:12px}.gap-16{gap:16px}
.flex-1{flex:1}.flex-col{flex-direction:column}.flex-wrap{flex-wrap:wrap}
.text-center{text-align:center}.text-muted{color:var(--muted)}.text-sm{font-size:13px}.text-xs{font-size:11px}
.font-bold{font-weight:700}.font-semi{font-weight:600}
.p-4{padding:16px}.p-6{padding:24px}.mb-4{margin-bottom:16px}.mb-6{margin-bottom:24px}
.w-full{width:100%}

/* CARD */
.card{background:var(--white);border-radius:var(--r);box-shadow:var(--sh-sm);border:1px solid var(--border)}

/* BUTTONS */
.btn{padding:9px 18px;border-radius:var(--r-sm);border:none;cursor:pointer;font-weight:700;font-size:14px;font-family:var(--fb);transition:all .18s;display:inline-flex;align-items:center;justify-content:center;gap:7px;white-space:nowrap}
.btn:disabled{opacity:.4;cursor:not-allowed;pointer-events:none}
.btn-primary{background:linear-gradient(135deg,var(--purple),var(--purple-l));color:#fff;box-shadow:0 3px 10px rgba(108,61,237,.3)}
.btn-primary:hover:not(:disabled){box-shadow:0 5px 18px rgba(108,61,237,.4);transform:translateY(-1px)}
.btn-green{background:var(--green);color:#fff}.btn-green:hover:not(:disabled){background:var(--green-d)}
.btn-red{background:var(--red);color:#fff}.btn-red:hover:not(:disabled){background:var(--red-d)}
.btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--slate)}.btn-outline:hover:not(:disabled){border-color:var(--purple);color:var(--purple)}
.btn-lg{padding:12px 24px;font-size:15px}.btn-sm{padding:6px 12px;font-size:12px}

/* FORM */
.form-label{display:block;font-weight:700;font-size:12px;margin-bottom:5px;color:var(--navy)}
.form-input{width:100%;padding:10px 13px;border:1.5px solid var(--border);border-radius:var(--r-sm);font-size:14px;font-family:var(--fb);outline:none;transition:border-color .2s;color:var(--navy);background:var(--white)}
.form-input:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(108,61,237,.1)}
.badge{padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700}
.badge-blue{background:#DBEAFE;color:var(--purple)}

/* SIDEBAR */
.admin-wrap{display:flex;min-height:100vh}
.sidebar{width:230px;background:var(--navy);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:50}
.sidebar-head{padding:20px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.sidebar-head h2{font-size:14px;font-weight:900;color:#fff;line-height:1.3}
.sidebar-head p{font-size:11px;color:rgba(255,255,255,.3);margin-top:2px}
.sidebar-nav{padding:10px 8px;flex:1;overflow-y:auto}
.snav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;color:rgba(255,255,255,.5);font-size:13px;font-weight:600;transition:all .18s;margin-bottom:2px;font-family:var(--fb)}
.snav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.snav-item.active{background:linear-gradient(135deg,var(--purple),var(--purple-l));color:#fff;box-shadow:0 3px 12px rgba(108,61,237,.3)}
.sidebar-links-head{padding:14px 12px 6px;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:rgba(255,255,255,.28)}
.snav-link{color:rgba(255,255,255,.72)}
.snav-link:hover{color:#fff}
.sidebar-foot{padding:10px 8px;border-top:1px solid rgba(255,255,255,.08)}
.main-area{margin-left:230px;flex:1;min-width:0}
.page-pad{padding:28px 32px;max-width:1100px}
.exam-command-deck{margin-bottom:18px;border:1px solid #dbe5f0;border-radius:20px;background:linear-gradient(135deg,#ffffff 0%,#f8fbff 48%,#eef2ff 100%);box-shadow:0 16px 34px rgba(15,23,42,.07);overflow:hidden}
.exam-command-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;padding:18px 18px 14px;border-bottom:1px solid #e7edf5}
.exam-command-copy{display:grid;gap:6px;min-width:0;max-width:700px}
.exam-command-kicker{font-size:11px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--purple)}
.exam-command-title{font-family:var(--fd);font-size:21px;font-weight:900;color:var(--navy)}
.exam-command-text{font-size:13px;line-height:1.7;color:var(--slate)}
.exam-command-pills{display:flex;gap:8px;flex-wrap:wrap}
.exam-command-pill{display:inline-flex;align-items:center;gap:6px;padding:8px 11px;border-radius:999px;background:#fff;border:1px solid #dbe7f5;color:#334155;font-size:12px;font-weight:800;box-shadow:0 8px 18px rgba(15,23,42,.04)}
.exam-command-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;padding:16px 18px}
.exam-command-card{border:none;border-radius:18px;padding:16px 15px;background:#fff;border:1.5px solid #dce4ee;box-shadow:0 10px 22px rgba(15,23,42,.05);text-align:left;cursor:pointer;transition:transform .18s,box-shadow .18s,border-color .18s,background .18s;display:grid;gap:9px}
.exam-command-card:hover{transform:translateY(-2px);border-color:rgba(108,61,237,.35);box-shadow:0 18px 28px rgba(108,61,237,.12)}
.exam-command-card.active{background:linear-gradient(135deg,#6C3DED,#8B5CF6);border-color:transparent;color:#fff;box-shadow:0 18px 32px rgba(108,61,237,.28)}
.exam-command-card.active .exam-command-card-desc,.exam-command-card.active .exam-command-card-meta{color:rgba(255,255,255,.84)}
.exam-command-card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.exam-command-card-icon{width:42px;height:42px;border-radius:14px;background:#EEF2FF;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.exam-command-card.active .exam-command-card-icon{background:rgba(255,255,255,.18)}
.exam-command-card-state{font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.exam-command-card.active .exam-command-card-state{color:rgba(255,255,255,.72)}
.exam-command-card-title{font-family:var(--fd);font-size:17px;font-weight:900;color:inherit}
.exam-command-card-desc{font-size:12px;line-height:1.65;color:var(--slate)}
.exam-command-card-meta{font-size:11px;line-height:1.55;color:var(--muted);font-weight:800}
.exam-command-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:0 18px 18px}
.exam-command-tip{font-size:12px;line-height:1.65;color:var(--slate)}
.exam-command-mini{display:inline-flex;align-items:center;gap:6px;padding:8px 11px;border-radius:999px;background:#F8FAFC;border:1px solid #e2e8f0;color:#475569;font-size:11px;font-weight:800}

/* STEPS */
.step-row{display:flex;align-items:center;margin-bottom:24px}
.step-item{display:flex;align-items:center;gap:6px;flex:1}
.step-circle{width:30px;height:30px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:var(--muted);flex-shrink:0;transition:all .3s;font-family:var(--fd)}
.step-label{font-size:12px;font-weight:600;color:var(--muted)}
.step-line{flex:1;height:2px;background:var(--border);margin:0 5px}
.step-item.done .step-circle{background:var(--green);border-color:var(--green);color:#fff}
.step-item.done .step-label{color:var(--green)}
.step-item.active .step-circle{background:var(--purple);border-color:var(--purple);color:#fff}
.step-item.active .step-label{color:var(--purple);font-weight:700}

/* SEL CARDS */
.sel-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:9px}
.sel-card{padding:13px 8px;border:2px solid var(--border);border-radius:var(--r);text-align:center;cursor:pointer;font-weight:700;font-size:13px;transition:all .2s;background:var(--white);font-family:var(--fb)}
.sel-card:hover{border-color:var(--purple);color:var(--purple);background:#F5F3FF}
.sel-card.selected{border-color:var(--purple);background:#EEF2FF;color:var(--purple)}
.sel-card.selected::after{content:'✓';display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;margin-left:6px;border-radius:50%;background:var(--purple);color:#fff;font-size:11px;vertical-align:middle}
.selection-note{margin-top:10px;padding:10px 12px;border-radius:10px;background:#F8FAFC;border:1px solid var(--border);font-size:12px;line-height:1.55;color:var(--slate)}
.exam-cover-studio{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:16px;align-items:start;padding:16px;border:1.5px solid var(--border);border-radius:16px;background:linear-gradient(135deg,#F8FAFC,#F5F3FF);margin-top:16px}
.exam-cover-preview{aspect-ratio:16/9;border:2px dashed #C4B5FD;border-radius:14px;background:#fff;display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--muted);font-size:12px;font-weight:700;text-align:center;padding:12px}
.exam-cover-preview img{width:100%;height:100%;display:block;object-fit:cover}
.exam-cover-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
@media(max-width:720px){.exam-cover-studio{grid-template-columns:1fr}.exam-cover-preview{max-width:360px}}

/* PDF / CANVAS */
.pdf-layout{display:flex;flex-direction:column;gap:16px}
.pdf-main{width:100%;min-width:0}
.pdf-controls{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--white);border-radius:var(--r-sm);border:1px solid var(--border);margin-bottom:8px;flex-wrap:wrap}
.pdf-canvas-wrap{position:relative;border:1px solid var(--border);border-radius:18px;background:linear-gradient(180deg,#F8FAFC 0%,#EEF2FF 100%);overflow:auto;max-height:min(82vh,920px);min-height:680px;display:flex;align-items:flex-start;justify-content:center;padding:28px;cursor:crosshair;user-select:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.9)}
.pdf-canvas-wrap.hand-mode{cursor:grab}
.pdf-canvas-wrap.hand-mode.dragging{cursor:grabbing}
.pdf-canvas-wrap.drag-over,.pdf-dropzone.drag-over{border-color:var(--purple);background:#F5F3FF;box-shadow:0 0 0 4px rgba(108,61,237,.12)}
.pdf-canvas-stage{position:relative;display:inline-block;flex:0 0 auto}
#pdfCanvas{display:block;background:var(--white);border-radius:14px;box-shadow:0 18px 36px rgba(15,23,42,.12)}
#cropCanvas{position:absolute;top:0;left:0;touch-action:none}
.pdf-dropzone{min-height:360px;display:flex;align-items:center;justify-content:center;background:#f8fafc;border-radius:18px;border:2px dashed var(--border);flex-direction:column;gap:10px;cursor:pointer;padding:24px;text-align:center;transition:all .18s}

/* Q PANEL */
.q-panel{width:100%;flex-shrink:0}
.q-list{display:flex;flex-direction:row;flex-wrap:wrap;gap:10px}
.q-item{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px;border:1px solid var(--border);border-radius:var(--r);background:var(--white);box-shadow:var(--sh-sm);width:130px;flex-shrink:0}
.q-thumb{width:110px;height:70px;object-fit:contain;border:1px solid var(--border);border-radius:4px;background:#f8f9fa;flex-shrink:0}
.ans-badge{padding:3px 11px;border-radius:20px;background:var(--purple);color:#fff;font-weight:700;font-size:12px}
.q-handle{width:100%;height:24px;display:flex;align-items:center;justify-content:center;border:1px dashed var(--border);border-radius:6px;background:#F8FAFC;color:var(--muted);font-size:14px;cursor:grab;flex-shrink:0}
.q-handle:active{cursor:grabbing}
.q-order{min-width:18px;padding-top:4px;font-weight:800;color:var(--muted);font-size:12px;font-family:var(--fd)}
.q-meta{flex:1;min-width:0}
.q-answer-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:8px}
.q-answer-chip{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--border);background:var(--white);display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:12px;font-weight:800;color:var(--slate);cursor:pointer;transition:all .18s}
.q-answer-chip:hover{border-color:var(--purple);color:var(--purple)}
.q-answer-chip.active{background:var(--purple);border-color:var(--purple);color:#fff;box-shadow:0 8px 16px rgba(108,61,237,.18)}
.q-remove-btn{background:none;border:none;cursor:pointer;color:var(--red);font-size:18px;padding:2px 4px;line-height:1}
.q-outcome-input{width:100%;min-height:58px;resize:vertical;padding:8px 9px;border:1.5px solid var(--border);border-radius:10px;background:#fff;font-family:var(--fb);font-size:11px;line-height:1.45;color:var(--navy);outline:none}
.q-outcome-input:focus{border-color:var(--purple);box-shadow:0 0 0 3px rgba(108,61,237,.08)}
.q-outcome-label{width:100%;font-size:10px;font-weight:900;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;text-align:left}
.result-actions{display:grid;grid-template-columns:repeat(2,minmax(92px,1fr));gap:7px;min-width:210px}
.result-action{border:1.5px solid var(--border);border-radius:10px;padding:7px 9px;background:#fff;font-family:var(--fb);font-size:12px;font-weight:800;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px;transition:all .16s;white-space:nowrap}
.result-action:hover{transform:translateY(-1px);box-shadow:var(--sh-sm)}
.result-action.exam{background:#EFF6FF;border-color:#BFDBFE;color:#2563EB}
.result-action.center{background:#F5F3FF;border-color:#DDD6FE;color:#6D28D9}
.result-action.outcome{background:#ECFDF5;border-color:#A7F3D0;color:#047857}
.result-action.edit,.result-action.appeal{background:#FFF7ED;border-color:#FED7AA;color:#C2410C}
.result-action.del{background:#fff;border-color:#FCA5A5;color:var(--red)}
.result-action.disabled{background:#F8FAFC;border-color:var(--border);color:var(--muted);cursor:not-allowed;box-shadow:none;transform:none}
.sortable-ghost{opacity:.45;background:#F5F3FF}
.sortable-chosen{box-shadow:var(--sh-lg);border-color:rgba(108,61,237,.32)}

/* TABLE */
.data-table{width:100%;border-collapse:collapse}
.data-table th{background:#F8FAFC;padding:10px 13px;text-align:left;font-size:11px;font-weight:800;color:var(--muted);border-bottom:2px solid var(--border);text-transform:uppercase;letter-spacing:.05em}
.data-table td{padding:10px 13px;font-size:13px;border-bottom:1px solid var(--border)}
.data-table tr:hover td{background:#FAFBFF}
.score-bar-track{height:8px;background:#E2E8F0;border-radius:4px;overflow:hidden;width:60px;display:inline-block}
.score-bar-fill{height:100%;border-radius:4px}

/* TOGGLE SWITCH */
.toggle-wrap{display:flex;align-items:center;gap:10px;cursor:pointer}
.toggle{width:42px;height:24px;background:var(--border);border-radius:12px;position:relative;transition:background .2s;flex-shrink:0}
.toggle.on{background:var(--purple)}
.toggle::after{content:'';width:18px;height:18px;background:#fff;border-radius:50%;position:absolute;top:3px;left:3px;transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.on::after{left:21px}

/* SPINNER */
.spinner{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--purple);border-radius:50%;animation:spin .7s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}

/* TOAST */
#toast-wrap{position:fixed;bottom:24px;right:24px;z-index:9999;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{padding:11px 16px;border-radius:var(--r);font-size:13px;font-weight:600;box-shadow:var(--sh-lg);animation:toastIn .25s ease;max-width:300px}
@keyframes toastIn{from{transform:translateX(100%);opacity:0}to{transform:translateX(0);opacity:1}}
.toast-info{background:var(--navy);color:#fff}
.toast-success{background:var(--green-d);color:#fff}
.toast-error{background:var(--red);color:#fff}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;z-index:500;padding:20px}
.modal-box{background:var(--white);border-radius:var(--r-xl);padding:28px;width:100%;max-width:550px;box-shadow:var(--sh-xl);animation:popIn .22s ease}
@keyframes popIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.ans-opt{width:44px;height:44px;border-radius:50%;border:2px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;cursor:pointer;transition:all .18s;font-family:var(--fd)}
.ans-opt:hover{border-color:var(--purple);color:var(--purple)}
.ans-opt.sel{background:var(--purple);border-color:var(--purple);color:#fff}

/* GRADE COLORS */
.gc-1{background:linear-gradient(135deg,#FF6B6B,#FF8E53)}
.gc-2{background:linear-gradient(135deg,#FF8E53,#FFA726)}
.gc-3{background:linear-gradient(135deg,#FFA726,#FFCC02)}
.gc-4{background:linear-gradient(135deg,#4CAF50,#66BB6A)}
.gc-5{background:linear-gradient(135deg,#26A69A,#26C6DA)}
.gc-6{background:linear-gradient(135deg,#29B6F6,#42A5F5)}
.gc-7{background:linear-gradient(135deg,#5C6BC0,#7E57C2)}
.gc-8{background:linear-gradient(135deg,#AB47BC,#EC407A)}

/* LOADING */
.loading-overlay{position:fixed;inset:0;background:rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;z-index:9998;flex-direction:column;gap:14px}
.loading-overlay p{font-weight:600;color:var(--slate);font-size:14px}

/* LOGIN */
.login-bg{min-height:100vh;background:linear-gradient(145deg,#0F172A,#1E2A4A,#0F172A);display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:rgba(255,255,255,.06);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.12);border-radius:20px;padding:44px 40px;max-width:380px;width:100%}
.login-icon{width:64px;height:64px;background:linear-gradient(135deg,var(--purple),var(--purple-l));border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:30px;margin:0 auto 20px;box-shadow:0 8px 24px rgba(108,61,237,.4)}

/* OPTION COUNT SELECTOR */
.opt-count-sel{display:flex;gap:8px}
.occ{width:38px;height:38px;border:2px solid var(--border);border-radius:var(--r-sm);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;cursor:pointer;transition:all .18s;font-family:var(--fd)}
.occ:hover{border-color:var(--purple);color:var(--purple)}
.occ.sel{background:var(--purple);border-color:var(--purple);color:#fff}

/* SECTION EDITOR */
.section-editor{display:flex;flex-direction:column;gap:12px}
.section-row{display:grid;grid-template-columns:minmax(0,1.6fr) 110px 110px 130px auto;gap:10px;align-items:end;padding:14px;border:1px solid var(--border);border-radius:var(--r);background:#F8FAFC}
.section-note{padding:12px 14px;border-radius:var(--r);background:#EEF2FF;color:var(--purple);font-size:12px;font-weight:600;line-height:1.6}
.section-tag{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:#EEF2FF;color:var(--purple);font-size:11px;font-weight:800}
.category-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center}
.category-toggle{display:flex;align-items:center;gap:8px;padding:9px 12px;border:1px solid var(--border);border-radius:12px;background:#F8FAFC;color:var(--slate);font-size:12px;font-weight:700;white-space:nowrap}
.category-toggle input{accent-color:var(--purple)}

/* MAIN FOOTER */
.main-footer{text-align:center;padding:20px;font-size:12px;color:var(--muted);border-top:1px solid var(--border);margin-top:40px}

async function ensureSupabaseAdminSession(){

}

function formatPublishError(error){
  const message=String(error&&error.message?error.message:error||'');
  if(message.includes('row-level security')){
    return 'Supabase yetki kontrolü sınav görseli yüklemeyi engelledi. Çıkış yapıp tekrar admin girişi yapın; sorun sürerse bu e-posta için Supabase admin_users kaydında exam_create/exam_edit yetkisini kontrol edin.';
  }
  if(message.includes('Supabase admin oturumu')){

  }

}

function hasExamPerm(key){
  if(!key) return true;

  if(profile.isOwner||profile.legacyMode) return true;
  return !!(profile.active!==false&&profile.permissions&&profile.permissions[key]);

function toast(msg,type='info'){

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmtDate(ts){if(!ts)return'';try{const d=ts.seconds?new Date(ts.seconds*1000):new Date(ts);return d.toLocaleDateString('tr-TR');}catch{return'';}}
function fmtDT(ts){if(!ts)return'';try{const d=ts.seconds?new Date(ts.seconds*1000):new Date(ts);return d.toLocaleString('tr-TR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});}catch{return'';}}
function buildExamShareUrl(examId){return`${window.location.origin}/sinav/${encodeURIComponent(examId)}?v=2`;}
function normalizeExamGrades(source){

function sanitizeCategoryLabel(value){return String(value??'').replace(/\s+/g,' ').trim();}
function sanitizeCategoryList(list){
  const seen=new Set();
  return(Array.isArray(list)?list:[]).map(sanitizeCategoryLabel).filter(label=>{
    if(!label) return false;
    const key=normalizeKeyPart(label);
    if(seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}
function mergeCategoryLists(...lists){
  const merged=[];
  const seen=new Set();
  lists.flat().forEach(item=>{
    const label=sanitizeCategoryLabel(item);
    if(!label) return;
    const key=normalizeKeyPart(label);
    if(seen.has(key)) return;
    seen.add(key);
    merged.push(label);
  });
  return merged;
}
function getEditableCategoriesForGrade(grade,map=A?.categoryMap){

}
function getConfiguredCategoriesForGrade(grade,map=A?.categoryMap){
  const cleaned=sanitizeCategoryList(Array.isArray(map?.[grade])?map[grade]:(DEFAULT_SUBJECTS_BY_GRADE[grade]||[]));

}
function getAvailableCategoriesForGrade(grade,extras=[]){

function normalizeKeyPart(value){

function parseTurkishDateTime(value){
  const text=String(value||'').trim();
  if(!text) return 0;
  const match=text.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})(?:\s+(\d{1,2}):(\d{2}))?$/);
  if(!match) return 0;
  const [,day,month,year,hour='0',minute='0']=match;
  const date=new Date(
    Number(year),
    Math.max(0,Number(month)-1),
    Number(day),
    Number(hour),
    Number(minute),
    0,
    0
  );
  const time=date.getTime();
  return Number.isFinite(time)?time:0;
}
function getResultDateValue(result){
  const stamp=result?.date;
  if(stamp&&typeof stamp.seconds==='number'){
    const nanos=typeof stamp.nanoseconds==='number'?stamp.nanoseconds/1e6:0;
    return stamp.seconds*1000+nanos;
  }
  if(stamp instanceof Date){
    const time=stamp.getTime();
    return Number.isFinite(time)?time:0;
  }
  const parsedText=parseTurkishDateTime(stamp);
  if(parsedText) return parsedText;
  const parsedNative=Date.parse(String(stamp||''));
  if(Number.isFinite(parsedNative)) return parsedNative;
  return 0;
}
function sortResultRecords(list){
  return [...(list||[])].sort((a,b)=>{
    const dateDiff=getResultDateValue(b)-getResultDateValue(a);
    if(dateDiff!==0) return dateDiff;
    const scoreDiff=Number(b?.score||0)-Number(a?.score||0);
    if(scoreDiff!==0) return scoreDiff;
    return String(a?.id||'').localeCompare(String(b?.id||''));
  });
}

  }).length;

  };
}
function getResultStudentKey(result){
  const accountUid=String(result?.accountUid||result?.userId||'').trim();
  if(accountUid) return`uid:${accountUid}`;
  const explicitKey=String(result?.studentKey||'').trim();
  if(explicitKey.startsWith('uid:')) return explicitKey;
  return buildStudentKey(result)||explicitKey;
}
async function copyText(text,successMsg='Kopyalandı'){
  try{
    await navigator.clipboard.writeText(text);
    toast(successMsg,'success');
    return true;
  }catch{
    try{
      const ta=document.createElement('textarea');
      ta.value=text;
      ta.style.position='fixed';
      ta.style.top='-1000px';
      document.body.appendChild(ta);
      ta.select();
      const copied=document.execCommand('copy');
      ta.remove();
      if(!copied) throw new Error('copy-failed');
      toast(successMsg,'success');
      return true;
    }catch{
      toast('Bağlantı kopyalanamadı','error');
      return false;
    }
  }
}

function destroyQuestionSortables(){questionSortables.forEach(instance=>instance?.destroy?.());questionSortables=[];}
function shouldUseSections(subject,grade=A?.grade){return !!sanitizeCategoryLabel(subject)&&isSectionEnabledCategory(grade,subject);}
function toSectionNumber(value){
  const num=parseInt(value,10);
  return Number.isFinite(num)?num:'';
}
function toPositiveDecimal(value){
  if(value===null||value===undefined||value==='') return '';
  const normalized=String(value).replace(',','.').trim();
  if(!normalized) return '';
  const num=Number(normalized);
  return Number.isFinite(num)&&num>0?Math.round(num*100)/100:'';
}
function roundPointValue(value){
  return Math.round((Number(value)||0)*100)/100;
}
function formatPointValue(value){
  const num=roundPointValue(value);
  if(!Number.isFinite(num)) return '0';
  return Number.isInteger(num)?String(num):num.toFixed(2).replace(/\.?0+$/,'');
}
function isDenemeLikeCategory(subject){
  const key=normalizeKeyPart(subject);
  return !!key&&(key==='deneme'||key==='agisler'||key==='lgs'||key.indexOf('deneme')>-1||key.indexOf('agis')>-1||key.indexOf('lgs')>-1);
}
function getLessonWeight(label){
  const key=normalizeKeyPart(label);
  if(!key) return 1;
  if(LGS_LESSON_WEIGHTS[key]) return LGS_LESSON_WEIGHTS[key];
  const matchKey=Object.keys(LGS_LESSON_WEIGHTS).find(item=>key.indexOf(item)>-1||item.indexOf(key)>-1);
  return matchKey?LGS_LESSON_WEIGHTS[matchKey]:1;
}
function resolveExamScoreScale(grade,subject,rawScaleInput){
  const parsed=parseInt(String(rawScaleInput??'').trim(),10);
  if(Number.isFinite(parsed)&&parsed>0) return parsed;
  if(parseInt(grade,10)<=3) return 100;
  return isDenemeLikeCategory(subject)?500:100;
}
function buildQuestionSectionLabels(totalQuestions,questionSections,subject,questions=[]){

  });
}
function buildEvenPointDistribution(count,totalScale){
  if(count<=0) return [];
  const safeScale=Math.max(0,roundPointValue(totalScale));
  const base=roundPointValue(safeScale/count);
  const list=Array.from({length:count},()=>base);
  const diff=roundPointValue(safeScale-list.reduce((sum,value)=>sum+value,0));
  list[count-1]=roundPointValue((list[count-1]||0)+diff);
  return list;
}
function assignRemainingPoints(pointList,totalScale,targetIndexes){
  const indexes=targetIndexes.filter(index=>Number.isInteger(index)&&index>=0&&index<pointList.length);
  if(!indexes.length) return pointList;
  const specifiedSum=roundPointValue(pointList.reduce((sum,value)=>sum+(Number(value)||0),0));
  const remaining=roundPointValue(totalScale-specifiedSum);
  if(remaining<-0.01) throw new Error('Girilen puanlar toplam puanı aşıyor. Toplam puanı artır veya ders/soru puanlarını azalt.');
  const evenPoints=buildEvenPointDistribution(indexes.length,Math.max(0,remaining));
  indexes.forEach((index,itemIndex)=>{
    pointList[index]=evenPoints[itemIndex];
  });
  return pointList;
}
function normalizePointListToScale(pointList,totalScale){
  if(!pointList.length) return [];
  const currentSum=roundPointValue(pointList.reduce((sum,value)=>sum+(Number(value)||0),0));
  if(currentSum<=0) return buildEvenPointDistribution(pointList.length,totalScale);
  const safeScale=Math.max(0,roundPointValue(totalScale));
  const normalized=pointList.map((value,index)=>{
    if(index===pointList.length-1) return 0;
    return roundPointValue((Number(value)||0)/currentSum*safeScale);
  });
  const subtotal=roundPointValue(normalized.reduce((sum,value)=>sum+value,0));
  normalized[pointList.length-1]=roundPointValue(safeScale-subtotal);
  return normalized;
}
function resolveQuestionPoints(config){
  const totalQuestions=config.questions.length;
  if(!totalQuestions) return{scoreScale:resolveExamScoreScale(config.grade,config.subject,config.scoreScaleInput),questionPoints:[]};

  const fallbackScale=resolveExamScoreScale(config.grade,config.subject,config.scoreScaleInput);
  let resolvedScale=fallbackScale;
  let questionPoints=[];
  const explicitScale=String(config.scoreScaleInput??'').trim()!=='';
  const labels=buildQuestionSectionLabels(totalQuestions,config.questionSections,config.subject,config.questions);

  if(config.scoringMode==='question'){
    const manualPoints=config.questions.map(question=>toPositiveDecimal(question?.pointValue));
    const manualIndexes=manualPoints.reduce((list,value,index)=>{
      if(value!=='') list.push(index);
      return list;
    },[]);
    if(!explicitScale&&manualIndexes.length===totalQuestions){
      resolvedScale=roundPointValue(manualPoints.reduce((sum,value)=>sum+Number(value||0),0))||fallbackScale;
    }
    questionPoints=Array.from({length:totalQuestions},(_,index)=>Number(manualPoints[index]||0));
    if(!manualIndexes.length){
      questionPoints=buildEvenPointDistribution(totalQuestions,resolvedScale);
    }else if(manualIndexes.length<totalQuestions){
      const emptyIndexes=questionPoints.reduce((list,value,index)=>{
        if(!(value>0)) list.push(index);
        return list;
      },[]);
      questionPoints=assignRemainingPoints(questionPoints,resolvedScale,emptyIndexes);
    }else if(explicitScale){
      const specifiedSum=roundPointValue(questionPoints.reduce((sum,value)=>sum+value,0));
      if(Math.abs(specifiedSum-resolvedScale)>0.01){
        throw new Error('Soru puanlarının toplamı belirlediğin toplam puanla eşleşmiyor. Toplam puanı düzelt veya boş sorular için otomatik dağıtım kullan.');
      }
    }
  }else if(config.scoringMode==='section'){
    const sections=cloneQuestionSections(config.questionSections).filter(section=>section.label&&section.start!==''&&section.end!=='');
    if(!sections.length){
      throw new Error('Ders bazlı puanlama için önce en az bir bölüm ekleyin.');
    }
    const sectionQuestionMap=new Map();
    sections.forEach(section=>{
      const indexes=[];
      for(let questionNo=section.start;questionNo<=section.end;questionNo++) indexes.push(questionNo-1);
      sectionQuestionMap.set(section.id||`${section.label}-${section.start}-${section.end}`,{section,indexes});
    });
    const coveredIndexes=new Set();
    questionPoints=Array.from({length:totalQuestions},()=>0);
    let hasManualSection=false;
    sectionQuestionMap.forEach(({section,indexes})=>{
      indexes.forEach(index=>coveredIndexes.add(index));
      const sectionPoints=toPositiveDecimal(section.points);
      if(sectionPoints==='') return;
      hasManualSection=true;
      const perQuestion=roundPointValue(Number(sectionPoints)/Math.max(indexes.length,1));
      indexes.forEach(index=>{questionPoints[index]=perQuestion;});
    });
    const uncoveredIndexes=Array.from({length:totalQuestions},(_,index)=>index).filter(index=>!coveredIndexes.has(index)||!(questionPoints[index]>0));
    if(!explicitScale&&hasManualSection&&uncoveredIndexes.length===0){
      resolvedScale=roundPointValue(questionPoints.reduce((sum,value)=>sum+value,0))||fallbackScale;
    }
    if(!hasManualSection){
      questionPoints=buildEvenPointDistribution(totalQuestions,resolvedScale);
    }else if(uncoveredIndexes.length){
      questionPoints=assignRemainingPoints(questionPoints,resolvedScale,uncoveredIndexes);
    }else if(explicitScale){
      const specifiedSum=roundPointValue(questionPoints.reduce((sum,value)=>sum+value,0));
      if(Math.abs(specifiedSum-resolvedScale)>0.01){
        throw new Error('Bölüm puanlarının toplamı belirlediğin toplam puanla eşleşmiyor. Toplam puanı düzelt veya bazı bölümleri otomatik dağıtıma bırak.');
      }
    }
  }else{
    if(parseInt(config.grade,10)>=4&&isDenemeLikeCategory(config.subject)){
      const grouped=new Map();
      labels.forEach((label,index)=>{
        const key=label||config.subject||'Genel';
        if(!grouped.has(key)) grouped.set(key,[]);
        grouped.get(key).push(index);
      });
      const rawWeights=Array.from({length:totalQuestions},()=>0);
      grouped.forEach((indexes,label)=>{
        const coeff=getLessonWeight(label||config.subject||'Genel');
        const perQuestion=coeff/Math.max(indexes.length,1);
        indexes.forEach(index=>{rawWeights[index]=perQuestion;});
      });
      questionPoints=normalizePointListToScale(rawWeights,resolvedScale);
    }else{
      questionPoints=buildEvenPointDistribution(totalQuestions,resolvedScale);
    }
  }

  const normalized=normalizePointListToScale(questionPoints,resolvedScale);
  return{
    scoreScale:resolvedScale,
    questionPoints:normalized,
    sectionLabels:labels
  };
}
function normalizeSectionDraft(section,index){
  return{
    id:section?.id||`sec-${index+1}`,
    label:String(section?.label||section?.title||'').trim(),
    start:toSectionNumber(section?.start),
    end:toSectionNumber(section?.end),
    points:toPositiveDecimal(section?.points)
  };
}
function cloneQuestionSections(sections){
  return Array.isArray(sections)?sections.map((section,index)=>normalizeSectionDraft(section,index)):[];
}
function findSectionLabel(questionNo,sections=A.questionSections){
  const list=Array.isArray(sections)?sections:[];
  for(const section of list){
    const start=toSectionNumber(section?.start);
    const end=toSectionNumber(section?.end);
    const label=String(section?.label||'').trim();
    if(!label||start===''||end==='') continue;
    if(questionNo>=start&&questionNo<=end) return label;
  }
  return '';
}
function getQuestionSectionLabel(index){
  return String(A.questions[index]?.sectionTitle||findSectionLabel(index+1)).trim();
}
function prepareQuestionSections(totalQuestions,sections=A.questionSections){
  if(!shouldUseSections(A.subject)) return{sections:[],assignments:{}};
  const rows=cloneQuestionSections(sections).filter(section=>section.label||section.start!==''||section.end!=='');
  if(!rows.length) return{sections:[],assignments:{}};
  const assignments={};
  const normalized=rows.map((section,index)=>{
    const label=String(section.label||'').trim();
    const start=toSectionNumber(section.start);
    const end=toSectionNumber(section.end);
    const points=toPositiveDecimal(section.points);
    if(!label) throw new Error(`${index+1}. bölüm için ders adı girin.`);
    if(start===''||end==='') throw new Error(`${label} bölümü için başlangıç ve bitiş soru numaralarını girin.`);
    if(start<1||end<1||start>totalQuestions||end>totalQuestions){
      throw new Error(`${label} bölümü 1 ile ${totalQuestions} arasındaki sorulara atanmalıdır.`);
    }
    if(end<start) throw new Error(`${label} bölümünde bitiş soru numarası başlangıçtan küçük olamaz.`);
    for(let questionNo=start;questionNo<=end;questionNo++){
      if(assignments[questionNo]){
        throw new Error(`${questionNo}. soru hem ${assignments[questionNo]} hem de ${label} bölümüne atanmış görünüyor.`);
      }
      assignments[questionNo]=label;
    }
    return{label,start,end,points};
  });
  return{sections:normalized,assignments};
}
function getQuestionImageExtension(dataUrl){
  const mime=String(dataUrl||'').match(/^data:([^;]+);/)?.[1]||'image/png';
  if(mime==='image/jpeg') return 'jpg';
  if(mime==='image/webp') return 'webp';
  return 'png';
}
function getQuestionImageMime(dataUrl){
  return String(dataUrl||'').match(/^data:([^;]+);/)?.[1]||'image/png';
}
function getSupabaseUploadClient(){
  if(supabaseUploadClient) return supabaseUploadClient;
  if(window.kemalAdminAuth&&typeof window.kemalAdminAuth.getClient==='function'){
    supabaseUploadClient=window.kemalAdminAuth.getClient();
    return supabaseUploadClient;
  }
  if(!window.supabase) throw new Error('Supabase kütüphanesi yüklenemedi.');
  const cfg=window.kemalSiteStore?.getConfig?.();
  if(!cfg?.supabaseUrl||!cfg?.supabaseAnonKey){
    throw new Error('Supabase ayarları bulunamadı.');
  }
  supabaseUploadClient=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey,{
    auth:{persistSession:false,autoRefreshToken:false}
  });
  return supabaseUploadClient;
}
async function dataUrlToBlob(dataUrl){
  const response=await fetch(dataUrl);
  return response.blob();
}
async function uploadQuestionImage(examId,index,dataUrl){
  if(!String(dataUrl||'').startsWith('data:')) return{imageUrl:dataUrl};
  await ensureSupabaseAdminSession();
  const ext=getQuestionImageExtension(dataUrl);
  const mime=getQuestionImageMime(dataUrl);
  const path=`${examId}/q-${String(index+1).padStart(3,'0')}-${Date.now()}.${ext}`;
  const blob=await dataUrlToBlob(dataUrl);
  const upload=await getSupabaseUploadClient().storage.from(QUESTION_IMAGE_BUCKET).upload(path,blob,{
    cacheControl:'31536000',
    upsert:false,
    contentType:mime
  });
  if(upload.error) throw upload.error;
  const publicUrl=getSupabaseUploadClient().storage.from(QUESTION_IMAGE_BUCKET).getPublicUrl(path).data?.publicUrl;
  if(!publicUrl) throw new Error('Soru görseli bağlantısı oluşturulamadı.');
  return{imageUrl:publicUrl,imagePath:path};
}

function fileToDataUrl(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>resolve(String(reader.result||''));
    reader.onerror=()=>reject(new Error('Görsel dosyası okunamadı.'));
    reader.readAsDataURL(file);
  });
}
async function prepareExamCoverFile(file){
  if(!file||!String(file.type||'').startsWith('image/')) throw new Error('Kapak için JPG, PNG veya WEBP görsel seçin.');
  if(file.size>5*1024*1024) throw new Error('Kapak görseli en fazla 5 MB olabilir.');
  return fileToDataUrl(file);
}
function getQuestionImagePath(questionData){
  const data=questionData&&typeof questionData.data==='function'?questionData.data():(questionData||{});
  if(data.imagePath) return String(data.imagePath);
  const imageUrl=String(data.imageUrl||'');
  const markers=[
    `/storage/v1/object/public/${QUESTION_IMAGE_BUCKET}/`,
    `/storage/v1/object/sign/${QUESTION_IMAGE_BUCKET}/`
  ];
  const marker=markers.find(item=>imageUrl.includes(item));
  if(!marker) return '';
  const rawPath=imageUrl.split(marker)[1]?.split('?')[0]||'';
  try{
    return decodeURIComponent(rawPath);
  }catch{
    return rawPath;
  }
}
async function removeQuestionImageFromStorage(questionData){
  const imagePath=getQuestionImagePath(questionData);
  if(!imagePath) return;
  try{
    const response=await getSupabaseUploadClient().storage.from(QUESTION_IMAGE_BUCKET).remove([imagePath]);
    if(response.error) console.warn('Soru görseli silinemedi:', imagePath, response.error);
  }catch(error){
    console.warn('Soru görseli temizlenemedi:', imagePath, error);
  }
}

async function listQuestionImageStoragePaths(folder='',depth=0){
  if(depth>4) return[];
  const found=[];
  let offset=0;
  while(true){
    const response=await getSupabaseUploadClient().storage.from(QUESTION_IMAGE_BUCKET).list(folder,{
      limit:1000,
      offset,
      sortBy:{column:'name',order:'asc'}
    });
    if(response.error) throw response.error;
    const rows=response.data||[];
    for(const item of rows){
      if(!item||!item.name) continue;
      const path=folder?`${folder}/${item.name}`:item.name;
      if(item.id===null||item.metadata===null){
        found.push(...await listQuestionImageStoragePaths(path,depth+1));
      }else{
        found.push(path);
      }
    }
    if(rows.length<1000) break;
    offset+=rows.length;
  }
  return found;
}
async function removeQuestionImageStoragePaths(paths){
  const unique={};
  const list=(Array.isArray(paths)?paths:[]).map(path=>String(path||'').trim()).filter(path=>{
    if(!path||unique[path]) return false;
    unique[path]=true;
    return true;
  });
  for(let i=0;i<list.length;i+=100){
    const response=await getSupabaseUploadClient().storage.from(QUESTION_IMAGE_BUCKET).remove(list.slice(i,i+100));
    if(response.error) throw response.error;
  }
  return list.length;
}
function deriveQuestionSectionsFromQuestions(questions){
  const derived=[];
  let current=null;
  (questions||[]).forEach((question,index)=>{
    const label=String(question?.sectionTitle||'').trim();
    if(!label){
      current=null;
      return;
    }
    if(current&&current.label===label&&current.end===index){
      current.end=index+1;
      return;
    }
    current={id:`derived-${derived.length+1}`,label,start:index+1,end:index+1};
    derived.push(current);
  });
  return cloneQuestionSections(derived);
}
function buildResultAnswerMap(result){
  const map={};
  const details=Array.isArray(result?.answerDetails)?result.answerDetails:[];
  details.forEach((item,index)=>{
    const questionNo=parseInt(item?.questionNo,10)||index+1;
    map[questionNo]=String(item?.selectedAnswer||'').trim().toUpperCase();
  });
  return map;
}
function calculateRevisedResultSnapshot(result,examMeta,questions){
  const totalQuestions=questions.length;
  const details=Array.isArray(result?.answerDetails)?result.answerDetails:[];
  if(!totalQuestions||!details.length) return null;
  if((parseInt(result?.total,10)||0)!==totalQuestions) return null;
  if(details.length!==totalQuestions) return null;
  const selectedMap=buildResultAnswerMap(result);
  const scoreScale=resolveExamScoreScale(examMeta.grade,examMeta.subject,examMeta.scoreScale||result?.scoreScale||'');
  let correct=0,wrong=0,blank=0;
  let weightedCorrect=0,weightedWrong=0;
  const answerDetails=questions.map((question,index)=>{
    const questionNo=index+1;
    const selectedAnswer=String(selectedMap[questionNo]||'').trim().toUpperCase();
    const correctAnswer=String(question?.correctAnswer||'').trim().toUpperCase();
    const sectionTitle=String(question?.sectionTitle||findSectionLabel(questionNo,examMeta.questionSections)||examMeta.subject||'').trim();
    const learningOutcome=String(question?.learningOutcome||'').trim();
    const pointValue=roundPointValue(question?.pointValue||(scoreScale/Math.max(totalQuestions,1)));
    let outcome='B';
    if(selectedAnswer) outcome=selectedAnswer===correctAnswer?'D':'Y';
    if(outcome==='D'){
      correct++;
      weightedCorrect=roundPointValue(weightedCorrect+pointValue);
    }else if(outcome==='Y'){
      wrong++;
      weightedWrong=roundPointValue(weightedWrong+pointValue);
    }
    else blank++;
    return{
      questionNo,
      questionId:question?.id||'',
      order:question?.order??index,
      sectionTitle,
      learningOutcome,
      pointValue,
      selectedAnswer,
      correctAnswer,
      outcome
    };
  });
  let netCorrect=correct;
  if(examMeta.negativeMarking) netCorrect=Math.max(0,correct-Math.floor(wrong/3));
  const examScore=examMeta.negativeMarking
    ? Math.max(0,roundPointValue(weightedCorrect-weightedWrong/3))
    : roundPointValue(weightedCorrect);
  const score100=scoreScale?Math.round(examScore/scoreScale*100):0;
  return{
    examTitle:examMeta.title||result.examTitle||'',
    subject:examMeta.subject||result.subject||'',
    grade:result.grade??examMeta.grade,
    correct,
    wrong,
    blank,
    netCorrect,
    score:score100,
    score100,
    examScore,
    scoreScale,
    total:totalQuestions,
    negativeMarking:!!examMeta.negativeMarking,
    answerDetails,
    questionSections:Array.isArray(examMeta.questionSections)?examMeta.questionSections:[]
  };
}
async function recalculateExamResults(examId,examMeta,questions){
  const snap=await getDocs(query(collection(db,'results'),where('examId','==',examId)));
  let updated=0,skipped=0,batchCount=0;
  let batch=writeBatch(db);
  for(const resultDoc of snap.docs){
    const nextData=calculateRevisedResultSnapshot(resultDoc.data(),examMeta,questions);
    if(!nextData){skipped++;continue;}
    batch.update(resultDoc.ref,nextData);
    updated++;
    batchCount++;
    if(batchCount>=350){
      await batch.commit();
      batch=writeBatch(db);
      batchCount=0;
    }
  }
  if(batchCount) await batch.commit();
  return{total:snap.size,updated,skipped};
}
function getAppealStatusMeta(status){
  if(status==='partial') return{label:'Kısmi İnceleme',icon:'🧩',bg:'#EDE9FE',color:'#6D28D9'};
  if(status==='accepted_corrected') return{label:'Haklı Bulundu Düzeltildi',icon:'✅',bg:'#DCFCE7',color:'#166534'};
  if(status==='corrected_no_score_change') return{label:'Düzeltildi Sonuç Aynı',icon:'🛠',bg:'#DBEAFE',color:'#1D4ED8'};
  if(status==='accepted') return{label:'Haklı',icon:'✅',bg:'#DCFCE7',color:'#166534'};
  if(status==='rejected') return{label:'Reddedildi',icon:'⛔',bg:'#FEE2E2',color:'#B91C1C'};
  return{label:'İncelemede',icon:'🕵️',bg:'#FEF3C7',color:'#92400E'};
}
function buildAppealQuestionReviewMap(appeal){
  const map=new Map();
  (Array.isArray(appeal?.questionReviews)?appeal.questionReviews:[]).forEach(review=>{
    const questionNo=parseInt(review?.questionNo,10);
    if(Number.isFinite(questionNo)&&questionNo>0) map.set(questionNo,review);
  });
  return map;
}
function getAppealQuestionNumbers(appeal){
  return(Array.isArray(appeal?.questionNos)?appeal.questionNos:[])
    .map(value=>parseInt(value,10))
    .filter(Number.isFinite)
    .filter(value=>value>0)
    .sort((a,b)=>a-b);
}
function deriveAppealStatus(appeal){
  const questionNos=getAppealQuestionNumbers(appeal);
  if(!questionNos.length) return appeal?.status||'pending';
  const reviewMap=buildAppealQuestionReviewMap(appeal);
  let pending=0,accepted=0,rejected=0,correctedNoChange=0;
  questionNos.forEach(questionNo=>{
    const status=reviewMap.get(questionNo)?.status||'pending';
    if(status==='accepted_corrected') accepted++;
    else if(status==='corrected_no_score_change') correctedNoChange++;
    else if(status==='rejected') rejected++;
    else pending++;
  });
  if(pending===questionNos.length) return 'pending';
  if(pending>0) return 'partial';
  if(rejected===questionNos.length) return 'rejected';
  if((accepted+correctedNoChange)>0&&rejected===0) return 'accepted';
  return 'partial';
}
function upsertAppealQuestionReview(appeal,review){
  const list=(Array.isArray(appeal?.questionReviews)?appeal.questionReviews:[])
    .filter(item=>parseInt(item?.questionNo,10)!==review.questionNo);
  list.push(review);
  return list.sort((a,b)=>(parseInt(a?.questionNo,10)||0)-(parseInt(b?.questionNo,10)||0));
}
function buildExamAppealSummary(appeals){
  const summary={};
  (appeals||[]).forEach(appeal=>{
    const examId=appeal?.examId;
    if(!examId) return;
    if(!summary[examId]) summary[examId]={total:0,pending:0};
    summary[examId].total+=1;
    if(deriveAppealStatus(appeal)==='pending'||deriveAppealStatus(appeal)==='partial') summary[examId].pending+=1;
  });
  return summary;
}

function getTimestampValue(value){
  if(!value) return 0;
  if(typeof value.seconds==='number') return value.seconds*1000;
  const parsed=Date.parse(String(value));
  return Number.isNaN(parsed)?0:parsed;
}
function getExamDisplayOrder(exam,index){
  const order=Number(exam?.displayOrder);
  return Number.isFinite(order)?order:index+1;
}
function compareExamDisplayRows(a,b){
  const gradeDiff=Number(a.item.grade)-Number(b.item.grade);
  if(gradeDiff!==0) return gradeDiff;
  const orderDiff=getExamDisplayOrder(a.item,a.index)-getExamDisplayOrder(b.item,b.index);
  if(orderDiff!==0) return orderDiff;
  return getTimestampValue(b.item.createdAt)-getTimestampValue(a.item.createdAt);
}
function sortAdminExamRecords(list){
  return (list||[])
    .map((item,index)=>({item,index}))
    .sort(compareExamDisplayRows)
    .map(row=>row.item);
}
function getExamPlacementList(grade,excludeId=''){
  return sortAdminExamRecords(
    (A.exams||[]).filter(exam=>examIncludesGrade(exam,grade)&&String(exam.id)!==String(excludeId))
  );
}
function clampRequestedExamOrder(value,max){
  const parsed=parseInt(value,10);
  if(!Number.isFinite(parsed)) return 1;
  return Math.max(1,Math.min(max,parsed));
}
async function placeExamAtDisplayOrder(examId,grade,requestedOrder){
  const sameGrade=getExamPlacementList(grade,examId);
  const insertOrder=clampRequestedExamOrder(requestedOrder,sameGrade.length+1);
  const batch=writeBatch(db);
  sameGrade.forEach((exam,index)=>{
    const nextOrder=index+1>=insertOrder?index+2:index+1;
    if(getExamDisplayOrder(exam,index)!==nextOrder){
      batch.update(doc(db,'exams',exam.id),{
        displayOrder:nextOrder,
        updatedAt:serverTimestamp()
      });
    }
  });
  batch.update(doc(db,'exams',examId),{
    displayOrder:insertOrder,
    updatedAt:serverTimestamp()
  });
  await batch.commit();
  return insertOrder;
}

function initQuestionSortables(){
  destroyQuestionSortables();
  if(typeof Sortable==='undefined') return;
  ['qList','previewQuestionList'].forEach(id=>{
    const list=document.getElementById(id);
    if(!list) return;
    questionSortables.push(new Sortable(list,{
      animation:180,
      handle:'.q-handle',
      ghostClass:'sortable-ghost',
      chosenClass:'sortable-chosen',
      onEnd(evt){
        if(evt.oldIndex==null||evt.newIndex==null||evt.oldIndex===evt.newIndex) return;
        const [moved]=A.questions.splice(evt.oldIndex,1);
        A.questions.splice(evt.newIndex,0,moved);
        syncQuestionOrder();
        refreshQuestionPanels();
        toast('Soru sırası güncellendi','success');
      }
    }));
  });
}
function afterCreateRender(){
  requestAnimationFrame(()=>{
    initQuestionSortables();
    if(A.step===3){
      setupUploadSurface();
      if(A.pdfDoc) setTimeout(()=>renderPage(A.pdfPage),40);
      else if(A.imgLoaded) setTimeout(()=>renderImageOnCanvas(),40);
    }
  });
}

function getExamCommandDeckStats(){
  const activeExamCount=(Array.isArray(A.exams)?A.exams:[]).filter(exam=>getExamStatus(exam)==='active').length;
  const pendingAppeals=(Array.isArray(A.appeals)?A.appeals:[]).filter(item=>{
    const status=deriveAppealStatus(item);
    return status==='pending'||status==='partial';
  }).length;
  const activeResultFilters=['grade','sube','subject','name','examId'].filter(key=>String(A.rf?.[key]||'').trim()).length;
  return{
    activeExamCount,
    pendingAppeals,
    activeResultFilters,
    categoryCount:sanitizeCategoryList(getEditableCategoriesForGrade(A.categoryGrade||GRADES[0])).length,
    lessonCount:sanitizeCategoryList(getEditableLessonCatalogForGrade(A.categoryGrade||GRADES[0])).length
  };
}

  const stats=getExamCommandDeckStats();

      desc:'Yeni sınav akışını başlat, soruları yükle ve yayın öncesi düzeni kontrol et.',
      meta:A.questions.length
        ? `${A.questions.length} soru hazır · ${A.examName?`Taslak: ${A.examName}`:'Taslak açık'}`
        : (getSelectedExamGrades().length&&A.subject?`${formatExamGrades(getSelectedExamGrades())} · ${A.subject}`:'4 adımlı yayın akışı')
    },
    {
      key:'categories',

      title:'Kategoriler',
      desc:'Sınıf bazlı dersleri, bölüm önerilerini ve bölümlü sınav seçeneklerini düzenle.',
      meta:`${A.categoryGrade||GRADES[0]}. sınıf · ${stats.categoryCount} kategori · ${stats.lessonCount} ders önerisi`
    },
    {
      key:'exams',
      icon:'🧪',
      title:'Yayınlanan Sınavlar',
      desc:'Aktif, taslak ve gizli sınavları tek yerden denetle; görünüm sırasını yönet.',
      meta:`${stats.activeExamCount} aktif sınav · ${stats.pendingAppeals} itiraz bekliyor`

function getExamCommandDeckTip(){
  if(A.page==='create'){

    return 'İpucu: burada kaydettiğin kategori ve ders listeleri yeni sınav oluşturma ekranında hemen kullanılmaya başlar.';

function renderExamCommandDeck(){
  const stats=getExamCommandDeckStats();
  const cards=getExamCommandDeckCards();
  const pillItems=[];
  if(A.page==='create'){
    if(getSelectedExamGrades().length) pillItems.push(formatExamGrades(getSelectedExamGrades()));
    if(A.subject) pillItems.push(A.subject);
    if(A.questions.length) pillItems.push(`${A.questions.length} soru`);
  }else if(A.page==='categories'){
    pillItems.push(`${A.categoryGrade||GRADES[0]}. sınıf düzeni`);
    pillItems.push(`${stats.categoryCount} kategori`);
  }else if(A.page==='exams'){
    pillItems.push(`${stats.activeExamCount} aktif`);
    if(stats.pendingAppeals) pillItems.push(`${stats.pendingAppeals} bekleyen itiraz`);
  }else if(A.page==='results'){
    pillItems.push(`${A.results.length||0} sonuç`);
    if(A.rf?.examId) pillItems.push('Sınav filtresi aktif');

  const pills=(pillItems.length?pillItems:['Hızlı geçiş','Yetki uyumlu görünüm','Sınav akışı']).map(item=>`<span class="exam-command-pill">${esc(item)}</span>`).join('');
  const cardsHtml=cards.map(card=>{

  return `<div class="exam-command-deck">
    <div class="exam-command-head">
      <div class="exam-command-copy">
        <span class="exam-command-kicker">Sınav Yönetim Rotası</span>

  </div>`;
}

  let body='';

        <button class="q-handle" type="button" title="Sıra değiştir" style="flex:1;height:20px">⋮⋮</button>
        <span class="q-order" style="font-size:11px">${i+1}</span>
        <button class="q-remove-btn" onclick="W.removeQ(${i})" title="Kaldır" style="font-size:14px;line-height:1;padding:0 2px">×</button>
      </div>
      <img class="q-thumb" src="${q.img}" alt="">
      <div style="width:100%;text-align:center">
        <span class="ans-badge">${q.ans}</span>

function renderPreviewQuestionList(){
  if(!A.questions.length) return'<p class="text-sm text-muted text-center" style="padding:20px 0">Henüz soru eklenmedi</p>';
  return A.questions.map((q,i)=>`
    <div class="q-item">
      <button class="q-handle" type="button" title="Soru sırasını değiştir">⋮⋮</button>
      <span class="q-order">${i+1}.</span>
      <img class="q-thumb" src="${q.img}" alt="">
      <div class="q-meta">
        <div class="text-xs text-muted">Mini önizleme</div>
        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px">
          <span class="ans-badge">${q.ans}</span>
          ${getQuestionSectionLabel(i)?`<span class="section-tag">📚 ${esc(getQuestionSectionLabel(i))}</span>`:''}
          ${q.pointValue?`<span class="section-tag">💯 ${formatPointValue(q.pointValue)} puan</span>`:''}
          <span class="text-xs text-muted">Farklı bir cevaba tıklayarak güncelleyebilirsiniz</span>
        </div>
        <div class="q-answer-row">${renderAnswerEditor(i,q.ans)}</div>
        ${A.scoringMode==='question'?`<div style="margin-top:10px">
          <label class="form-label">Soru Puanı</label>
          <input class="form-input" type="number" min="0" step="0.25" value="${q.pointValue!==''&&q.pointValue!==undefined?esc(q.pointValue):''}" placeholder="Boşsa otomatik dağıtılır" oninput="W.setQuestionPoint(${i},this.value)">
        </div>`:''}
        ${renderOutcomeEditor(i,q.learningOutcome)}
      </div>
      <button class="q-remove-btn" onclick="W.removeQ(${i})" title="Kaldır">🗑</button>

}
function refreshQuestionPanels(){
  const ql=document.getElementById('qList');const qc=document.getElementById('qCount');const nb=document.getElementById('nextBtn3');const pl=document.getElementById('previewQuestionList');
  if(ql) ql.innerHTML=renderQList();
  if(pl) pl.innerHTML=renderPreviewQuestionList();
  if(qc) qc.textContent=A.questions.length;
  if(nb){nb.disabled=A.questions.length===0;nb.textContent=`Devam Et (${A.questions.length} soru) →`;}
  initQuestionSortables();
}

  const rows=A.questionSections.length?A.questionSections.map((section,index)=>`
    <div class="section-row">
      <div>
        <label class="form-label">Ders / Bölüm Başlığı</label>
        <input class="form-input" type="text" list="sectionLessonOptions" value="${esc(section.label)}" placeholder="Örn: Türkçe" oninput="W.updateSectionField(${index},'label',this.value)">

      <div>
        <label class="form-label">Başlangıç</label>
        <input class="form-input" type="number" min="1" max="${A.questions.length}" value="${section.start!==''?section.start:''}" placeholder="1" oninput="W.updateSectionField(${index},'start',this.value)">
      </div>
      <div>
        <label class="form-label">Bitiş</label>
        <input class="form-input" type="number" min="1" max="${A.questions.length}" value="${section.end!==''?section.end:''}" placeholder="${A.questions.length}" oninput="W.updateSectionField(${index},'end',this.value)">

  </div>`;
}

function renderAdminExams(){
  const appealSummary=buildExamAppealSummary(A.appeals);
  const gOpts=GRADES.map(g=>`<option value="${g}">${g}. Sınıf</option>`).join('');
  const visibleExams=sortAdminExamRecords(A.exams);
  const cards=!visibleExams.length?
    '<div class="text-center text-muted p-8" style="padding:40px">Henüz sınav bulunmuyor</div>':
    visibleExams.map((e,index)=>{
      const status=getExamStatus(e);
      const meta=getExamStatusMeta(status);
      const examGrades=normalizeExamGrades(e);
      const primaryGrade=examGrades[0]||e.grade;
      const appealMeta=appealSummary[e.id]||{total:0,pending:0};
      const displayOrder=getExamDisplayOrder(e,index);
      const accessLabel=e.accessScope==='registered'||e.authRequired?'🔐 Kayıtlı Kullanıcı':'🌍 Herkese Açık';
      const visibilityLabel=e.hidden===true||e.gizli===true?'🔗 Gizli':'👀 Listede';
      const primaryAction=!hasExamPerm('exam_edit')?'':status==='active'
        ? `<button class="btn btn-sm btn-outline" onclick="W.setExamStatus('${e.id}','paused')">⏸ Pasife Al</button>`
        : `<button class="btn btn-sm btn-green" onclick="W.setExamStatus('${e.id}','active')">🚀 Aktif Et</button>`;
      const secondaryAction=!hasExamPerm('exam_edit')?'':status==='draft'
        ? `<button class="btn btn-sm btn-outline" onclick="W.setExamStatus('${e.id}','paused')">⏸ Pasife Al</button>`
        : `<button class="btn btn-sm btn-outline" onclick="W.setExamStatus('${e.id}','draft')">🕒 Beklet</button>`;
      const shareAction=status==='active'
        ? `<button class="btn btn-sm btn-outline" onclick="W.copyExamLink('${e.id}')">🔗 Link Kopyala</button>`
        : '';
      return `
      <div class="card p-4" style="margin-bottom:10px">
        <div style="display:flex;align-items:center;gap:12px">
          <div style="width:50px;height:50px;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:18px;flex-shrink:0;font-family:var(--fd)" class="gc-${primaryGrade}">${examGrades.length>1?examGrades.join('/'):(primaryGrade||'—')}</div>
          <div style="flex:1;min-width:0">
            <div style="font-weight:700;font-size:14px;font-family:var(--fd);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(e.title)}</div>
            <div class="text-sm text-muted" style="margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(formatExamGrades(e))} &nbsp;·&nbsp; ${e.subject} &nbsp;·&nbsp; ${e.questionCount} soru &nbsp;·&nbsp; ${e.duration?e.duration+' dk':'Sınırsız'} &nbsp;·&nbsp; ${e.optionCount||4} şık ${e.negativeMarking?'&nbsp;·&nbsp; ⚠️ Puan kesintili':''}</div>
            <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px">
              <span style="display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;background:${meta.bg};color:${meta.color};font-size:11px;font-weight:800">${meta.icon} ${meta.label}</span>
              <span style="display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;background:#EEF2FF;color:#4338CA;font-size:11px;font-weight:800">${accessLabel}</span>
              <span style="display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;background:#F0FDFA;color:#0F766E;font-size:11px;font-weight:800">${visibilityLabel}</span>
              <span style="display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;background:${appealMeta.total?'#FFF7ED':'#F8FAFC'};color:${appealMeta.total?'#9A3412':'#64748B'};font-size:11px;font-weight:800">${appealMeta.total?'📝 '+appealMeta.total+' itiraz':'💬 İtiraz yok'}${appealMeta.pending?` · ${appealMeta.pending} bekliyor`:''}</span>
              <span class="text-xs text-muted">📅 ${fmtDate(e.createdAt)}</span>
              ${e.updatedAt?`<span class="text-xs text-muted">✏️ ${fmtDate(e.updatedAt)} güncellendi</span>`:''}
            </div>
          </div>
          ${hasExamPerm('exam_edit')?`<div style="display:flex;align-items:center;gap:6px;flex-shrink:0;background:#F8FAFC;border:1.5px solid var(--border);border-radius:12px;padding:8px 10px">
            <span style="font-size:10px;font-weight:900;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap">Sıra</span>
            <button class="btn btn-sm btn-outline" type="button" title="Yukarı taşı" onclick="W.moveExamDisplayOrder('${e.id}',-1)" style="padding:4px 8px">↑</button>
            <input class="form-input" type="number" min="1" step="1" value="${displayOrder}" style="width:54px;padding:5px 6px;text-align:center;font-weight:800;margin:0" onchange="W.updateExamDisplayOrder('${e.id}',this.value)">
            <button class="btn btn-sm btn-outline" type="button" title="Aşağı taşı" onclick="W.moveExamDisplayOrder('${e.id}',1)" style="padding:4px 8px">↓</button>
          </div>`:''}
        </div>
        <div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin-top:12px;padding-top:12px;border-top:1px solid var(--border)">
          ${hasExamPerm('exam_edit')?`<button class="btn btn-sm btn-primary" onclick="W.editExam('${e.id}')">✏️ Düzenle</button>`:''}
          ${primaryAction}
          ${secondaryAction}
          ${hasExamPerm('exam_edit')?`<button class="btn btn-sm btn-outline" onclick="W.toggleExamHidden('${e.id}')">${e.hidden===true||e.gizli===true?'👀 Listede Göster':'🔗 Gizle'}</button>`:''}
          ${shareAction}
          ${hasExamPerm('exam_appeals')?`<button class="btn btn-sm btn-outline" onclick="W.showExamAppeals('${e.id}')">📝 İtirazlar</button>`:''}
          ${hasAnyExamPerm(['exam_results','exam_results_edit','exam_results_delete','exam_single_report','exam_report_center'])?`<button class="btn btn-sm btn-outline" onclick="W.showResults('${e.id}')">📊 Sonuçlar</button>`:''}
          ${hasExamPerm('exam_delete')?`<button class="btn btn-sm btn-red" onclick="W.delExam('${e.id}')">🗑 Sil</button>`:''}
        </div>
      </div>`;}).join('');
  return`<div class="page-pad">
    <div class="flex justify-between items-center mb-6" style="flex-wrap:wrap;gap:12px">
      <div>
        <h2 style="font-size:20px;margin-bottom:2px">Sınavlar</h2>
        <p class="text-sm text-muted">${A.exams.length} sınav listeleniyor · Görünüm sırası öğrenci sayfasındaki sınav kartlarını belirler.</p>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end">
        ${hasExamPerm('exam_delete')?`<button class="btn btn-outline" type="button" onclick="W.cleanupExamStorage()">🧹 Boş Görselleri Temizle</button>`:''}
        <select class="form-input" style="width:150px" onchange="W.loadExamsFilter(this.value)">
          <option value="">Tüm Sınıflar</option>${gOpts}
        </select>
      </div>
    </div>
    ${renderExamCommandDeck()}
    ${cards}
  </div>`;
}

function renderAdminResults(){
  const gOpts=GRADES.map(g=>`<option value="${g}" ${A.rf.grade==g?'selected':''}>${g}. Sınıf</option>`).join('');
  const sOpts=getAllKnownSubjects([
    A.results.map(result=>result.subject),
    A.exams.map(exam=>exam.subject)
  ]).map(s=>`<option value="${esc(s)}" ${A.rf.subject===s?'selected':''}>${esc(s)}</option>`).join('');

/* ── IMAGE/PDF ── */
function syncPdfStage(width,height){
  const stage=document.getElementById('pdfStage');
  const pdfCanvas=document.getElementById('pdfCanvas');
  const cropCanvas=document.getElementById('cropCanvas');
  const wrap=document.getElementById('pdfCont');
  if(!stage||!pdfCanvas||!cropCanvas) return;
  const wrapWidth=Math.max((wrap?.clientWidth||0)-56,0);
  const wrapHeight=Math.max((wrap?.clientHeight||0)-56,0);
  const stageWidth=Math.max(width,wrapWidth||0);
  const stageHeight=Math.max(height,wrapHeight||0);
  const offsetX=Math.max(0,(stageWidth-width)/2);
  const offsetY=Math.max(0,(stageHeight-height)/2);
  stage.style.width=`${stageWidth}px`;
  stage.style.height=`${stageHeight}px`;
  stage.dataset.contentX=String(offsetX);
  stage.dataset.contentY=String(offsetY);
  stage.dataset.contentWidth=String(width);
  stage.dataset.contentHeight=String(height);
  pdfCanvas.style.position='absolute';
  pdfCanvas.style.left=`${offsetX}px`;
  pdfCanvas.style.top=`${offsetY}px`;
  cropCanvas.style.position='absolute';
  cropCanvas.style.left='0px';
  cropCanvas.style.top='0px';
}

function getPdfStageContentBox(){
  const stage=document.getElementById('pdfStage');
  if(!stage){
    return{x:0,y:0,width:0,height:0};
  }
  return{
    x:parseFloat(stage.dataset.contentX)||0,
    y:parseFloat(stage.dataset.contentY)||0,
    width:parseFloat(stage.dataset.contentWidth)||0,
    height:parseFloat(stage.dataset.contentHeight)||0
  };
}

function syncCropToolUI(){
  const wrap=document.getElementById('pdfCont');

    wrap.classList.toggle('hand-mode',A.cropTool==='pan');

  }

      ? '💡 El aracı açık. PDF alanını tutup sürükleyerek gezebilirsin.'

function setUploadDragState(active){
  ['pdfPh','pdfCont'].forEach(id=>{
    const el=document.getElementById(id);
    if(el) el.classList.toggle('drag-over',!!active);
  });
}

function setupUploadSurface(){
  ['pdfPh','pdfCont'].forEach(id=>{
    const el=document.getElementById(id);
    if(!el||el.dataset.dropBound==='1') return;
    const stop=event=>{
      event.preventDefault();
      event.stopPropagation();
    };
    el.addEventListener('dragenter',event=>{
      stop(event);
      setUploadDragState(true);
    });
    el.addEventListener('dragover',event=>{
      stop(event);
      if(event.dataTransfer) event.dataTransfer.dropEffect='copy';
      setUploadDragState(true);
    });
    el.addEventListener('dragleave',event=>{
      stop(event);
      const next=event.relatedTarget;
      if(next&&el.contains(next)) return;
      setUploadDragState(false);
    });
    el.addEventListener('drop',async event=>{
      stop(event);
      setUploadDragState(false);
      const file=event.dataTransfer?.files?.[0];
      if(file) await loadSelectedUploadFile(file);
    });
    el.dataset.dropBound='1';
  });
}

function getCanvasRenderBoost(){
  return Math.min(PDF_RENDER_BOOST,Math.max(2,window.devicePixelRatio||1));
}

function getDataUrlByteSize(dataUrl){
  const base64=String(dataUrl||'').split(',')[1]||'';
  return Math.ceil(base64.length*.75);
}

function resizeCanvas(sourceCanvas,scale){
  const next=document.createElement('canvas');
  next.width=Math.max(1,Math.round(sourceCanvas.width*scale));
  next.height=Math.max(1,Math.round(sourceCanvas.height*scale));
  const ctx=next.getContext('2d');
  ctx.fillStyle='#FFFFFF';
  ctx.fillRect(0,0,next.width,next.height);
  ctx.imageSmoothingEnabled=true;
  ctx.imageSmoothingQuality='high';
  ctx.drawImage(sourceCanvas,0,0,next.width,next.height);
  return next;
}

function optimizeQuestionCanvas(sourceCanvas){
  let working=sourceCanvas;
  const longest=Math.max(working.width,working.height);
  if(longest>QUESTION_IMAGE_MAX_EDGE){
    working=resizeCanvas(working,QUESTION_IMAGE_MAX_EDGE/longest);
  }

  // Storage'a yuklenecegi icin kaliteyi koru; sadece asiri buyuk kirpmalari sinirla.
  let dataUrl=working.toDataURL('image/png');
  if(getDataUrlByteSize(dataUrl)<=3*1024*1024) return dataUrl;

  let quality=.96;
  dataUrl=working.toDataURL('image/jpeg',quality);
  while(getDataUrlByteSize(dataUrl)>3*1024*1024&&quality>QUESTION_IMAGE_MIN_QUALITY){
    quality=Math.max(QUESTION_IMAGE_MIN_QUALITY,quality-.01);
    dataUrl=working.toDataURL('image/jpeg',quality);
  }
  return dataUrl;
}

function renderImageOnCanvas(){
  const img=A.imgData;if(!img)return;
  const c=document.getElementById('pdfCanvas');const cc=document.getElementById('cropCanvas');
  if(!c||!cc)return;
  const wrap=document.getElementById('pdfCont');
  const availableWidth=Math.max(((wrap?.clientWidth||0)-56),1040);
  const baseW=Math.min(img.width,availableWidth);
  const scale=(A.pdfZoom/PDF_BASE_ZOOM)*(baseW/img.width);
  const contentWidth=img.width*scale;
  const contentHeight=img.height*scale;
  const renderBoost=getCanvasRenderBoost();
  c.width=Math.round(contentWidth*renderBoost);c.height=Math.round(contentHeight*renderBoost);
  c.style.width=contentWidth+'px';c.style.height=contentHeight+'px';
  syncPdfStage(contentWidth,contentHeight);
  const stage=document.getElementById('pdfStage');
  cc.width=stage?.clientWidth||contentWidth;
  cc.height=stage?.clientHeight||contentHeight;
  const ctx=c.getContext('2d',{alpha:false});
  ctx.imageSmoothingEnabled=true;
  ctx.imageSmoothingQuality='high';
  ctx.fillStyle='#FFFFFF';
  ctx.fillRect(0,0,c.width,c.height);
  ctx.drawImage(img,0,0,c.width,c.height);
  const zl=document.getElementById('zoomLbl');if(zl)zl.textContent=Math.round(A.pdfZoom/PDF_BASE_ZOOM*100)+'%';
  const bp=document.getElementById('btnPDFPrev');if(bp)bp.disabled=true;
  const bn=document.getElementById('btnPDFNext');if(bn)bn.disabled=true;
  setupCrop();
  syncCropToolUI();
}

async function loadSelectedUploadFile(file){
  if(!file) return;
  removeCropModal();
  A.draftImg=null;
  A.draftAns=null;
  A.pdfZoom=PDF_BASE_ZOOM;
  setUploadDragState(false);
  const isImg=/image\//i.test(file.type)||/\.(jpg|jpeg|png|webp)$/i.test(file.name);
  if(isImg){
    showLoad('Görsel yükleniyor...');
    try{
      const url=await new Promise((res,rej)=>{const fr=new FileReader();fr.onload=e=>res(e.target.result);fr.onerror=rej;fr.readAsDataURL(file);});
      const img=new Image();
      await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=url;});
      A.pdfDoc=null;A.imgLoaded=true;A.imgData=img;A.pdfPage=1;A.pdfTotal=1;
      document.getElementById('pdfCont').style.display='flex';
      document.getElementById('pdfPh').style.display='none';
      document.getElementById('pdfCtrl').style.display='flex';
      renderImageOnCanvas();hideLoad();
    }catch(e){hideLoad();toast('Görsel yükleme hatası: '+e.message,'error');}
    return;
  }
  showLoad('PDF yükleniyor...');
  try{
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const ab=await file.arrayBuffer();
    A.pdfDoc=await pdfjsLib.getDocument(ab).promise;
    A.pdfTotal=A.pdfDoc.numPages;A.pdfPage=1;A.imgLoaded=false;A.imgData=null;
    document.getElementById('pdfCont').style.display='flex';
    document.getElementById('pdfPh').style.display='none';
    document.getElementById('pdfCtrl').style.display='flex';
    hideLoad();await renderPage(1);
  }catch(e){hideLoad();toast('PDF yükleme hatası: '+e.message,'error');}
}

async function loadFile(inp){
  const file=inp.files?.[0];
  if(!file) return;
  await loadSelectedUploadFile(file);
  inp.value='';
}

async function renderPage(n){
  if(!A.pdfDoc)return;
  const page=await A.pdfDoc.getPage(n);
  const vp=page.getViewport({scale:A.pdfZoom});
  const c=document.getElementById('pdfCanvas');const cc=document.getElementById('cropCanvas');
  if(!c||!cc)return;
  const renderBoost=getCanvasRenderBoost();
  c.width=Math.round(vp.width*renderBoost);c.height=Math.round(vp.height*renderBoost);
  c.style.width=vp.width+'px';c.style.height=vp.height+'px';
  syncPdfStage(vp.width,vp.height);
  const stage=document.getElementById('pdfStage');
  cc.width=stage?.clientWidth||vp.width;
  cc.height=stage?.clientHeight||vp.height;
  const ctx=c.getContext('2d',{alpha:false});
  ctx.imageSmoothingEnabled=true;
  ctx.imageSmoothingQuality='high';
  await page.render({
    canvasContext:ctx,
    viewport:vp,
    transform:renderBoost>1?[renderBoost,0,0,renderBoost,0,0]:null
  }).promise;
  const pj=document.getElementById('pageJump');if(pj)pj.value=n;
  const bp=document.getElementById('btnPDFPrev');if(bp)bp.disabled=(n<=1);
  const bn=document.getElementById('btnPDFNext');if(bn)bn.disabled=(n>=A.pdfTotal);
  const zl=document.getElementById('zoomLbl');if(zl)zl.textContent=Math.round(A.pdfZoom/PDF_BASE_ZOOM*100)+'%';
  setupCrop();
  syncCropToolUI();
}

function setupCrop(){
  const cc=document.getElementById('cropCanvas');const pc=document.getElementById('pdfCanvas');
  if(!cc||!pc)return;
  const wrap=document.getElementById('pdfCont');
  const newCC=cc.cloneNode(false);cc.parentNode.replaceChild(newCC,cc);
  const contentBox=getPdfStageContentBox();
  let drawing=false,panning=false,sx=0,sy=0,startClientX=0,startClientY=0,startScrollLeft=0,startScrollTop=0;
  const ctx=newCC.getContext('2d');
  const getPos=e=>{
    const rect=newCC.getBoundingClientRect();
    const sx2=newCC.width/rect.width,sy2=newCC.height/rect.height;
    const point=e.touches?e.touches[0]:(e.changedTouches?e.changedTouches[0]:e);
    const cx=point.clientX;
    const cy=point.clientY;
    return{x:(cx-rect.left)*sx2,y:(cy-rect.top)*sy2};
  };
  const drawSelection=(ex,ey)=>{
    ctx.clearRect(0,0,newCC.width,newCC.height);
    ctx.strokeStyle='#6C3DED';ctx.lineWidth=2;ctx.setLineDash([6,3]);
    ctx.strokeRect(sx,sy,ex-sx,ey-sy);
    ctx.fillStyle='rgba(108,61,237,.08)';ctx.fillRect(sx,sy,ex-sx,ey-sy);
  };
  const finishSelection=p=>{
    ctx.clearRect(0,0,newCC.width,newCC.height);
    const left=Math.max(Math.min(sx,p.x),contentBox.x);
    const top=Math.max(Math.min(sy,p.y),contentBox.y);
    const right=Math.min(Math.max(sx,p.x),contentBox.x+contentBox.width);
    const bottom=Math.min(Math.max(sy,p.y),contentBox.y+contentBox.height);
    const w=right-left,h=bottom-top;
    if(w<20||h<20)return;
    const sourceScaleX=pc.width/Math.max(contentBox.width,1);
    const sourceScaleY=pc.height/Math.max(contentBox.height,1);
    const srcX=(left-contentBox.x)*sourceScaleX;
    const srcY=(top-contentBox.y)*sourceScaleY;
    const srcW=w*sourceScaleX;
    const srcH=h*sourceScaleY;
    const tmp=document.createElement('canvas');tmp.width=Math.max(1,Math.round(srcW));tmp.height=Math.max(1,Math.round(srcH));
    const tmpCtx=tmp.getContext('2d');
    tmpCtx.fillStyle='#FFFFFF';
    tmpCtx.fillRect(0,0,tmp.width,tmp.height);
    tmpCtx.imageSmoothingEnabled=true;
    tmpCtx.imageSmoothingQuality='high';
    tmpCtx.drawImage(
      pc,
      srcX,
      srcY,
      srcW,
      srcH,
      0,
      0,
      tmp.width,
      tmp.height
    );
    A.draftImg=optimizeQuestionCanvas(tmp);A.draftAns=null;
    showCropModal();
  };
  const handleMove=e=>{
    if(panning&&wrap){
      wrap.scrollLeft=startScrollLeft-(e.clientX-startClientX);
      wrap.scrollTop=startScrollTop-(e.clientY-startClientY);
      e.preventDefault();
      return;
    }
    if(!drawing)return;
    const p=getPos(e);
    drawSelection(p.x,p.y);
    e.preventDefault();
  };
  const handleUp=e=>{
    if(panning){
      panning=false;
      wrap?.classList.remove('dragging');
      newCC.style.cursor='grab';
      window.removeEventListener('pointermove',handleMove);
      window.removeEventListener('pointerup',handleUp);
      window.removeEventListener('pointercancel',handleUp);
      return;
    }
    if(!drawing)return;
    drawing=false;
    window.removeEventListener('pointermove',handleMove);
    window.removeEventListener('pointerup',handleUp);
    window.removeEventListener('pointercancel',handleUp);
    finishSelection(getPos(e));
  };
  newCC.style.cursor=A.cropTool==='pan'?'grab':'crosshair';
  newCC.style.touchAction='none';
  newCC.addEventListener('pointerdown',e=>{
    if(typeof e.button==='number'&&e.button!==0) return;
    if(A.cropTool==='pan'){
      panning=true;
      startClientX=e.clientX;
      startClientY=e.clientY;
      startScrollLeft=wrap?.scrollLeft||0;
      startScrollTop=wrap?.scrollTop||0;
      wrap?.classList.add('dragging');
      newCC.style.cursor='grabbing';
      window.addEventListener('pointermove',handleMove);
      window.addEventListener('pointerup',handleUp);
      window.addEventListener('pointercancel',handleUp);
      e.preventDefault();
      return;
    }
    drawing=true;
    const p=getPos(e);sx=p.x;sy=p.y;
    drawSelection(p.x,p.y);
    window.addEventListener('pointermove',handleMove);
    window.addEventListener('pointerup',handleUp);
    window.addEventListener('pointercancel',handleUp);
    e.preventDefault();
  });
  newCC.addEventListener('dragstart',e=>e.preventDefault());
}

async function fbLoadExams(gf){
  try{
    const q=query(collection(db,'exams'),orderBy('createdAt','desc'));
    const snap=await getDocs(q);
    const rows=snap.docs.map(d=>({id:d.id,...d.data()}));
    return sortAdminExamRecords(gf?rows.filter(exam=>examIncludesGrade(exam,gf)):rows);
  }catch(e1){
    try{
      const q2=query(collection(db,'exams'));
      const snap=await getDocs(q2);
      const rows=snap.docs.map(d=>({id:d.id,...d.data()}));
      return sortAdminExamRecords(gf?rows.filter(exam=>examIncludesGrade(exam,gf)):rows);
    }catch(e2){
      const psnap=await getDocs(collection(db,'exams'));
      const docs=gf?psnap.docs.filter(d=>examIncludesGrade(d.data(),gf)):psnap.docs;
      return sortAdminExamRecords(docs.map(d=>({id:d.id,...d.data()})));
    }
  }
}

async function fbLoadResults(rf){
  try{
    const q=query(collection(db,'results'),orderBy('date','desc'));
    const snap=await getDocs(q);
    let res=snap.docs.map(d=>({id:d.id,...d.data()})).map(r=>({...r,studentKey:getResultStudentKey(r)}));
    if(rf.grade) res=res.filter(r=>r.grade==rf.grade);
    if(rf.sube) res=res.filter(r=>r.sube===rf.sube);
    if(rf.subject) res=res.filter(r=>r.subject===rf.subject);
    if(rf.name){
      const queryText=rf.name.toLowerCase();
      res=res.filter(r=>`${r.firstName} ${r.lastName} ${buildLocationText(r)}`.toLowerCase().includes(queryText));
    }
    if(rf.examId) res=res.filter(r=>r.examId===rf.examId);
    return sortResultRecords(res);
  }catch{
    const snap=await getDocs(collection(db,'results'));
    let res=snap.docs.map(d=>({id:d.id,...d.data()})).map(r=>({...r,studentKey:getResultStudentKey(r)}));
    if(rf.grade) res=res.filter(r=>r.grade==rf.grade);
    if(rf.sube) res=res.filter(r=>r.sube===rf.sube);
    if(rf.subject) res=res.filter(r=>r.subject===rf.subject);
    if(rf.name){
      const queryText=rf.name.toLowerCase();
      res=res.filter(r=>`${r.firstName} ${r.lastName} ${buildLocationText(r)}`.toLowerCase().includes(queryText));
    }
    if(rf.examId) res=res.filter(r=>r.examId===rf.examId);
    return sortResultRecords(res);
  }
}
