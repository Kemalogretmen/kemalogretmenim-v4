<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Şekil Avcısı 3D - Kemal Öğretmenim</title>
  <meta name="description" content="1, 2 ve 3. sınıf öğrencileri için şekil ve geometrik cisim tanıma becerisini destekleyen dokunmatik uyumlu 3D eğitim oyunu.">
  <link rel="canonical" href="https://kemalogretmenim.com.tr/oyun/sekil-avcisi-3d.html">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    :root {
      --hunt-ink: #141334;
      --hunt-muted: #667085;
      --hunt-violet: #6c3ded;
      --hunt-blue: #1476d4;
      --hunt-cyan: #20c5d3;
      --hunt-green: #16a979;
      --hunt-sun: #f7bd24;
      --hunt-coral: #f16455;
      --hunt-pink: #d93d84;
      --hunt-line: #e7e0ff;
      --hunt-paper: #ffffff;
      --hunt-shadow: 0 18px 44px rgba(20, 19, 52, .16);
    }

    * { box-sizing: border-box; }

    html,
    body {
      min-height: 100%;
      overscroll-behavior: none;
    }

    body {
      margin: 0;
      color: var(--hunt-ink);
      font-family: var(--font-body, "Nunito", system-ui, -apple-system, BlinkMacSystemFont, sans-serif);
      background:
        radial-gradient(circle at 8% 8%, rgba(32, 197, 211, .22), transparent 26rem),
        radial-gradient(circle at 90% 12%, rgba(247, 189, 36, .20), transparent 23rem),
        linear-gradient(180deg, #fffdf8 0%, #f5f3ff 100%);
      overflow-x: hidden;
    }

    .shape-page {
      width: min(1240px, 100%);
      margin: 0 auto;
      padding: 14px 14px 38px;
    }

    .game-shell {
      overflow: hidden;
      border: 1px solid rgba(108, 61, 237, .16);
      border-radius: 8px;
      background: rgba(255, 255, 255, .96);
      box-shadow: var(--hunt-shadow);
    }

    .game-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      min-height: 68px;
      padding: 12px 16px;
      border-bottom: 1px solid var(--hunt-line);
      background: rgba(255, 255, 255, .94);
    }

    .back-link,
    .sound-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 42px;
      padding: 9px 13px;
      border: 0;
      border-radius: 8px;
      background: #f6f2ff;
      color: var(--hunt-violet);
      font-weight: 900;
      text-decoration: none;
      cursor: pointer;
    }

    .sound-toggle {
      width: 46px;
      padding: 0;
      font-size: 20px;
    }

    .game-title {
      min-width: 0;
      text-align: center;
    }

    .game-title h1 {
      margin: 0;
      font-family: var(--font-display, "Fredoka", system-ui, sans-serif);
      font-size: clamp(24px, 4vw, 38px);
      line-height: 1;
      color: var(--hunt-ink);
      letter-spacing: 0;
    }

    .game-title p {
      margin: 5px 0 0;
      color: var(--hunt-muted);
      font-size: 13px;
      font-weight: 900;
    }

    #game-container {
      position: relative;
      height: min(760px, calc(100vh - 150px));
      min-height: 620px;
      overflow: hidden;
      background: #eef7fb;
      isolation: isolate;
      touch-action: none;
    }

    #hud {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 6;
      display: grid;
      grid-template-columns: minmax(180px, .86fr) minmax(260px, 1.14fr) minmax(144px, .56fr);
      gap: 10px;
      pointer-events: none;
    }

    .hud-box {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 66px;
      padding: 10px 14px;
      border: 3px solid rgba(108, 61, 237, .24);
      border-radius: 8px;
      background: rgba(255, 255, 255, .94);
      box-shadow: 0 10px 24px rgba(20, 19, 52, .10);
      color: var(--hunt-ink);
      font-weight: 900;
      backdrop-filter: blur(12px);
    }

    .hud-icon {
      display: grid;
      place-items: center;
      width: 40px;
      height: 40px;
      flex: 0 0 40px;
      border-radius: 8px;
      background: #fff2bd;
      font-size: 22px;
    }

    .hud-label {
      display: block;
      color: var(--hunt-muted);
      font-size: 11px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .hud-value {
      display: block;
      margin-top: 1px;
      font-family: var(--font-display, "Fredoka", system-ui, sans-serif);
      font-size: 22px;
      line-height: 1;
      color: var(--hunt-ink);
    }

    .target-box {
      justify-content: center;
      border-color: rgba(247, 189, 36, .60);
      background: rgba(255, 249, 228, .96);
      text-align: center;
    }

    .target-shape {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 68px;
      height: 42px;
      margin-left: 10px;
      padding: 0 13px;
      border-radius: 8px;
      background: white;
      color: #a45a00;
      box-shadow: inset 0 0 0 2px rgba(247, 189, 36, .34);
      font-size: 24px;
      font-weight: 1000;
    }

    .progress-wrap {
      width: 100%;
      margin-top: 8px;
      height: 10px;
      overflow: hidden;
      border-radius: 999px;
      background: #e6e8f1;
    }

    #progress-fill {
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--hunt-coral), var(--hunt-sun), var(--hunt-green));
      transition: width .25s ease;
    }

    .mini-stat {
      justify-content: center;
      border-color: rgba(32, 197, 211, .35);
      background: rgba(236, 253, 255, .94);
      text-align: center;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
    }

    canvas:active { cursor: grabbing; }

    #damage-flash,
    #level-flash {
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      opacity: 0;
      transition: opacity .18s ease;
    }

    #damage-flash { background: rgba(241, 100, 85, .36); }
    #level-flash { background: rgba(247, 189, 36, .28); }

    .overlay {
      position: absolute;
      inset: 0;
      z-index: 12;
      display: grid;
      place-items: center;
      padding: 18px;
      background:
        linear-gradient(135deg, rgba(20, 19, 52, .90), rgba(108, 61, 237, .76)),
        rgba(20, 19, 52, .82);
      backdrop-filter: blur(8px);
      text-align: center;
    }

    .hidden { display: none !important; }

    .modal {
      width: min(620px, 100%);
      border-radius: 8px;
      border: 5px solid rgba(255, 255, 255, .70);
      background: white;
      box-shadow: 0 28px 60px rgba(0, 0, 0, .35);
      padding: clamp(20px, 4vw, 34px);
      animation: popIn .34s cubic-bezier(.18, .89, .32, 1.18);
    }

    .modal-mark {
      width: 92px;
      height: 92px;
      margin: 0 auto 12px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: linear-gradient(135deg, #fff4bd, #ffdf5e);
      font-size: 48px;
      box-shadow: inset 0 -8px 0 rgba(164, 90, 0, .12);
    }

    .modal h2 {
      margin: 0 0 9px;
      font-family: var(--font-display, "Fredoka", system-ui, sans-serif);
      font-size: clamp(30px, 6vw, 50px);
      line-height: 1;
      color: var(--hunt-violet);
      letter-spacing: 0;
    }

    .modal p {
      max-width: 520px;
      margin: 0 auto 16px;
      color: #3d3d5f;
      font-size: 16px;
      line-height: 1.5;
      font-weight: 800;
    }

    .mode-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 18px;
    }

    .mode-btn,
    .primary-btn {
      min-height: 74px;
      border: 0;
      border-radius: 8px;
      color: white;
      font-family: var(--font-display, "Fredoka", system-ui, sans-serif);
      font-size: 20px;
      font-weight: 900;
      line-height: 1.1;
      cursor: pointer;
      box-shadow: 0 7px 0 rgba(0, 0, 0, .22);
      transition: transform .12s ease, box-shadow .12s ease;
    }

    .mode-btn:active,
    .primary-btn:active {
      transform: translateY(6px);
      box-shadow: 0 1px 0 rgba(0, 0, 0, .22);
    }

    .mode-btn span,
    .primary-btn span {
      display: block;
      margin-top: 5px;
      font-family: var(--font-body, "Nunito", system-ui, sans-serif);
      font-size: 12px;
      font-weight: 1000;
      opacity: .92;
    }

    .mode-btn.primary { background: linear-gradient(135deg, var(--hunt-blue), var(--hunt-cyan)); }
    .mode-btn.secondary { background: linear-gradient(135deg, var(--hunt-green), var(--hunt-sun)); color: #12302b; }
    .primary-btn { width: 100%; margin-top: 12px; background: linear-gradient(135deg, var(--hunt-violet), var(--hunt-pink)); }

    .leaderboard {
      margin-top: 16px;
      border: 2px solid #ece7ff;
      border-radius: 8px;
      overflow: hidden;
      background: #fbfaff;
      text-align: left;
    }

    .lb-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 9px 12px;
      color: white;
      background: linear-gradient(135deg, var(--hunt-violet), var(--hunt-blue));
      font-weight: 1000;
    }

    .lb-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 12px;
      border-top: 1px dashed #ddd7ff;
      color: #3e3a62;
      font-size: 14px;
      font-weight: 900;
    }

    .lb-row.gold { color: #a45a00; background: #fff8df; }

    .name-field {
      width: 100%;
      min-height: 50px;
      margin: 6px 0 4px;
      border: 3px solid #ded5ff;
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--hunt-ink);
      font: 900 18px var(--font-body, "Nunito", system-ui, sans-serif);
      text-align: center;
      outline: none;
    }

    .name-field:focus {
      border-color: var(--hunt-violet);
      box-shadow: 0 0 0 4px rgba(108, 61, 237, .12);
    }

    .confetti {
      position: absolute;
      z-index: 30;
      width: 12px;
      height: 12px;
      pointer-events: none;
      animation: fall linear forwards;
    }

    @keyframes popIn {
      from { transform: translateY(10px) scale(.94); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }

    @keyframes fall {
      to { transform: translateY(105vh) rotate(720deg); opacity: .92; }
    }

    @media (max-width: 820px) {
      .shape-page { padding: 8px 8px 26px; }
      .game-topbar { align-items: stretch; flex-wrap: wrap; }
      .game-title { order: -1; width: 100%; }
      #game-container { height: calc(100vh - 138px); min-height: 590px; }
      #hud {
        grid-template-columns: 1fr 1fr;
      }
      .target-box { grid-column: 1 / -1; order: -1; }
      .hud-box { min-height: 58px; padding: 8px 10px; }
      .hud-icon { width: 34px; height: 34px; flex-basis: 34px; font-size: 18px; }
      .hud-value { font-size: 19px; }
      .target-shape { min-width: 58px; height: 36px; font-size: 20px; }
      .mode-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 480px) {
      .back-link { min-height: 38px; padding-inline: 10px; font-size: 13px; }
      .sound-toggle { width: 40px; min-height: 38px; }
      #game-container { min-height: 560px; }
      #hud { top: 8px; left: 8px; right: 8px; gap: 7px; }
      .hud-box { border-width: 2px; }
      .modal { padding: 18px; }
    }
  </style>
</head>
<body>
  <main class="shape-page">
    <section class="game-shell" aria-label="Şekil Avcısı 3D oyunu">
      <div class="game-topbar">
        <a class="back-link" href="oyunlar.html">← Oyunlar</a>
        <div class="game-title">
          <h1>Şekil Avcısı 3D</h1>
          <p>Hedef şekli topla, kuyruğunu büyüt, rekoru yakala.</p>
        </div>
        <button class="sound-toggle" id="soundToggle" type="button" aria-label="Sesi aç veya kapat">🔊</button>
      </div>

      <div id="game-container">
        <div id="hud">
          <div class="hud-box">
            <span class="hud-icon">⭐</span>
            <div style="width:100%">
              <span class="hud-label">Puan</span>
              <span class="hud-value"><span id="score">0</span> / <span id="win-score">100</span></span>
              <div class="progress-wrap"><div id="progress-fill"></div></div>
            </div>
          </div>
          <div class="hud-box target-box">
            <div>
              <span class="hud-label">Toplanacak hedef</span>
              <span class="hud-value"><span id="target-text">Hazırlanıyor</span><span class="target-shape" id="target-emoji">◆</span></span>
            </div>
          </div>
          <div class="hud-box mini-stat">
            <span class="hud-icon">🧩</span>
            <div>
              <span class="hud-label">Kuyruk</span>
              <span class="hud-value" id="tail-count">2</span>
            </div>
          </div>
        </div>

        <div id="damage-flash"></div>
        <div id="level-flash"></div>
        <canvas id="gameCanvas" aria-label="Şekil Avcısı 3D oyun alanı"></canvas>

        <div id="menu-screen" class="overlay">
          <div class="modal">
            <div class="modal-mark">🧊</div>
            <h2>Şekil Avcısı</h2>
            <p>Doğru şekilleri toplayarak büyü. Yanlış şekil kuyruğu küçültür; hedef değiştikçe dikkatini koru.</p>
            <div class="mode-grid">
              <button class="mode-btn primary" type="button" data-grade="1">
                1. Sınıf
                <span>Üçgen, kare, çember, dikdörtgen</span>
              </button>
              <button class="mode-btn secondary" type="button" data-grade="2">
                2-3. Sınıf
                <span>Küp, prizma, silindir, koni, küre</span>
              </button>
            </div>
            <div class="leaderboard" id="leaderboard"></div>
          </div>
        </div>

        <div id="result-screen" class="overlay hidden">
          <div class="modal">
            <div id="result-icon" class="modal-mark">🏆</div>
            <h2 id="result-title">Harikasın!</h2>
            <p id="result-message">Hedef puana ulaştın.</p>
            <p>Skorun: <strong id="final-score" style="font-size:28px;color:var(--hunt-coral)">0</strong></p>
            <div id="save-score-area">
              <input class="name-field" id="player-name" type="text" maxlength="15" placeholder="Adın" autocomplete="off">
              <button class="primary-btn" type="button" id="saveScoreBtn">Kaydet ve Menüye Dön</button>
            </div>
            <button class="primary-btn hidden" type="button" id="restartBtn">Yeniden Dene</button>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="/js/site.js"></script>
  <script>
    const GRADE_1_TARGETS = [
      { id: 'ucgen', name: 'Üçgen', shape: '▲', color: '#16a979', dark: '#0d7557' },
      { id: 'kare', name: 'Kare', shape: '■', color: '#1476d4', dark: '#0e5198' },
      { id: 'cember', name: 'Çember', shape: '●', color: '#f7bd24', dark: '#b46e00' },
      { id: 'dikdortgen', name: 'Dikdörtgen', shape: '▰', color: '#d93d84', dark: '#9e235f' }
    ];

    const GRADE_2_TARGETS = [
      { id: 'kup', name: 'Küp', shape: '▣', color: '#1476d4', dark: '#0e5198' },
      { id: 'kare_prizma', name: 'Kare Prizma', shape: '▤', color: '#16a979', dark: '#0d7557' },
      { id: 'dikdortgen_prizma', name: 'Dikdörtgenler Prizması', shape: '▭', color: '#6c3ded', dark: '#4320b0' },
      { id: 'ucgen_prizma', name: 'Üçgen Prizma', shape: '△', color: '#f16455', dark: '#b03c32' },
      { id: 'silindir', name: 'Silindir', shape: '▥', color: '#f7bd24', dark: '#b46e00' },
      { id: 'koni', name: 'Koni', shape: '◭', color: '#d93d84', dark: '#9e235f' },
      { id: 'kure', name: 'Küre', shape: '●', color: '#20c5d3', dark: '#11818d' }
    ];

    const ITEMS_DB = {
      ucgen: ['🍕', '⛵', '📐', '🍉'],
      kare: ['🖼️', '🔲', '🧇', '📺'],
      cember: ['🍩', '🪙', '🍪', '🧿'],
      dikdortgen: ['🚪', '📱', '💳', '🪪'],
      kup: ['🧊', '🎲', '📦'],
      kare_prizma: ['🧃', '🥛', '🏢'],
      dikdortgen_prizma: ['🧱', '📖', '🧽'],
      ucgen_prizma: ['⛺', '🧀', '🍫'],
      silindir: ['🔋', '🥫', '🕯️'],
      koni: ['🍦', '🥳', '🚥'],
      kure: ['⚽', '🌍', '🍊', '🧶']
    };

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('game-container');

    const MAP_SIZE = 2500;
    const TILE_SIZE = 58;
    const MAX_FOODS = 72;
    const POINTS_PER_ITEM = 5;

    let gameState = 'menu';
    let activeTargets = [];
    let currentTarget = null;
    let currentGrade = 1;
    let winScore = 100;
    let score = 0;
    let targetProgress = 0;
    let foods = [];
    let muted = false;
    let audioCtx = null;
    let animationFrame = null;
    let isPointerDown = false;

    const snake = {
      head: { x: MAP_SIZE / 2, y: MAP_SIZE / 2 },
      parts: [],
      history: [],
      speed: 3.65,
      spacing: 16,
      angle: -Math.PI / 2
    };

    function resizeCanvas() {
      const rect = container.getBoundingClientRect();
      canvas.width = Math.max(320, Math.floor(rect.width));
      canvas.height = Math.max(420, Math.floor(rect.height));
      if (gameState !== 'playing') draw(Date.now());
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function getNewTarget(oldTargetId) {
      const available = activeTargets.filter(target => target.id !== oldTargetId);
      const pool = available.length ? available : activeTargets;
      return pool[Math.floor(Math.random() * pool.length)];
    }

    function playSound(type) {
      if (muted) return;
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return;
      if (!audioCtx) audioCtx = new AudioContext();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const now = audioCtx.currentTime;
      const makeTone = (frequency, start, duration, wave, volume) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = wave;
        osc.frequency.setValueAtTime(frequency, now + start);
        gain.gain.setValueAtTime(volume, now + start);
        gain.gain.exponentialRampToValueAtTime(0.01, now + start + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now + start);
        osc.stop(now + start + duration + .02);
      };

      if (type === 'eat') {
        makeTone(680, 0, .08, 'sine', .16);
        makeTone(980, .05, .09, 'sine', .12);
      } else if (type === 'wrong') {
        makeTone(210, 0, .24, 'sawtooth', .14);
      } else if (type === 'win') {
        [523, 659, 784, 1046].forEach((tone, index) => makeTone(tone, index * .12, .24, 'square', .12));
      } else if (type === 'level') {
        makeTone(880, 0, .09, 'triangle', .11);
        makeTone(1175, .08, .11, 'triangle', .10);
      }
    }

    function handleDirectionInput(clientX, clientY) {
      if (gameState !== 'playing') return;
      const rect = canvas.getBoundingClientRect();
      const targetX = clientX - rect.left;
      const targetY = clientY - rect.top;
      snake.angle = Math.atan2(targetY - canvas.height / 2, targetX - canvas.width / 2);
    }

    canvas.addEventListener('pointerdown', event => {
      isPointerDown = true;
      canvas.setPointerCapture?.(event.pointerId);
      handleDirectionInput(event.clientX, event.clientY);
    });

    canvas.addEventListener('pointermove', event => {
      if (isPointerDown || event.pointerType === 'touch' || event.pointerType === 'pen') {
        handleDirectionInput(event.clientX, event.clientY);
      }
    });

    canvas.addEventListener('pointerup', () => { isPointerDown = false; });
    canvas.addEventListener('pointercancel', () => { isPointerDown = false; });
    canvas.addEventListener('touchmove', event => event.preventDefault(), { passive: false });

    window.addEventListener('keydown', event => {
      if (gameState !== 'playing') return;
      const keyMap = {
        ArrowUp: -Math.PI / 2,
        w: -Math.PI / 2,
        W: -Math.PI / 2,
        ArrowDown: Math.PI / 2,
        s: Math.PI / 2,
        S: Math.PI / 2,
        ArrowLeft: Math.PI,
        a: Math.PI,
        A: Math.PI,
        ArrowRight: 0,
        d: 0,
        D: 0
      };
      if (Object.prototype.hasOwnProperty.call(keyMap, event.key)) {
        event.preventDefault();
        snake.angle = keyMap[event.key];
      }
    });

    document.querySelectorAll('.mode-btn').forEach(button => {
      button.addEventListener('click', () => startGame(Number(button.dataset.grade)));
    });

    document.getElementById('saveScoreBtn').addEventListener('click', saveScoreAndReturn);
    document.getElementById('restartBtn').addEventListener('click', () => startGame(currentGrade));
    document.getElementById('soundToggle').addEventListener('click', () => {
      muted = !muted;
      document.getElementById('soundToggle').textContent = muted ? '🔇' : '🔊';
    });

    function startGame(gradeSelection) {
      cancelAnimationFrame(animationFrame);
      currentGrade = gradeSelection;
      activeTargets = gradeSelection === 1 ? [...GRADE_1_TARGETS] : [...GRADE_2_TARGETS];
      winScore = gradeSelection === 1 ? 100 : 120;
      score = 0;
      targetProgress = 0;
      foods = [];
      currentTarget = getNewTarget(null);

      snake.head = { x: MAP_SIZE / 2, y: MAP_SIZE / 2 };
      snake.parts = [
        { shape: '★', color: '#6c3ded', dark: '#4320b0' },
        { shape: '★', color: '#20c5d3', dark: '#11818d' }
      ];
      snake.history = [];
      snake.angle = -Math.PI / 2;
      snake.speed = gradeSelection === 1 ? 3.45 : 3.85;

      for (let i = 0; i < (snake.parts.length + 4) * snake.spacing; i++) {
        snake.history.push({ x: snake.head.x, y: snake.head.y + i * snake.speed });
      }

      for (let i = 0; i < MAX_FOODS; i++) spawnFood();

      document.getElementById('menu-screen').classList.add('hidden');
      document.getElementById('result-screen').classList.add('hidden');
      gameState = 'playing';
      updateHud();
      animationFrame = requestAnimationFrame(gameLoop);
    }

    function spawnFood() {
      const preferCurrent = Math.random() < .38;
      const targetInfo = preferCurrent ? currentTarget : activeTargets[Math.floor(Math.random() * activeTargets.length)];
      const emojiList = ITEMS_DB[targetInfo.id] || [targetInfo.shape];
      const margin = 130;

      foods.push({
        x: Math.random() * (MAP_SIZE - margin * 2) + margin,
        y: Math.random() * (MAP_SIZE - margin * 2) + margin,
        typeId: targetInfo.id,
        label: Math.random() < .52 ? emojiList[Math.floor(Math.random() * emojiList.length)] : targetInfo.shape,
        color: targetInfo.color,
        dark: targetInfo.dark,
        floatOffset: Math.random() * Math.PI * 2,
        spin: Math.random() * Math.PI * 2
      });
    }

    function updateHud() {
      document.getElementById('score').textContent = score;
      document.getElementById('win-score').textContent = winScore;
      document.getElementById('target-text').textContent = currentTarget.name;
      document.getElementById('target-emoji').textContent = currentTarget.shape;
      document.getElementById('target-emoji').style.color = currentTarget.color;
      document.getElementById('tail-count').textContent = snake.parts.length;
      document.getElementById('progress-fill').style.width = Math.min((score / winScore) * 100, 100) + '%';
    }

    function showFlash(id) {
      const el = document.getElementById(id);
      el.style.opacity = '1';
      setTimeout(() => { el.style.opacity = '0'; }, 160);
    }

    function loadLeaderboard() {
      const lbDiv = document.getElementById('leaderboard');
      const scores = JSON.parse(localStorage.getItem('sekilAvcisi3DScores') || '[]');
      lbDiv.innerHTML = '<div class="lb-title"><span>🏆 Rekorlar</span><span>En iyi 5</span></div>';

      if (!scores.length) {
        lbDiv.innerHTML += '<div class="lb-row"><span>İlk rekor hazır</span><span>⭐ 0</span></div>';
        return;
      }

      scores
        .sort((a, b) => b.score - a.score)
        .slice(0, 5)
        .forEach((entry, index) => {
          const row = document.createElement('div');
          row.className = 'lb-row' + (index === 0 ? ' gold' : '');
          row.innerHTML = `<span>${index + 1}. ${entry.name}</span><span>⭐ ${entry.score}</span>`;
          lbDiv.appendChild(row);
        });
    }

    function saveScoreAndReturn() {
      const input = document.getElementById('player-name');
      const name = input.value.trim() || 'Şekil Avcısı';
      const scores = JSON.parse(localStorage.getItem('sekilAvcisi3DScores') || '[]');
      scores.push({ name, score, grade: currentGrade, date: new Date().toISOString() });
      localStorage.setItem('sekilAvcisi3DScores', JSON.stringify(scores.slice(-40)));
      input.value = '';
      document.getElementById('result-screen').classList.add('hidden');
      document.getElementById('menu-screen').classList.remove('hidden');
      gameState = 'menu';
      loadLeaderboard();
      draw(Date.now());
    }

    function gameLoop(timestamp) {
      if (gameState !== 'playing') return;

      snake.head.x += Math.cos(snake.angle) * snake.speed;
      snake.head.y += Math.sin(snake.angle) * snake.speed;

      if (snake.head.x < TILE_SIZE) {
        snake.head.x = TILE_SIZE;
        snake.angle = Math.PI - snake.angle;
      } else if (snake.head.x > MAP_SIZE - TILE_SIZE) {
        snake.head.x = MAP_SIZE - TILE_SIZE;
        snake.angle = Math.PI - snake.angle;
      }

      if (snake.head.y < TILE_SIZE) {
        snake.head.y = TILE_SIZE;
        snake.angle = -snake.angle;
      } else if (snake.head.y > MAP_SIZE - TILE_SIZE) {
        snake.head.y = MAP_SIZE - TILE_SIZE;
        snake.angle = -snake.angle;
      }

      snake.history.unshift({ x: snake.head.x, y: snake.head.y });
      const maxHistory = (snake.parts.length + 5) * snake.spacing;
      if (snake.history.length > maxHistory) snake.history.length = maxHistory;

      for (let i = foods.length - 1; i >= 0; i--) {
        const food = foods[i];
        const hitDistance = TILE_SIZE * .92;
        if (Math.hypot(snake.head.x - food.x, snake.head.y - food.y) < hitDistance) {
          if (food.typeId === currentTarget.id) {
            score += POINTS_PER_ITEM;
            targetProgress++;
            snake.parts.push({ shape: food.label, color: food.color, dark: food.dark });
            playSound('eat');

            if (targetProgress >= 3 && score < winScore) {
              currentTarget = getNewTarget(currentTarget.id);
              targetProgress = 0;
              playSound('level');
              showFlash('level-flash');
            }

            if (score >= winScore) {
              finishGame(true);
              return;
            }
          } else {
            snake.parts.pop();
            playSound('wrong');
            showFlash('damage-flash');
            if (snake.parts.length <= 0) {
              finishGame(false);
              return;
            }
          }

          foods.splice(i, 1);
          spawnFood();
          updateHud();
        }
      }

      draw(timestamp);
      animationFrame = requestAnimationFrame(gameLoop);
    }

    function finishGame(won) {
      gameState = 'gameover';
      cancelAnimationFrame(animationFrame);
      document.getElementById('result-screen').classList.remove('hidden');
      document.getElementById('final-score').textContent = score;

      if (won) {
        playSound('win');
        throwConfetti();
        document.getElementById('result-icon').textContent = '🏆';
        document.getElementById('result-title').textContent = 'Mükemmelsin!';
        document.getElementById('result-message').textContent = 'Hedef şekilleri takip ettin ve Şekil Avcısı oldun.';
        document.getElementById('save-score-area').classList.remove('hidden');
        document.getElementById('restartBtn').classList.add('hidden');
      } else {
        document.getElementById('result-icon').textContent = '💫';
        document.getElementById('result-title').textContent = 'Tekrar Deneyelim';
        document.getElementById('result-message').textContent = 'Kuyruk bitti. Hedef şekle daha dikkatli yaklaşabilirsin.';
        document.getElementById('save-score-area').classList.add('hidden');
        document.getElementById('restartBtn').classList.remove('hidden');
      }
    }

    function draw(timestamp) {
      ctx.fillStyle = '#eef7fb';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      const cameraX = canvas.width / 2 - snake.head.x;
      const cameraY = canvas.height / 2 - snake.head.y;

      ctx.save();
      ctx.translate(cameraX, cameraY);

      drawWorld();

      const renderQueue = [];
      foods.forEach(food => {
        const floatY = Math.sin(timestamp * .003 + food.floatOffset) * 6;
        renderQueue.push({ type: 'food', x: food.x, y: food.y + floatY, data: food });
      });

      snake.parts.forEach((part, index) => {
        const historyIndex = Math.min((index + 1) * snake.spacing, snake.history.length - 1);
        const pos = snake.history[historyIndex];
        if (pos) renderQueue.push({ type: 'part', x: pos.x, y: pos.y, data: part });
      });

      if (currentTarget) renderQueue.push({ type: 'head', x: snake.head.x, y: snake.head.y, data: currentTarget });
      renderQueue.sort((a, b) => a.y - b.y);

      renderQueue.forEach(item => {
        if (item.type === 'head') {
          draw3DBlock(item.x, item.y, TILE_SIZE * 1.08, item.data.color, item.data.dark, item.data.shape, true);
        } else if (item.type === 'part') {
          draw3DBlock(item.x, item.y, TILE_SIZE * .92, item.data.color, item.data.dark, item.data.shape, false);
        } else {
          draw3DBlock(item.x, item.y, TILE_SIZE * .84, item.data.color, item.data.dark, item.data.label, false);
        }
      });

      ctx.restore();
    }

    function drawWorld() {
      ctx.fillStyle = '#f8fbff';
      ctx.fillRect(0, 0, MAP_SIZE, MAP_SIZE);

      const grid = 96;
      ctx.strokeStyle = '#e1ebf4';
      ctx.lineWidth = 2;
      ctx.beginPath();
      for (let x = 0; x <= MAP_SIZE; x += grid) {
        ctx.moveTo(x, 0);
        ctx.lineTo(x, MAP_SIZE);
      }
      for (let y = 0; y <= MAP_SIZE; y += grid) {
        ctx.moveTo(0, y);
        ctx.lineTo(MAP_SIZE, y);
      }
      ctx.stroke();

      ctx.fillStyle = 'rgba(247, 189, 36, .18)';
      for (let i = 0; i < 22; i++) {
        const x = (i * 311) % MAP_SIZE;
        const y = (i * 557) % MAP_SIZE;
        ctx.beginPath();
        ctx.arc(x, y, 5 + (i % 4), 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.strokeStyle = '#cad8e8';
      ctx.lineWidth = 12;
      ctx.strokeRect(0, 0, MAP_SIZE, MAP_SIZE);
    }

    function draw3DBlock(cx, cy, size, topColor, sideColor, label, isHead) {
      const depth = size * .45;
      const radius = Math.max(8, size * .16);

      ctx.fillStyle = 'rgba(20, 19, 52, .16)';
      roundedRect(cx - size / 2 + 12, cy - size / 2 + depth + 14, size, size, radius);
      ctx.fill();

      ctx.fillStyle = sideColor;
      roundedRect(cx - size / 2, cy - size / 2 + depth, size, size, radius);
      ctx.fill();

      const gradient = ctx.createLinearGradient(cx - size / 2, cy - size / 2, cx + size / 2, cy + size / 2);
      gradient.addColorStop(0, lighten(topColor, 18));
      gradient.addColorStop(1, topColor);
      ctx.fillStyle = gradient;
      roundedRect(cx - size / 2, cy - size / 2, size, size, radius);
      ctx.fill();

      ctx.strokeStyle = 'rgba(255, 255, 255, .72)';
      ctx.lineWidth = Math.max(2, size * .05);
      roundedRect(cx - size / 2 + 4, cy - size / 2 + 4, size - 8, size - 8, radius * .75);
      ctx.stroke();

      if (isHead) {
        drawEyes(cx, cy, size);
        return;
      }

      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = `900 ${Math.floor(size * .52)}px "Nunito", system-ui, sans-serif`;
      ctx.fillText(label, cx, cy + size * .03);
    }

    function drawEyes(cx, cy, size) {
      const eyeY = cy - size * .22;
      const leftX = cx - size * .23;
      const rightX = cx + size * .23;
      const pupilX = Math.cos(snake.angle) * size * .045;
      const pupilY = Math.sin(snake.angle) * size * .045;

      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(leftX, eyeY, size * .16, 0, Math.PI * 2);
      ctx.arc(rightX, eyeY, size * .16, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#17113f';
      ctx.beginPath();
      ctx.arc(leftX + pupilX, eyeY + pupilY, size * .065, 0, Math.PI * 2);
      ctx.arc(rightX + pupilX, eyeY + pupilY, size * .065, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = 'rgba(20, 19, 52, .22)';
      ctx.lineWidth = size * .035;
      ctx.beginPath();
      ctx.arc(cx, cy + size * .12, size * .20, .1, Math.PI - .1);
      ctx.stroke();
    }

    function roundedRect(x, y, width, height, radius) {
      ctx.beginPath();
      if (ctx.roundRect) {
        ctx.roundRect(x, y, width, height, radius);
      } else {
        ctx.moveTo(x + radius, y);
        ctx.arcTo(x + width, y, x + width, y + height, radius);
        ctx.arcTo(x + width, y + height, x, y + height, radius);
        ctx.arcTo(x, y + height, x, y, radius);
        ctx.arcTo(x, y, x + width, y, radius);
      }
    }

    function lighten(hex, percent) {
      const raw = hex.replace('#', '');
      const num = parseInt(raw, 16);
      const amt = Math.round(2.55 * percent);
      const r = Math.min(255, (num >> 16) + amt);
      const g = Math.min(255, (num >> 8 & 255) + amt);
      const b = Math.min(255, (num & 255) + amt);
      return '#' + (0x1000000 + r * 0x10000 + g * 0x100 + b).toString(16).slice(1);
    }

    function throwConfetti() {
      const colors = ['#16a979', '#20c5d3', '#f7bd24', '#f16455', '#d93d84', '#6c3ded'];
      for (let i = 0; i < 70; i++) {
        const conf = document.createElement('span');
        conf.className = 'confetti';
        conf.style.left = Math.random() * 100 + '%';
        conf.style.top = '-20px';
        conf.style.background = colors[Math.floor(Math.random() * colors.length)];
        conf.style.width = Math.random() * 10 + 6 + 'px';
        conf.style.height = Math.random() * 14 + 7 + 'px';
        conf.style.animationDuration = Math.random() * 1.6 + 2.2 + 's';
        conf.style.animationDelay = Math.random() * .35 + 's';
        if (Math.random() > .55) conf.style.borderRadius = '50%';
        container.appendChild(conf);
        setTimeout(() => conf.remove(), 4300);
      }
    }

    loadLeaderboard();
    draw(Date.now());
  </script>
</body>
