<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Besin Avcısı - Fen Bilimleri Oyunu</title>
  <meta name="description" content="4. Sınıf Fen Bilimleri besin içerikleri ve görevleri oyunu.">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    :root {
      --ink: #15213d;
      --muted: #60708d;
      --line: #dbe6f5;
      --paper: #ffffff;
      --shadow: 0 18px 42px rgba(21, 33, 61, 0.14);
      
      /* Doğa ve Sağlık Teması */
      --hero-bg: linear-gradient(135deg, #FF9800, #43A047);
      --board-bg: linear-gradient(180deg, #E8F5E9 0%, #C8E6C9 100%);
      --board-border: #81C784;
      
      /* Grup Renkleri (İnfografikten İlhamla) */
      --color-yapici: #7E57C2; /* Mor (Proteinler) */
      --color-enerji: #FFA000; /* Turuncu (Karbonhidrat/Yağ) */
      --color-duzen: #00ACC1; /* Turkuaz/Mavi (Su/Vitamin) */
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: var(--font-body, "Nunito", system-ui, sans-serif);
      color: var(--ink);
      background: #f4f7fb;
      min-height: 100vh;
    }

    .page {
      max-width: 1240px;
      margin: 0 auto;
      padding: 12px 14px 48px;
    }

    .game-shell {
      overflow: hidden;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.98);
      border: 1px solid rgba(53, 167, 255, 0.14);
      box-shadow: var(--shadow);
    }

    /* ANA SİTEDEKİ ÇAKIŞMAYI ENGELLEYEN HERO AYARLARI */
    .hero {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: space-between;
      align-items: center;
      padding: 18px 22px;
      color: white;
      background: var(--hero-bg);
      min-height: 0 !important;
      height: auto !important;
    }

    .hero-text { flex: 1 1 min-content; min-width: 250px; z-index: 2; }
    .hero h1 { margin: 6px 0 4px; font-family: var(--font-display, "Fredoka", system-ui, sans-serif); font-size: clamp(1.6rem, 3.5vw, 2.5rem); line-height: 1.05; }
    .hero p { margin: 0; font-weight: 800; font-size: 0.95rem; line-height: 1.4; opacity: 0.95; }
    .kicker { display: inline-flex; padding: 6px 12px; border-radius: 999px; background: rgba(255, 255, 255, 0.25); font-size: 0.75rem; font-weight: 900; text-transform: uppercase; color: inherit; }

    .stats { display: flex; flex-wrap: wrap; gap: 8px; z-index: 2;}
    .stat { flex: 1; min-width: 80px; padding: 10px 14px; border-radius: 16px; background: rgba(255, 255, 255, 0.25); text-align: center; backdrop-filter: blur(10px); color: inherit; }
    .stat span { display: block; font-size: 0.7rem; font-weight: 900; text-transform: uppercase; opacity: 0.8; }
    .stat strong { display: block; margin-top: 2px; font-size: 1.3rem; font-weight: 900; }

    .setup { display: grid; grid-template-columns: 1fr; gap: 16px; padding: 14px 18px; background: #f8fbff; border-bottom: 1px solid var(--line); }
    .setup-panel { border: 1px solid var(--line); border-radius: 22px; background: white; padding: 16px; box-shadow: 0 12px 24px rgba(21, 33, 61, 0.05); }
    .section-title { margin: 0 0 10px; font-family: var(--font-display, "Fredoka", system-ui, sans-serif); font-size: 1.1rem; color: var(--ink); }

    .choice-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
    .choice-btn { border: 0; font-family: inherit; font-weight: 800; cursor: pointer; transition: all 0.2s ease; min-height: 68px; padding: 10px; border-radius: 16px; background: #f6f9ff; border: 2px solid var(--line); color: var(--ink); text-align: left; }
    .choice-btn strong { display: block; font-size: 1rem; }
    .choice-btn span { display: block; margin-top: 4px; color: var(--muted); font-size: 0.8rem; font-weight: 600; line-height: 1.2;}
    .choice-btn:hover { transform: translateY(-2px); }
    .choice-btn.is-active { background: #E8F5E9; border-color: #4CAF50; color: #1B5E20; box-shadow: 0 8px 16px rgba(76, 175, 80, 0.15); }

    .control-row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; padding: 12px 18px; border-bottom: 1px solid var(--line); background: white; }
    .control-btn { border: 0; font-family: inherit; font-weight: 800; cursor: pointer; min-height: 44px; padding: 10px 16px; border-radius: 14px; background: #f6f9ff; border: 2px solid var(--line); color: var(--muted); transition: all 0.2s ease;}
    .control-btn.is-active { background: #fff3ce; border-color: rgba(255, 209, 102, 0.8); color: #79530c; }

    /* OYUN ALANI */
    .board-wrap {
      padding: clamp(20px, 5vw, 40px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      background: var(--board-bg);
      border-bottom-left-radius: 30px;
      border-bottom-right-radius: 30px;
      position: relative;
    }

    /* SORU KARTI */
    .question-card {
      background: white;
      border: 4px solid var(--board-border);
      border-radius: 24px;
      width: 100%;
      max-width: 600px;
      padding: 30px;
      text-align: center;
      box-shadow: 0 12px 24px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 15px;
      min-height: 220px;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .q-emoji {
      font-size: clamp(4rem, 10vw, 6rem);
      line-height: 1;
      filter: drop-shadow(0 8px 8px rgba(0,0,0,0.15));
      animation: floatItem 3s ease-in-out infinite;
    }

    .q-text {
      font-family: var(--font-display, "Fredoka", system-ui, sans-serif);
      font-size: clamp(1.4rem, 4vw, 1.8rem);
      color: var(--ink);
      font-weight: 800;
    }

    @keyframes floatItem {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    /* KATEGORİ SEÇENEKLERİ */
    .category-container {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: clamp(10px, 2vw, 20px);
      width: 100%;
      max-width: 900px;
    }

    .cat-btn {
      background: white;
      border: 4px solid #ccc;
      border-radius: 20px;
      padding: 20px 10px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.1);
      transition: all 0.2s ease;
    }

    .cat-btn:hover {
      transform: translateY(-5px);
      box-shadow: 0 14px 24px rgba(0,0,0,0.15);
    }

    .cat-icon {
      font-size: 2.5rem;
      background: #f4f7fb;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cat-title {
      font-family: var(--font-display, "Fredoka", system-ui, sans-serif);
      font-size: clamp(1rem, 2vw, 1.3rem);
      font-weight: 900;
      line-height: 1.2;
    }

    .cat-sub {
      font-size: 0.8rem;
      font-weight: 800;
      opacity: 0.8;
    }

    /* Kategori Özel Renkleri */
    .cat-btn.c-yapici { border-color: var(--color-yapici); color: var(--color-yapici); }
    .cat-btn.c-yapici .cat-icon { background: rgba(126, 87, 194, 0.1); }
    
    .cat-btn.c-enerji { border-color: var(--color-enerji); color: var(--color-enerji); }
    .cat-btn.c-enerji .cat-icon { background: rgba(255, 160, 0, 0.1); }
    
    .cat-btn.c-duzen { border-color: var(--color-duzen); color: var(--color-duzen); }
    .cat-btn.c-duzen .cat-icon { background: rgba(0, 172, 193, 0.1); }

    .cat-btn:active { transform: translateY(2px); }

    /* GERİ BİLDİRİM EKRANI */
    .feedback {
      width: 100%;
      max-width: 600px;
      min-height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px 14px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.95);
      color: #38516d;
      font-weight: 900;
      text-align: center;
      line-height: 1.4;
      font-size: 1.1rem;
      box-shadow: 0 8px 16px rgba(0,0,0,0.1);
      transition: all 0.3s ease;
    }

    .feedback.good { background: #e9f9df; color: #28651d; transform: scale(1.02); border: 2px solid #a7f36b; }
    .feedback.bad { background: #fff0f0; color: #982727; transform: scale(0.98); border: 2px solid #ffb3b3;}

    .question-card.is-correct { animation: pulseGreen 0.5s ease; border-color: #4CAF50; background: #E8F5E9;}
    .question-card.is-wrong { animation: shake 0.4s ease; border-color: #F44336; background: #FFEBEE;}

    .hidden { display: none !important; }

    @keyframes pulseGreen { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }

    @media (max-width: 768px) {
      .category-container { grid-template-columns: 1fr; max-width: 400px;}
      .cat-btn { flex-direction: row; text-align: left; padding: 15px; }
      .cat-info { flex: 1; display: flex; flex-direction: column;}
      .cat-icon { width: 50px; height: 50px; font-size: 1.8rem; }
    }

    @media (max-width: 600px) {
      .page { padding: 10px 8px 40px; }
      .game-shell { border-radius: 20px; }
      .hero { flex-direction: column; align-items: stretch; text-align: center; }
      .stats { justify-content: center; }
      .choice-row { grid-template-columns: 1fr 1fr; }
      .question-card { min-height: 160px; padding: 20px;}
      .q-emoji { font-size: 4rem; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="game-shell" aria-label="Besin Avcısı Oyunu">
      <header class="hero">
        <div class="hero-text">
          <span class="kicker">Fen Bilimleri • Besinlerimiz</span>
          <h1>Sağlıklı Yaşam: Besin Avcısı</h1>
          <p>Yediğimiz besinlerin görevlerini biliyor musun? Ekrana gelen bilgiyi doğru gruba yerleştir!</p>
        </div>
        <div class="stats">
          <div class="stat"><span>Soru</span><strong id="levelText">1/10</strong></div>
          <div class="stat"><span>Puan</span><strong id="scoreText">0</strong></div>
        </div>
      </header>

      <section class="setup" id="setupScreen">
        <div class="setup-panel">
          <h2 class="section-title">Oyun Modunu Seç</h2>
          <div class="choice-row" id="modeChoices">
            <button class="choice-btn is-active" type="button" data-mode="foods"><strong>Besinleri Grupla</strong><span>Et, süt, ekmek nereye aittir?</span></button>
            <button class="choice-btn" type="button" data-mode="functions"><strong>Görevleri Eşleştir</strong><span>Enerji vermek kimin görevi?</span></button>
            <button class="choice-btn" type="button" data-mode="mixed"><strong>Karışık Mod</strong><span>Hem besinler hem görevler</span></button>
          </div>
        </div>
      </section>

      <nav class="control-row">
        <div class="control-group">
          <button class="control-btn is-active" type="button" id="soundToggle" aria-pressed="true">Ses Açık</button>
          <button class="control-btn" type="button" id="setupToggle">Ayarlar</button>
        </div>
      </nav>

      <section class="board-wrap">
        <div class="feedback" id="feedback">Yukarıdaki besin veya görevi doğru gruba tıkla.</div>
        
        <div class="question-card" id="questionCard">
          <div class="q-emoji" id="qEmoji">❓</div>
          <div class="q-text" id="qText">Soru yükleniyor...</div>
        </div>

        <div class="category-container">
          <button class="cat-btn c-yapici" data-cat="yapici">
            <div class="cat-icon">💪</div>
            <div class="cat-info">
                <div class="cat-title">Yapıcı ve Onarıcılar</div>
                <div class="cat-sub">Proteinler</div>
            </div>
          </button>
          
          <button class="cat-btn c-enerji" data-cat="enerji">
            <div class="cat-icon">⚡</div>
            <div class="cat-info">
                <div class="cat-title">Enerji Vericiler</div>
                <div class="cat-sub">Karbonhidrat ve Yağlar</div>
            </div>
          </button>
          
          <button class="cat-btn c-duzen" data-cat="duzenleyici">
            <div class="cat-icon">🛡️</div>
            <div class="cat-info">
                <div class="cat-title">Düzenleyiciler</div>
                <div class="cat-sub">Su, Vitamin, Mineraller</div>
            </div>
          </button>
        </div>

      </section>
    </section>
  </main>

  <script src="/js/site-data.js"></script>
  <script src="/js/site.js"></script>
  
  <script>
    // İnfografiğe göre hazırlanmış Soru Veritabanı
    const DB_FOODS = [
      { text: "Et ve Balık", emoji: "🥩", cat: "yapici" },
      { text: "Süt ve Yoğurt", emoji: "🥛", cat: "yapici" },
      { text: "Yumurta", emoji: "🥚", cat: "yapici" },
      { text: "Ekmek", emoji: "🍞", cat: "enerji" },
      { text: "Makarna ve Tahıllar", emoji: "🍝", cat: "enerji" },
      { text: "Tereyağı", emoji: "🧈", cat: "enerji" },
      { text: "Çikolata ve Tatlılar", emoji: "🍫", cat: "enerji" },
      { text: "Sebzeler", emoji: "🥦", cat: "duzenleyici" },
      { text: "Meyveler", emoji: "🍎", cat: "duzenleyici" },
      { text: "Su", emoji: "💧", cat: "duzenleyici" }
    ];

    const DB_FUNCTIONS = [
      { text: "Büyüme ve kas gelişimini sağlar.", emoji: "📏", cat: "yapici" },
      { text: "Yaraların onarılmasını sağlar.", emoji: "🩹", cat: "yapici" },
      { text: "Günlük enerji ihtiyacını karşılar.", emoji: "🏃", cat: "enerji" },
      { text: "Fazla tüketimi kilo (obezite) yapar.", emoji: "⚖️", cat: "enerji" },
      { text: "Vücut sıcaklığını düzenler.", emoji: "🌡️", cat: "duzenleyici" },
      { text: "Zararlı maddelerin atılmasına yardımcı olur.", emoji: "♻️", cat: "duzenleyici" },
      { text: "Sistemlerin çalışmasını sağlar (bağışıklık).", emoji: "🛡️", cat: "duzenleyici" }
    ];

    const state = {
      mode: "foods", // foods, functions, mixed
      currentQ: 1,
      totalQ: 10,
      score: 0,
      soundOn: true,
      locked: false,
      questionData: null
    };

    const els = {
      setup: document.getElementById("setupScreen"),
      qCard: document.getElementById("questionCard"),
      qEmoji: document.getElementById("qEmoji"),
      qText: document.getElementById("qText"),
      levelText: document.getElementById("levelText"),
      scoreText: document.getElementById("scoreText"),
      feedback: document.getElementById("feedback"),
      sound: document.getElementById("soundToggle")
    };

    let audioContext = null;

    function getAudioContext() {
      if (!state.soundOn) return null;
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return null;
      if (!audioContext) audioContext = new AudioContext();
      if (audioContext.state === "suspended") audioContext.resume();
      return audioContext;
    }

    function playTone(freq, type = "sine", duration = 0.15) {
      const ctx = getAudioContext();
      if (!ctx) return;
      const now = ctx.currentTime;
      const oscillator = ctx.createOscillator();
      const gain = ctx.createGain();
      oscillator.type = type;
      oscillator.frequency.setValueAtTime(freq, now);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.1, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
      oscillator.connect(gain).connect(ctx.destination);
      oscillator.start(now);
      oscillator.stop(now + duration + 0.05);
    }

    function playSuccess() {
      const ctx = getAudioContext();
      if (!ctx) return;
      const now = ctx.currentTime;
      [523.25, 659.25, 783.99].forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        const startTime = now + i * 0.1;
        osc.frequency.setValueAtTime(freq, startTime);
        gain.gain.setValueAtTime(0.0001, startTime);
        gain.gain.exponentialRampToValueAtTime(0.15, startTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.3);
        osc.connect(gain).connect(ctx.destination);
        osc.start(startTime);
        osc.stop(startTime + 0.4);
      });
    }

    function playError() {
      const ctx = getAudioContext();
      if (!ctx) return;
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(150, now);
      osc.frequency.exponentialRampToValueAtTime(80, now + 0.3);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.1, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.3);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.4);
    }

    function shuffle(array) {
      return array.slice().sort(() => Math.random() - 0.5);
    }

    function setFeedback(text, tone) {
      els.feedback.className = "feedback" + (tone ? " " + tone : "");
      els.feedback.textContent = text;
    }

    function generateQuestion() {
      state.locked = false;
      els.qCard.classList.remove("is-correct", "is-wrong");
      
      let pool = [];
      if (state.mode === "foods") pool = DB_FOODS;
      else if (state.mode === "functions") pool = DB_FUNCTIONS;
      else pool = DB_FOODS.concat(DB_FUNCTIONS);

      const qList = shuffle(pool);
      // Rastgele birini seç
      state.questionData = qList[0];

      els.qEmoji.textContent = state.questionData.emoji;
      els.qText.textContent = `"${state.questionData.text}"`;

      setFeedback("Aşağıdaki butonlardan doğru grubu seç.", "");
      els.levelText.textContent = `${state.currentQ}/${state.totalQ}`;
      els.scoreText.textContent = state.score;
    }

    function checkAnswer(selectedCat) {
      if (state.locked) return;
      state.locked = true;

      const isCorrect = (selectedCat === state.questionData.cat);

      if (isCorrect) {
        els.qCard.classList.add("is-correct");
        playSuccess();
        state.score += 10;
        els.scoreText.textContent = state.score;
        setFeedback("Harika! Doğru gruba yerleştirdin.", "good");

        setTimeout(() => {
          if(state.currentQ < state.totalQ) {
            state.currentQ++;
            generateQuestion();
          } else {
            setFeedback(`Görev Tamamlandı! Toplam Puanın: ${state.score}`, "good");
            setTimeout(initGame, 3000);
          }
        }, 1500);

      } else {
        els.qCard.classList.add("is-wrong");
        playError();
        setFeedback("Eyvah! Bu bilgi o gruba ait değil.", "bad");
        
        setTimeout(() => {
          els.qCard.classList.remove("is-wrong");
          state.locked = false;
        }, 800);
      }
    }

    function initGame() {
      state.currentQ = 1;
      state.score = 0;
      generateQuestion();
    }

    function selectButton(groupId, value, attr) {
      document.querySelectorAll("#" + groupId + " .choice-btn").forEach(button => {
        button.classList.toggle("is-active", button.dataset[attr] === String(value));
      });
    }

    // Olay Dinleyicileri
    document.querySelectorAll("#modeChoices .choice-btn").forEach(button => {
      button.addEventListener("click", () => {
        state.mode = button.dataset.mode;
        selectButton("modeChoices", state.mode, "mode");
        initGame();
      });
    });

    document.querySelectorAll(".cat-btn").forEach(button => {
      button.addEventListener("click", () => {
        checkAnswer(button.dataset.cat);
      });
    });

    document.getElementById("setupToggle").addEventListener("click", () => {
      els.setup.classList.toggle("hidden");
    });

    els.sound.addEventListener("click", () => {
      state.soundOn = !state.soundOn;
      els.sound.classList.toggle("is-active", state.soundOn);
      els.sound.setAttribute("aria-pressed", String(state.soundOn));
      els.sound.textContent = state.soundOn ? "Ses Açık" : "Ses Kapalı";
      if (state.soundOn) playTone(523.25, "sine", 0.1);
    });

    // Oyunu Başlat
    setTimeout(initGame, 100);
  </script>
</body>
</html>
