<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gökçe ile Odamı Topluyorum - Kemal Öğretmenim</title>
  <meta name="description" content="Çocuklar için geometrik şekilleri ayırt etme sürükle-bırak oyunu.">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    :root {
      --ink: #15213d;
      --muted: #60708d;
      --line: #dbe6f5;
      --paper: #ffffff;
      --shadow: 0 18px 42px rgba(21, 33, 61, 0.14);
      
      /* Temel Tema (Sıcak/Oda Konsepti) */
      --hero-bg: linear-gradient(135deg, #f97316, #fbbf24); /* Turuncu/Sarı Tema */
      --board-bg: url('/gorseller/oyun-oda.webp') no-repeat center center; /* Oluşturulan Görsel */
      --board-size: cover;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: var(--font-body, "Nunito", system-ui, sans-serif);
      color: var(--ink);
      background: #fdfaf4; /* Daha sıcak bir arka plan */
      min-height: 100vh;
    }

    .page {
      max-width: 1240px;
      margin: 0 auto;
      padding: 12px 14px 48px;
    }

    .game-shell {
      overflow: hidden;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.98);
      border: 1px solid rgba(255, 167, 53, 0.14); /* Temaya uygun sınır */
      box-shadow: var(--shadow);
    }

    /* ANA SİTEDEKİ ÇAKIŞMAYI ENGELLEYEN HERO AYARLARI */
    .hero {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: space-between;
      align-items: center;
      padding: 18px 22px;
      color: white;
      background: var(--hero-bg);
    }

    .hero-text { flex: 1 1 min-content; min-width: 250px; }
    .hero h1 { margin: 6px 0 4px; font-family: var(--font-display, "Fredoka", system-ui, sans-serif); font-size: clamp(1.6rem, 3.5vw, 2.5rem); line-height: 1.05; }
    .hero p { margin: 0; font-weight: 800; font-size: 0.95rem; line-height: 1.4; opacity: 0.95; }
    .kicker { display: inline-flex; padding: 6px 12px; border-radius: 999px; background: rgba(255, 255, 255, 0.25); font-size: 0.75rem; font-weight: 900; text-transform: uppercase; color: inherit; }

    .stats { display: flex; flex-wrap: wrap; gap: 8px; }
    .stat { flex: 1; min-width: 80px; padding: 10px 14px; border-radius: 16px; background: rgba(255, 255, 255, 0.25); text-align: center; backdrop-filter: blur(10px); color: inherit; }
    .stat span { display: block; font-size: 0.7rem; font-weight: 900; text-transform: uppercase; opacity: 0.8; }
    .stat strong { display: block; margin-top: 2px; font-size: 1.3rem; font-weight: 900; }

    /* OYUN ALANI - ODA VE SÜRÜKLE BIRAK */
    .board-wrap {
      padding: 0; /* Arka plan resmi tam kaplasın */
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      background: var(--board-bg);
      background-size: var(--board-size);
      border-bottom-left-radius: 30px;
      border-bottom-right-radius: 30px;
      position: relative;
      min-height: 600px; /* Oda görselinin boyutu */
      overflow: hidden;
    }

    /* Gökçe Karakteri */
    .gokce-visual {
      position: absolute;
      top: 150px;
      left: 30px;
      width: 150px;
      z-index: 5;
      pointer-events: none;
      filter: drop-shadow(0 12px 15px rgba(0,0,0,0.2));
    }
    .gokce-visual img { width: 100%; height: auto; }

    /* Gökçe Diyalog Balonu */
    .gokce-speech {
      position: absolute;
      top: 50px;
      left: 170px;
      max-width: 300px;
      padding: 18px 22px;
      background: white;
      border-radius: 20px;
      box-shadow: 0 12px 24px rgba(0,0,0,0.1);
      font-weight: 800;
      color: var(--ink);
      line-height: 1.4;
      z-index: 10;
    }
    .gokce-speech::after {
      content: '';
      position: absolute;
      bottom: 10px;
      left: -15px;
      width: 0; height: 0;
      border-top: 15px solid transparent;
      border-bottom: 15px solid transparent;
      border-right: 15px solid white;
    }

    /* Draggable Eşyalar (Oda görselinin sol tarafında) */
    .draggable-items {
      position: absolute;
      left: 50px;
      top: 250px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      z-index: 20;
    }

    .item-block {
      width: clamp(70px, 12vw, 90px);
      height: clamp(70px, 12vw, 90px);
      cursor: grab;
      user-select: none;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s;
    }
    .item-block:active { cursor: grabbing; transform: scale(1.1) rotate(5deg); }

    /* Drag over efekti */
    .item-block.is-dragging {
      opacity: 0.5;
    }

    /* Drop Baskets (Oda görselinin sağ tarafında) */
    .drop-zones {
      position: absolute;
      right: 50px;
      top: 150px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 30px;
      z-index: 10;
    }

    .drop-basket {
      width: clamp(140px, 18vw, 160px);
      height: clamp(140px, 18vw, 160px);
      border: 5px solid rgba(0,0,0,0); /* Görünmez sınır */
      border-radius: 25px;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    
    /* Basket üzerine gelindiğinde */
    .drop-basket.is-over {
      background-color: rgba(251, 191, 36, 0.1);
      border-color: rgba(251, 191, 36, 0.4);
    }

    /* SİTENİN FEEDBACK YAPISI İLE UYUMLU */
    .feedback-area {
      width: 100%;
      max-width: 600px;
      min-height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px 14px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.95);
      color: #38516d;
      font-weight: 900;
      text-align: center;
      line-height: 1.4;
      font-size: 1.1rem;
      box-shadow: 0 8px 16px rgba(0,0,0,0.1);
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      transition: all 0.3s ease;
    }

    .feedback-area.good { background: #e9f9df; color: #28651d; transform: translateX(-50%) scale(1.02); border: 2px solid #a7f36b; }
    .feedback-area.bad { background: #fff0f0; color: #982727; transform: translateX(-50%) scale(0.98); border: 2px solid #ffb3b3;}

    .hidden { display: none !important; }

    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.15); } 100% { transform: scale(1); } }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }

    @media (max-width: 768px) {
      .page { padding: 10px 8px 40px; }
      .game-shell { border-radius: 20px; }
      .hero { flex-direction: column; align-items: stretch; text-align: center; }
      .stats { justify-content: center; }
      .gokce-visual { width: 100px; top: 180px; left: 10px;}
      .gokce-speech { left: 120px; max-width: 200px; }
      .draggable-items { left: 20px; top: 280px; gap: 10px; }
      .drop-zones { right: 20px; top: 180px; gap: 15px; }
      .feedback-area { width: 90%; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="game-shell" aria-label="Gökçe ile Odamı Topluyorum Oyunu">
      <header class="hero">
        <div class="hero-text">
          <span class="kicker">Geometri • Sürükle Bırak</span>
          <h1>Odamı Topluyorum</h1>
          <p>Eşyaları şekillerine uygun sepetlere atarak Gökçe'ye yardım et!</p>
        </div>
        <div class="stats">
          <div class="stat"><span>Seviye</span><strong id="levelText">1</strong></div>
          <div class="stat"><span>Puan</span><strong id="scoreText">0</strong></div>
        </div>
      </header>

      <section class="board-wrap">
        <div class="gokce-visual">
          <img src="/gorseller/gokce.png" alt="Gökçe Maskot" onerror="this.src='/gorseller/robot-gokce.png'"> 
        </div>
        
        <div class="gokce-speech" id="gokceSpeech">
          Merhaba! Ben Gökçe. Odamı toplamama yardım eder misin? Eşyaları doğru sepetlere at!
        </div>
        
        <div class="draggable-items" id="draggableItems"></div>

        <div class="drop-zones" id="dropZones"></div>

        <div class="feedback-area" id="feedback">Lütfen bir nesneyi sürükleyip doğru sepete bırak.</div>
      </section>
    </section>
  </main>

  <script src="/js/site-data.js"></script>
  <script src="/js/site.js"></script>
  
  <script>
    // MEB Müfredatı Geometri Nesne Eşleştirme (MAT 1.3.3)
    const shapeConfig = {
      shapes: [
        { id: "square", name: "Kare", icon: "🔳" },
        { id: "rectangle", name: "Dikdörtgen", icon: "➖" },
        { id: "circle", name: "Daire", icon: "⭕" },
        { id: "triangle", name: "Üçgen", icon: "🔺" }
      ],
      // 8 Daily Objects (4 core requested, 4 fillers)
      items: [
        { id: "clock", name: "Duvar Saati", shape: "circle", visual: "🕒" },
        { id: "book", name: "Maceracı Kitap", shape: "rectangle", visual: "📖" },
        { id: "pizza", name: "Dilim Pizza", shape: "triangle", visual: "🍕" },
        { id: "gift", name: "Hediye Paketi", shape: "square", visual: "🎁" },
        { id: "ball", name: "Futbol Topu", shape: "circle", visual: "⚽" },
        { id: "block", name: "Şekil Bloğu", shape: "square", visual: "🟧" },
        { id: "frame", name: "Fotoğraf Çerçevesi", shape: "rectangle", visual: "🖼️" },
        { id: "hat", name: "Parti Külahı", shape: "triangle", visual: "🥳" }
      ]
    };

    const state = {
      level: 1,
      score: 0,
      soundOn: true,
      itemsSorted: 0,
      totalItemsToSort: shapeConfig.items.length,
      currentDraggedItem: null,
      locked: false
    };

    const els = {
      items: document.getElementById("draggableItems"),
      zones: document.getElementById("dropZones"),
      levelText: document.getElementById("levelText"),
      scoreText: document.getElementById("scoreText"),
      feedback: document.getElementById("feedback"),
      speech: document.getElementById("gokceSpeech")
    };

    // Sizin Ritmik Sayma Oyunundaki Ses Mantığının Aynısı (AudioContext)
    let audioContext = null;

    function getAudioContext() {
      if (!state.soundOn) return null;
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return null;
      if (!audioContext) audioContext = new AudioContext();
      if (audioContext.state === "suspended") audioContext.resume();
      return audioContext;
    }

    function playTone(freq, type = "sine", duration = 0.3) {
      const ctx = getAudioContext();
      if (!ctx) return;
      const now = ctx.currentTime;
      const oscillator = ctx.createOscillator();
      const gain = ctx.createGain();
      oscillator.type = type;
      oscillator.frequency.setValueAtTime(freq, now);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.15, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
      oscillator.connect(gain).connect(ctx.destination);
      oscillator.start(now);
      oscillator.stop(now + duration + 0.1);
    }

    function playSuccess() {
      const ctx = getAudioContext();
      if (!ctx) return;
      const now = ctx.currentTime;
      const notes = [523.25, 659.25, 783.99, 1046.50]; 
      notes.forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        const startTime = now + i * 0.12;
        osc.frequency.setValueAtTime(freq, startTime);
        gain.gain.setValueAtTime(0.0001, startTime);
        gain.gain.exponentialRampToValueAtTime(0.15, startTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.3);
        osc.connect(gain).connect(ctx.destination);
        osc.start(startTime);
        osc.stop(startTime + 0.4);
      });
    }

    function playError() {
      const ctx = getAudioContext();
      if (!ctx) return;
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(200, now);
      osc.frequency.exponentialRampToValueAtTime(80, now + 0.3);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.1, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.3);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.4);
    }

    // Gökçe Geri Bildirim Sistemi
    const gokceMessages = {
      incorrect: [
        "Hımm, sence bu nesnenin köşeleri o sepet için uygun mu? Tekrar dene!",
        "Bak bakalım bu nesnenin düz mü yoksa yuvarlak hatları mı var?",
        "Yanlış sepet, ama üzülme, tekrar düşünelim!"
      ],
      correct: [
        "Harika! Tam yerine oturdu!",
        "Aferin! Bu nesnenin şeklini doğru bildin.",
        "Odam gittikçe toplanıyor. Teşekkürler!"
      ]
    };

    function updateSpeech(message, tone = "normal") {
      els.speech.textContent = message;
      // Gökçe karakterine puan ve seviyeye göre Firebase/Supabase puan aktarımı yapabilirsiniz.
    }

    function setFeedback(text, tone) {
      els.feedback.className = "feedback-area" + (tone ? " " + tone : "");
      els.feedback.textContent = text;
    }

    function shuffle(array) {
      return array.slice().sort(() => Math.random() - 0.5);
    }

    // HTML Sürükle-Bırak API Entegrasyonu
    function initGame() {
      state.level = 1;
      state.score = 0;
      state.itemsSorted = 0;
      renderGame();
    }

    function renderGame() {
      els.items.innerHTML = "";
      els.zones.innerHTML = "";
      state.itemsSorted = 0;

      // Eşyaları Karıştır ve Render Et
      const shuffledItems = shuffle(shapeConfig.items);
      shuffledItems.forEach(item => {
        const itemEl = document.createElement("div");
        itemEl.className = "item-block";
        itemEl.textContent = item.visual;
        itemEl.id = item.id;
        itemEl.draggable = true;
        itemEl.title = `${item.name} (${shapeConfig.shapes.find(s => s.id === item.shape).name})`;
        
        // Drag olaylarını ata
        itemEl.addEventListener('dragstart', handleDragStart);
        itemEl.addEventListener('dragend', handleDragEnd);

        els.items.appendChild(itemEl);
      });

      // Sepetleri Render Et
      const shuffledShapes = shuffle(shapeConfig.shapes);
      shuffledShapes.forEach(shape => {
        const zoneEl = document.createElement("div");
        zoneEl.className = "drop-basket";
        zoneEl.textContent = shape.icon;
        zoneEl.id = shape.id; // Sepetin ID'si şekil id'si
        zoneEl.title = `${shape.name} Sepeti`;
        
        // Drop olaylarını ata
        zoneEl.addEventListener('dragover', handleDragOver);
        zoneEl.addEventListener('dragleave', handleDragLeave);
        zoneEl.addEventListener('drop', handleDrop);

        els.zones.appendChild(zoneEl);
      });

      els.levelText.textContent = state.level;
      els.scoreText.textContent = state.score;
      setFeedback("Eşyaları doğru şekillerine uygun sepetlere atarak Gökçe'ye yardım et!", "");
      updateSpeech("Merhaba! Odamı toplamama yardım eder misin? Eşyaları doğru sepetlere at!");
    }

    // --- Drag & Drop Olay Yönetimi ---

    function handleDragStart(e) {
      if (state.locked) return;
      state.currentDraggedItem = e.target;
      e.target.classList.add('is-dragging');
      setFeedback("Şimdi bu nesneyi doğru sepetin üzerine götür.", "");
      playTone(440, "triangle", 0.05); // Hafif sürükleme sesi
    }

    function handleDragEnd(e) {
      e.target.classList.remove('is-dragging');
      state.currentDraggedItem = null;
    }

    function handleDragOver(e) {
      e.preventDefault(); // Sürüklemeyi bırakmaya izin ver
      if (state.locked) return;
      e.currentTarget.classList.add('is-over');
    }

    function handleDragLeave(e) {
      e.currentTarget.classList.remove('is-over');
    }

    function handleDrop(e) {
      e.preventDefault();
      const zoneEl = e.currentTarget;
      zoneEl.classList.remove('is-over');
      
      if (state.locked || !state.currentDraggedItem) return;
      state.locked = true;

      const itemData = shapeConfig.items.find(i => i.id === state.currentDraggedItem.id);
      const basketId = zoneEl.id;

      const isCorrect = (itemData.shape === basketId);

      if (isCorrect) {
        handleCorrect(zoneEl, state.currentDraggedItem);
      } else {
        handleIncorrect(zoneEl, state.currentDraggedItem);
      }
    }

    function handleCorrect(zoneEl, itemEl) {
      state.score += 10;
      state.itemsSorted++;
      playSuccess();
      
      itemEl.remove(); // Eşyayı odadan kaldır
      zoneEl.classList.add('pulse'); // Sepeti canlandır

      const randomSpeech = gokceMessages.correct[Math.floor(Math.random() * gokceMessages.correct.length)];
      updateSpeech(randomSpeech, "good");
      setFeedback("Harika! Bu nesnenin şeklini doğru bildin.", "good");

      setTimeout(() => {
        zoneEl.classList.remove('pulse');
        checkCompletion();
        state.locked = false;
      }, 1000);
    }

    function handleIncorrect(zoneEl, itemEl) {
      playError();
      itemEl.classList.add('shake'); // Eşyayı titret

      const randomSpeech = gokceMessages.incorrect[Math.floor(Math.random() * gokceMessages.incorrect.length)];
      updateSpeech(randomSpeech, "bad");
      setFeedback("Eyvah! Yanlış sepet, tekrar düşünelim.", "bad");

      setTimeout(() => {
        itemEl.classList.remove('shake');
        state.locked = false;
      }, 800);
    }

    function checkCompletion() {
      if (state.itemsSorted >= state.totalItemsToSort) {
        state.score += (state.level * 50); // Seviye bonusu
        state.level++;
        updateSpeech("Yaşasın! Odam tertemiz oldu. Teşekkürler!", "celebrate");
        setFeedback(`Seviye ${state.level-1} tamamlandı! Puanın: ${state.score}.`, "good");
        
        setTimeout(() => {
          renderGame(); // Yeni seviye başlat
        }, 2000);
      }
    }

    // CSS için ek animasyon sınıfları (shake, pulse) JS ile eklenebilir veya CSS'e yazılabilir. 
    // Bu kodda UI zaten sitenin Ritmik Sayma yapısına göre hazırlandı.

    window.addEventListener('load', () => {
      // AudioContext'in kullanıcı etkileşimiyle başlatılması için
      document.body.addEventListener('click', getAudioContext, { once: true });
      initGame();
    });
  </script>
</body>
</html>
