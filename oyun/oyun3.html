<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Astro-Matematik - Toplama ve Çıkarma</title>
  <meta name="description" content="İlkokul öğrencileri için uzay temalı toplama ve çıkarma oyunu.">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    :root {
      --ink: #15213d;
      --muted: #60708d;
      --line: #dbe6f5;
      --paper: #ffffff;
      --shadow: 0 18px 42px rgba(21, 33, 61, 0.14);
      
      /* Uzay Macerası Teması */
      --hero-bg: linear-gradient(135deg, #1e1329, #4a00e0);
      --board-bg: linear-gradient(180deg, #141e30 0%, #243b55 100%);
      --board-border: #8e2de2;
      
      --btn-color: #00d2ff;
      --btn-border: #3a7bd5;
      --screen-bg: #e0f7fa;
      --screen-text: #01579b;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: var(--font-body, "Nunito", system-ui, sans-serif);
      color: var(--ink);
      background: #f4f7fb;
      min-height: 100vh;
    }

    .page {
      max-width: 1240px;
      margin: 0 auto;
      padding: 12px 14px 48px;
    }

    .game-shell {
      overflow: hidden;
      border-radius: 30px;
      background: rgba(255, 255, 255, 0.98);
      border: 1px solid rgba(53, 167, 255, 0.14);
      box-shadow: var(--shadow);
    }

    /* ANA SİTEDEKİ ÇAKIŞMAYI ENGELLEYEN HERO AYARLARI */
    .hero {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      justify-content: space-between;
      align-items: center;
      padding: 18px 22px;
      color: white;
      background: var(--hero-bg);
      min-height: 0 !important;
      height: auto !important;
      position: relative;
    }

    .hero-text { flex: 1 1 min-content; min-width: 250px; z-index: 2; }
    .hero h1 { margin: 6px 0 4px; font-family: var(--font-display, "Fredoka", system-ui, sans-serif); font-size: clamp(1.6rem, 3.5vw, 2.5rem); line-height: 1.05; }
    .hero p { margin: 0; font-weight: 800; font-size: 0.95rem; line-height: 1.4; opacity: 0.95; }
    .kicker { display: inline-flex; padding: 6px 12px; border-radius: 999px; background: rgba(255, 255, 255, 0.25); font-size: 0.75rem; font-weight: 900; text-transform: uppercase; color: inherit; }

    .stats { display: flex; flex-wrap: wrap; gap: 8px; z-index: 2;}
    .stat { flex: 1; min-width: 80px; padding: 10px 14px; border-radius: 16px; background: rgba(255, 255, 255, 0.25); text-align: center; backdrop-filter: blur(10px); color: inherit; }
    .stat span { display: block; font-size: 0.7rem; font-weight: 900; text-transform: uppercase; opacity: 0.8; }
    .stat strong { display: block; margin-top: 2px; font-size: 1.3rem; font-weight: 900; }

    .setup { display: grid; grid-template-columns: 1fr; gap: 16px; padding: 14px 18px; background: #f8fbff; border-bottom: 1px solid var(--line); }
    .setup-panel { border: 1px solid var(--line); border-radius: 22px; background: white; padding: 16px; box-shadow: 0 12px 24px rgba(21, 33, 61, 0.05); }
    .section-title { margin: 0 0 10px; font-family: var(--font-display, "Fredoka", system-ui, sans-serif); font-size: 1.1rem; color: var(--ink); }

    .choice-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
    .choice-btn { border: 0; font-family: inherit; font-weight: 800; cursor: pointer; transition: all 0.2s ease; min-height: 68px; padding: 10px; border-radius: 16px; background: #f6f9ff; border: 2px solid var(--line); color: var(--ink); text-align: left; }
    .choice-btn strong { display: block; font-size: 1rem; }
    .choice-btn span { display: block; margin-top: 4px; color: var(--muted); font-size: 0.8rem; font-weight: 600; line-height: 1.2;}
    .choice-btn:hover { transform: translateY(-2px); }
    .choice-btn.is-active { background: #e0f7fa; border-color: #00bcd4; color: #006064; box-shadow: 0 8px 16px rgba(0, 188, 212, 0.15); }

    .control-row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; padding: 12px 18px; border-bottom: 1px solid var(--line); background: white; }
    .control-btn { border: 0; font-family: inherit; font-weight: 800; cursor: pointer; min-height: 44px; padding: 10px 16px; border-radius: 14px; background: #f6f9ff; border: 2px solid var(--line); color: var(--muted); transition: all 0.2s ease;}
    .control-btn.is-active { background: #fff3ce; border-color: rgba(255, 209, 102, 0.8); color: #79530c; }

    /* OYUN ALANI - UZAY PANELİ */
    .board-wrap {
      padding: clamp(20px, 5vw, 40px);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      background: var(--board-bg);
      border-bottom-left-radius: 30px;
      border-bottom-right-radius: 30px;
      position: relative;
    }

    /* MATEMATİK VE TUŞ TAKIMI YAN YANA YERLEŞİMİ */
    .game-interaction-area {
      display: flex;
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: clamp(20px, 5vw, 50px);
      width: 100%;
      max-width: 900px;
    }

    /* Roket Animasyonu */
    .rocket {
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 3.5rem;
      filter: drop-shadow(0 0 15px rgba(0, 210, 255, 0.6));
      animation: floatRocket 3s ease-in-out infinite;
      z-index: 10;
    }

    @keyframes floatRocket {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }

    .rocket.flying {
      animation: flyUp 1s ease-in forwards;
    }

    @keyframes flyUp {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(-100px) scale(0.5); opacity: 0; }
    }

    /* MATEMATİK EKRANI */
    .math-screen {
      background: var(--screen-bg);
      border: 6px solid var(--board-border);
      border-radius: 24px;
      width: 100%;
      max-width: 450px;
      flex: 1;
      padding: 30px 40px;
      font-family: var(--font-display, "Fredoka", system-ui, sans-serif);
      font-size: clamp(3rem, 8vw, 4.5rem);
      font-weight: 900;
      color: var(--screen-text);
      box-shadow: 0 0 30px rgba(142, 45, 226, 0.4), inset 0 0 20px rgba(0,0,0,0.05);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: flex-end; 
      min-height: 280px;
      justify-content: center;
    }

    /* Alt Alta Görünüm */
    .view-vertical {
      flex-direction: column;
      align-items: flex-end;
    }
    .view-vertical .math-row {
      line-height: 1.1;
      letter-spacing: 2px;
    }
    .view-vertical .op-sign {
      position: absolute;
      left: 30px;
      bottom: 110px;
      color: #e91e63;
      font-size: clamp(3rem, 8vw, 4.5rem);
    }
    .view-vertical .math-line {
      width: 100%;
      height: 6px;
      background: var(--screen-text);
      border-radius: 3px;
      margin: 10px 0;
    }
    .view-vertical .answer-box {
      color: #009688;
      min-height: 1.1em;
      letter-spacing: 2px;
    }

    /* Yan Yana Görünüm */
    .view-horizontal {
      flex-direction: row;
      align-items: center;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }
    .view-horizontal .op-sign {
      position: static;
      color: #e91e63;
    }
    .view-horizontal .math-line { display: none; }
    .view-horizontal .answer-box {
      color: #009688;
      min-width: 1.5em;
      border-bottom: 6px dashed #009688;
      text-align: center;
      padding: 0 10px;
    }

    /* RAKAM TUŞ TAKIMI (NUMPAD) */
    .numpad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      width: 100%;
      max-width: 280px;
      flex-shrink: 0;
    }

    .num-btn {
      background: rgba(255, 255, 255, 0.9);
      border: 4px solid var(--btn-border);
      border-radius: 16px;
      font-size: 2rem;
      font-family: var(--font-display, "Fredoka", system-ui, sans-serif);
      font-weight: 900;
      color: var(--ink);
      padding: 15px 0;
      cursor: pointer;
      box-shadow: 0 6px 0 var(--btn-border);
      transition: all 0.1s;
    }

    .num-btn:active {
      transform: translateY(6px);
      box-shadow: 0 0 0 var(--btn-border);
    }

    .num-btn.zero { grid-column: 2; }
    .num-btn.delete { background: #ffebee; border-color: #ff5252; color: #d32f2f; box-shadow: 0 6px 0 #ff5252; }
    .num-btn.submit { grid-column: 1 / -1; background: #e8f5e9; border-color: #4caf50; color: #2e7d32; box-shadow: 0 6px 0 #4caf50; font-size: 1.6rem; letter-spacing: 1px;}

    .feedback {
      width: 100%;
      max-width: 600px;
      min-height: 54px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px 14px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.95);
      color: #38516d;
      font-weight: 900;
      text-align: center;
      line-height: 1.4;
      font-size: 1.1rem;
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
      transition: all 0.3s ease;
    }

    .feedback.good { background: #e9f9df; color: #28651d; transform: scale(1.02); border: 2px solid #a7f36b; }
    .feedback.bad { background: #fff0f0; color: #982727; transform: scale(0.98); border: 2px solid #ffb3b3;}

    .math-screen.is-correct { animation: pulseGreen 0.5s ease; background: #e8f5e9; border-color: #4caf50;}
    .math-screen.is-wrong { animation: shake 0.4s ease; background: #ffebee; border-color: #ff5252;}

    .hidden { display: none !important; }

    /* Animasyonlar */
    @keyframes pulseGreen { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }

    @media (max-width: 768px) {
      .game-interaction-area { flex-direction: column; gap: 20px; }
      .numpad { max-width: 320px; }
      .page { padding: 10px 8px 40px; }
      .game-shell { border-radius: 20px; }
      .hero { flex-direction: column; align-items: stretch; text-align: center; }
      .stats { justify-content: center; }
      .choice-row { grid-template-columns: 1fr 1fr; }
      .math-screen { padding: 20px; font-size: 3rem; min-height: 200px; }
      .view-vertical .op-sign { bottom: 85px; font-size: 3rem; }
      .num-btn { padding: 10px 0; font-size: 1.6rem; border-width: 3px; box-shadow: 0 4px 0 var(--btn-border); }
      .num-btn:active { transform: translateY(4px); box-shadow: 0 0 0; }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="game-shell" aria-label="Toplama ve Çıkarma Oyunu">
      <header class="hero">
        <div class="hero-text">
          <span class="kicker">Matematik • Astro-Matematik</span>
          <h1>Uzay Macerası</h1>
          <p>İşlemleri doğru çöz, roketine yakıt doldur ve uzayın derinliklerine uç!</p>
        </div>
        <div class="stats">
          <div class="stat"><span>Soru</span><strong id="levelText">1/10</strong></div>
          <div class="stat"><span>Puan</span><strong id="scoreText">0</strong></div>
        </div>
      </header>

      <section class="setup" id="setupScreen">
        <div class="setup-panel">
          <h2 class="section-title">Sınıf Seviyesi</h2>
          <div class="choice-row" id="gradeChoices">
            <button class="choice-btn is-active" type="button" data-grade="1"><strong>1. Sınıf</strong><span>20'ye kadar işlemler</span></button>
            <button class="choice-btn" type="button" data-grade="2"><strong>2. Sınıf</strong><span>100'e kadar işlemler</span></button>
            <button class="choice-btn" type="button" data-grade="3"><strong>3. Sınıf</strong><span>3 Basamaklı sayılar</span></button>
            <button class="choice-btn" type="button" data-grade="4"><strong>4. Sınıf</strong><span>4-5 Basamaklı büyük sayılar</span></button>
          </div>
          
          <h2 class="section-title" style="margin-top: 20px;">İşlem Türü</h2>
          <div class="choice-row" id="opChoices">
            <button class="choice-btn is-active" type="button" data-op="add"><strong>Sadece Toplama</strong><span>Sürekli artış (+)</span></button>
            <button class="choice-btn" type="button" data-op="sub"><strong>Sadece Çıkarma</strong><span>Sürekli azalış (-)</span></button>
            <button class="choice-btn" type="button" data-op="mix"><strong>Karışık İşlemler</strong><span>Sürpriz! (+ veya -)</span></button>
          </div>

          <h2 class="section-title" style="margin-top: 20px;">Görünüm</h2>
          <div class="choice-row" id="layoutChoices">
            <button class="choice-btn is-active" type="button" data-layout="vertical"><strong>Alt Alta</strong><span>Klasik yazım</span></button>
            <button class="choice-btn" type="button" data-layout="horizontal"><strong>Yan Yana</strong><span>Denklem tipi</span></button>
          </div>
        </div>
      </section>

      <nav class="control-row">
        <div class="control-group">
          <button class="control-btn is-active" type="button" id="soundToggle" aria-pressed="true">Ses Açık</button>
          <button class="control-btn" type="button" id="setupToggle">Ayarlar</button>
        </div>
      </nav>

      <section class="board-wrap">
        <div class="rocket" id="rocket">🚀</div>
        <div class="feedback" id="feedback">Roketi uçurmak için aşağıdaki işlemi çözmelisin.</div>
        
        <div class="game-interaction-area">
            <div class="math-screen view-vertical" id="mathScreen">
              <div class="op-sign" id="opSign">+</div>
              <div class="math-row" id="num1">0</div>
              <div class="math-row" id="num2">0</div>
              <div class="math-line"></div>
              <div class="answer-box" id="answerBox">?</div>
            </div>

            <div class="numpad">
              <button class="num-btn" data-num="1">1</button>
              <button class="num-btn" data-num="2">2</button>
              <button class="num-btn" data-num="3">3</button>
              <button class="num-btn" data-num="4">4</button>
              <button class="num-btn" data-num="5">5</button>
              <button class="num-btn" data-num="6">6</button>
              <button class="num-btn" data-num="7">7</button>
              <button class="num-btn" data-num="8">8</button>
              <button class="num-btn" data-num="9">9</button>
              <button class="num-btn delete" id="btnDelete">⌫</button>
              <button class="num-btn zero" data-num="0">0</button>
              <button class="num-btn submit" id="btnSubmit">KONTROL ET ✅</button>
            </div>
        </div>

      </section>
    </section>
  </main>

  <script src="/js/site-data.js"></script>
  <script src="/js/site.js?v=20260608-content-safety2"></script>
  
  <script>
    const state = {
      grade: 1,
      operation: "add", // add, sub, mix
      layout: "vertical", // vertical, horizontal
      currentQ: 1,
      totalQ: 10,
      score: 0,
      soundOn: true,
      locked: false,
      
      num1: 0,
      num2: 0,
      currentOp: "+", 
      correctAnswer: 0,
      userAnswer: ""
    };

    const els = {
      setup: document.getElementById("setupScreen"),
      mathScreen: document.getElementById("mathScreen"),
      opSign: document.getElementById("opSign"),
      num1: document.getElementById("num1"),
      num2: document.getElementById("num2"),
      answerBox: document.getElementById("answerBox"),
      rocket: document.getElementById("rocket"),
      levelText: document.getElementById("levelText"),
      scoreText: document.getElementById("scoreText"),
      feedback: document.getElementById("feedback"),
      sound: document.getElementById("soundToggle")
    };

    let audioContext = null;

    function getAudioContext() {
      if (!state.soundOn) return null;
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return null;
      if (!audioContext) audioContext = new AudioContext();
      if (audioContext.state === "suspended") audioContext.resume();
      return audioContext;
    }

    function playTone(freq, type = "sine", duration = 0.15) {
      const ctx = getAudioContext();
      if (!ctx) return;
      const now = ctx.currentTime;
      const oscillator = ctx.createOscillator();
      const gain = ctx.createGain();
      oscillator.type = type;
      oscillator.frequency.setValueAtTime(freq, now);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.1, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
      oscillator.connect(gain).connect(ctx.destination);
      oscillator.start(now);
      oscillator.stop(now + duration + 0.05);
    }

    function playSuccess() {
      const ctx = getAudioContext();
      if (!ctx) return;
      const now = ctx.currentTime;
      [440, 554.37, 659.25, 880].forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "square";
        const startTime = now + i * 0.1;
        osc.frequency.setValueAtTime(freq, startTime);
        gain.gain.setValueAtTime(0.0001, startTime);
        gain.gain.exponentialRampToValueAtTime(0.1, startTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, startTime + 0.3);
        osc.connect(gain).connect(ctx.destination);
        osc.start(startTime);
        osc.stop(startTime + 0.4);
      });
    }

    function playError() {
      const ctx = getAudioContext();
      if (!ctx) return;
      const now = ctx.currentTime;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sawtooth";
      osc.frequency.setValueAtTime(150, now);
      osc.frequency.exponentialRampToValueAtTime(80, now + 0.3);
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.1, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.3);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now);
      osc.stop(now + 0.4);
    }

    function setFeedback(text, tone) {
      els.feedback.className = "feedback" + (tone ? " " + tone : "");
      els.feedback.textContent = text;
    }

    function rand(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function generateQuestion() {
      state.userAnswer = "";
      els.answerBox.textContent = "?";
      els.mathScreen.className = "math-screen " + (state.layout === "vertical" ? "view-vertical" : "view-horizontal");
      
      let a, b;
      let isSub = false;

      if (state.operation === "sub") isSub = true;
      else if (state.operation === "mix") isSub = Math.random() > 0.5;

      if (state.grade === 1) { 
        if (isSub) {
          a = rand(2, 20);
          b = rand(1, a); 
        } else {
          a = rand(1, 15);
          b = rand(1, 20 - a); 
        }
      } else if (state.grade === 2) { 
        if (isSub) {
          a = rand(20, 100);
          b = rand(5, a);
        } else {
          a = rand(10, 80);
          b = rand(5, 100 - a);
        }
      } else if (state.grade === 3) { 
        if (isSub) {
          a = rand(200, 999);
          b = rand(50, a);
        } else {
          a = rand(100, 700);
          b = rand(100, 999 - a);
        }
      } else { 
        if (isSub) {
          a = rand(5000, 99999);
          b = rand(1000, a);
        } else {
          a = rand(1000, 50000);
          b = rand(1000, 99999 - a);
        }
      }

      state.num1 = a;
      state.num2 = b;
      state.currentOp = isSub ? "-" : "+";
      state.correctAnswer = isSub ? (a - b) : (a + b);

      els.num1.textContent = state.num1;
      els.num2.textContent = state.num2;
      els.opSign.textContent = state.currentOp;

      if (state.layout === "horizontal") {
         els.num1.textContent = `${state.num1} ${state.currentOp} ${state.num2} =`;
         els.num2.style.display = "none";
         els.opSign.style.display = "none";
      } else {
         els.num2.style.display = "block";
         els.opSign.style.display = "block";
      }

      state.locked = false;
      setFeedback("Cevabı yaz ve Kontrol Et butonuna bas.", "");
      els.levelText.textContent = `${state.currentQ}/${state.totalQ}`;
      els.scoreText.textContent = state.score;
    }

    // YENİDEN DÜZENLENEN: SAĞDAN SOLA YAZIM (Önce birler basamağı vb.)
    function handleKeyPress(numStr) {
      if (state.locked) return;
      playTone(600, "triangle", 0.1);
      
      if (state.userAnswer.length >= 6) return; 

      // SAĞDAN SOLA EKLENİR (Önce birler, sonra onlar basamağı girilir)
      state.userAnswer = numStr + state.userAnswer;
      
      els.answerBox.textContent = state.userAnswer;
    }

    function handleDelete() {
      if (state.locked || state.userAnswer === "") return;
      playTone(300, "square", 0.1);
      
      // EN SON YAZILAN (EN SOLDAKİ RAKAM) SİLİNİR
      state.userAnswer = state.userAnswer.substring(1);
      
      els.answerBox.textContent = state.userAnswer === "" ? "?" : state.userAnswer;
    }

    function checkAnswer() {
      if (state.locked || state.userAnswer === "") return;
      state.locked = true;

      const isCorrect = parseInt(state.userAnswer) === state.correctAnswer;

      if (isCorrect) {
        els.mathScreen.classList.add("is-correct");
        playSuccess();
        state.score += 10;
        setFeedback("Harika! Roket yakıtını aldı.", "good");
        
        els.rocket.classList.add("flying");

        setTimeout(() => {
          els.rocket.classList.remove("flying");
          els.mathScreen.classList.remove("is-correct");
          
          if(state.currentQ < state.totalQ) {
            state.currentQ++;
            generateQuestion();
          } else {
            setFeedback(`Oyun Bitti! Uzay Macerasını ${state.score} Puan ile tamamladın!`, "good");
            setTimeout(initGame, 3000);
          }
        }, 1500);

      } else {
        els.mathScreen.classList.add("is-wrong");
        playError();
        setFeedback("Eyvah! Yanlış hesaplama. Tekrar deneyelim.", "bad");
        
        setTimeout(() => {
          els.mathScreen.classList.remove("is-wrong");
          state.userAnswer = "";
          els.answerBox.textContent = "?";
          state.locked = false;
        }, 800);
      }
    }

    function initGame() {
      state.currentQ = 1;
      state.score = 0;
      generateQuestion();
    }

    function selectButton(groupId, value, attr) {
      document.querySelectorAll("#" + groupId + " .choice-btn").forEach(button => {
        button.classList.toggle("is-active", button.dataset[attr] === String(value));
      });
    }

    document.querySelectorAll("#gradeChoices .choice-btn").forEach(button => {
      button.addEventListener("click", () => {
        state.grade = Number(button.dataset.grade);
        selectButton("gradeChoices", state.grade, "grade");
        initGame();
      });
    });

    document.querySelectorAll("#opChoices .choice-btn").forEach(button => {
      button.addEventListener("click", () => {
        state.operation = button.dataset.op;
        selectButton("opChoices", state.operation, "op");
        initGame();
      });
    });

    document.querySelectorAll("#layoutChoices .choice-btn").forEach(button => {
      button.addEventListener("click", () => {
        state.layout = button.dataset.layout;
        selectButton("layoutChoices", state.layout, "layout");
        initGame();
      });
    });

    document.querySelectorAll(".num-btn[data-num]").forEach(btn => {
      btn.addEventListener("click", () => handleKeyPress(btn.dataset.num));
    });
    document.getElementById("btnDelete").addEventListener("click", handleDelete);
    document.getElementById("btnSubmit").addEventListener("click", checkAnswer);

    document.getElementById("setupToggle").addEventListener("click", () => {
      els.setup.classList.toggle("hidden");
    });

    els.sound.addEventListener("click", () => {
      state.soundOn = !state.soundOn;
      els.sound.classList.toggle("is-active", state.soundOn);
      els.sound.setAttribute("aria-pressed", String(state.soundOn));
      els.sound.textContent = state.soundOn ? "Ses Açık" : "Ses Kapalı";
      if (state.soundOn) playTone(440, "sine", 0.1);
    });

    window.addEventListener("keydown", (e) => {
      if (e.key >= "0" && e.key <= "9") handleKeyPress(e.key);
      else if (e.key === "Backspace") handleDelete();
      else if (e.key === "Enter") checkAnswer();
    });

    setTimeout(initGame, 100);
  </script>
</body>
</html>
