    <text x="306" y="464" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#2b1b59">Mesajlar</text>
    <text x="306" y="574" font-family="Arial, sans-serif" font-size="34" font-weight="800" fill="#2b1b59">İçerikler</text>
