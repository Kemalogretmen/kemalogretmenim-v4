<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Kemal Öğretmenim mobil uygulama indir</title>
  <desc id="desc">Telefon ekranında Kemal Öğretmenim mobil uygulaması ve yanında ders kartları.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff7d6"/>
      <stop offset=".45" stop-color="#f2e8ff"/>
      <stop offset="1" stop-color="#dffbf4"/>
    </linearGradient>
    <linearGradient id="phone" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#23164f"/>
      <stop offset="1" stop-color="#6c3ded"/>
    </linearGradient>
    <linearGradient id="cta" x1="0" x2="1">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#ff7043"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="26" stdDeviation="26" flood-color="#2b1b59" flood-opacity=".22"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="124" cy="128" r="88" fill="#fff" opacity=".45"/>
  <circle cx="1450" cy="156" r="124" fill="#fff" opacity=".38"/>
  <circle cx="1320" cy="760" r="190" fill="#ffffff" opacity=".28"/>
