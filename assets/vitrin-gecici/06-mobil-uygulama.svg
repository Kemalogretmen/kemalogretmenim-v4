    <rect x="988" y="104" width="110" height="17" rx="8" fill="#36295f"/>
    <circle cx="1042" cy="704" r="28" fill="#ffffff" opacity=".18"/>
    <rect x="908" y="166" width="270" height="76" rx="26" fill="#fff" opacity=".13"/>
    <circle cx="952" cy="204" r="25" fill="#ffd84d"/>
    <text x="994" y="214" font-family="Arial, sans-serif" font-size="28" font-weight="900" fill="#fff">Kemal</text>
    <text x="908" y="300" font-family="Arial, sans-serif" font-size="38" font-weight="900" fill="#fff">Öğretmenim</text>
