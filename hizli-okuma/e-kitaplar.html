  <link rel="stylesheet" href="/css/style.css?v=20260926-dock-size-buttons">

<body data-kemal-shortcut-dock="reading-hub">

  <main class="ebook-shell">
    <section class="library-head">
      <div>
        <span class="library-kicker"><i data-lucide="library"></i> Kısa ve ölçülebilir okuma</span>
        <h1>E-Kitaplık</h1>
        <p>Kitabını seç, sayfaları kendi ritminde çevir, ardından soruları tamamlayıp hız ve anlama karneni al.</p>
      </div>
      <div class="library-stats">
        <div class="library-stat"><strong id="bookCount">0</strong><span>Kitap</span></div>
        <div class="library-stat"><strong id="gradeCount">0</strong><span>Sınıf Düzeyi</span></div>
      </div>
    </section>

    <section class="library-toolbar" aria-label="E-kitap filtreleri">
      <div class="library-search">
        <i data-lucide="search"></i>
        <input type="search" id="bookSearch" placeholder="Kitap veya yazar ara" autocomplete="off">
      </div>
      <div class="grade-tabs" id="gradeTabs"></div>
    </section>

    <section class="ebook-grid" id="ebookGrid" aria-live="polite">
      <div class="ebook-loading"><i data-lucide="loader-circle"></i><p>E-kitaplar yükleniyor...</p></div>
    </section>
  </main>
